<script>
/* ==================== SVG 图形库 ==================== */
/* --- 图标 --- */
function iconSvg(name){
  var p='';
  switch(name){
    case 'back': p='<path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'; break;
    case 'home': p='<path d="M4 11l8-7 8 7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M6 10v9h12v-9" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M10 19v-5h4v5" stroke="currentColor" stroke-width="1.8" fill="none"/>'; break;
    case 'quiz': p='<rect x="5" y="4" width="14" height="16" rx="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M9 9h6M9 12h6M9 15h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'; break;
    case 'flower': p='<circle cx="12" cy="14" r="3" fill="currentColor"/><ellipse cx="12" cy="7" rx="3" ry="4.2" fill="currentColor" opacity=".85"/><ellipse cx="8" cy="10" rx="3" ry="4.2" fill="currentColor" opacity=".85" transform="rotate(72 12 14)"/><ellipse cx="16" cy="10" rx="3" ry="4.2" fill="currentColor" opacity=".85" transform="rotate(-72 12 14)"/>'; break;
    case 'essay': p='<path d="M6 4h9l3 3v13H6z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M15 4v4h4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M9 11h6M9 14h6M9 17h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'; break;
    case 'news': p='<rect x="4" y="5" width="16" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8 9h8M8 12h8M8 15h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'; break;
    case 'check': p='<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8 12.5l3 3 5-6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'; break;
    case 'sun': p='<circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'; break;
    case 'clock': p='<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>'; break;
    case 'calendar': p='<rect x="4" y="5.5" width="16" height="14.5" rx="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M4 10h16M8.5 3.5v3.5M15.5 3.5v3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 13.5h2.5M13.5 13.5H16M8 17h2.5M13.5 17H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'; break;
    default: p='<circle cx="12" cy="12" r="8" fill="currentColor"/>';
  }
  return '<svg viewBox="0 0 24 24" width="24" height="24" fill="none">'+p+'<\x2Fsvg>';
}
function initIcons(){
  var els=document.querySelectorAll('[data-ic]');
  for(var i=0;i<els.length;i++){ els[i].innerHTML=sanitizeHtml(iconSvg(els[i].getAttribute('data-ic'))); }
}

/* --- 花卉 SVG（全阶段，含花盆） --- */
function flowerSVG(variety,stage,w,h){
  var v=VARIETIES[variety]||VARIETIES.rose_red;
  w=w||84; h=h||100;
  var s='<svg viewBox="0 0 84 100" width="'+w+'" height="'+h+'">';
  s+='<path d="M22 90q20 8 40 0l0 5-40 0z" fill="#D9C9A8"/><path d="M22 90q20 8 40 0" fill="#E8DCC4"/>';
  if(stage===0){
    s+='<ellipse cx="42" cy="84" rx="6" ry="9" fill="#B98A4A" stroke="#854F0B" stroke-width="0.6"/>';
  }else{
    var stemEnd=stage===1?72:stage===2?58:stage===3?48:40;
    s+='<line x1="42" y1="92" x2="42" y2="'+stemEnd+'" stroke="#639922" stroke-width="2.2" stroke-linecap="round"/>';
    if(stage===1){ s+=leaf(33,80,-32)+leaf(51,82,32); }
    if(stage>=2){ s+=leaf(33,80,-32)+leaf(51,82,32)+leaf(34,68,-38)+leaf(50,70,38); }
    if(stage===3){
      s+='<ellipse cx="42" cy="'+(stemEnd-8)+'" rx="7" ry="10" fill="#97C459" stroke="#3B6D11" stroke-width="0.6"/>';
      s+='<circle cx="42" cy="'+(stemEnd-15)+'" r="3.5" fill="'+v.petal+'" stroke="'+v.stroke+'" stroke-width="0.6"/>';
    }
    if(stage>=4){
      var cy=stage===4?stemEnd-10:stemEnd-12;
      if(v.type==='rose'){
        if(stage===4){
          s+=petalRing(42,cy,5,11,-9,5,20,v.petal,v.stroke);
          s+='<circle cx="42" cy="'+cy+'" r="4.5" fill="'+v.inner+'" stroke="'+v.stroke+'" stroke-width="0.6"/>';
        }else{
          s+=petalRing(42,cy,6.5,13,-10,8,0,v.petal,v.stroke);
          s+=petalRing(42,cy,4.5,9,-6,4,45,v.inner,v.stroke);
          s+='<circle cx="42" cy="'+cy+'" r="3.6" fill="'+v.center+'"/>';
        }
      }else{
        var np=stage===4?7:12,rx=stage===4?3.6:4.6,ry=stage===4?9:11,off=stage===4?-8:-11;
        s+=petalRing(42,cy,rx,ry,off,np,0,v.petal,v.stroke);
        if(variety==='sun_teddy'&&stage===5){ s+=petalRing(42,cy,2.8,6.5,-5,6,30,v.petal,v.stroke); }
        s+='<circle cx="42" cy="'+cy+'" r="'+(stage===4?5.5:7)+'" fill="'+v.center+'"/>';
        s+='<circle cx="40" cy="'+(cy-2)+'" r="0.9" fill="#F7EBD3"/><circle cx="44.5" cy="'+(cy+1)+'" r="0.9" fill="#F7EBD3"/><circle cx="41.5" cy="'+(cy+3)+'" r="0.9" fill="#F7EBD3"/>';
      }
    }
  }
  s+='<\x2Fsvg>';
  return s;
}

/* --- 水彩写实风花朵 SVG（多品种，带渐变与水彩晕染感） --- */
function flowerWatercolorSVG(variety,stage,w,h){
  var v=VARIETIES[variety]||VARIETIES.rose_red;
  w=w||84; h=h||100;
  // 花盆 + 茎
  var s='<svg viewBox="0 0 84 100" width="'+w+'" height="'+h+'">';
  s+='<defs>';
  // 水彩渐变：柔和的色彩过渡
  s+='<radialGradient id="wc_'+variety+'_p" cx="50%" cy="38%" r="60%">'
    +'<stop offset="0%" stop-color="'+v.petal+'"/><stop offset="70%" stop-color="'+v.inner+'"/><stop offset="100%" stop-color="'+v.stroke+'"/><\x2FradialGradient>';
  s+='<linearGradient id="wc_'+variety+'_stem" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="#7FB84A"/><stop offset="100%" stop-color="#5A8F2E"/><\x2FlinearGradient>';
  s+='<\x2Fdefs>';
  // 陶盆
  s+='<path d="M24 90 q18 9 36 0 l-3 6 q-15 5 -30 0 z" fill="#C9A26B" stroke="#A9834F" stroke-width="1"/>';
  s+='<path d="M24 90 q18 9 36 0" fill="none" stroke="#E0C49A" stroke-width="1.5"/>';
  s+='<rect x="20" y="86" width="44" height="6" rx="3" fill="#B58A55"/>';
  if(stage===0){
    // 花种
    s+='<ellipse cx="42" cy="82" rx="7" ry="10" fill="#9A6B3A" stroke="#7A4E1E" stroke-width="1"/>';
    s+='<path d="M42 78 q3 -6 0 -10" stroke="#9A6B3A" stroke-width="1" fill="none"/>';
  }else{
    var stemEnd=stage===1?70:stage===2?58:stage===3?48:stage===4?44:40;
    var sw=2.6;
    s+='<path d="M42 92 C40 '+(92-10)+' 43 '+(stemEnd+12)+' 42 '+stemEnd+'" fill="none" stroke="url(#wc_'+variety+'_stem)" stroke-width="'+sw+'" stroke-linecap="round"/>';
    // 叶子（水彩感：两层）
    if(stage>=1){
      s+='<path d="M42 80 q-14 -8 -22 -2 q-6 5 2 10 q8 4 16 -1 z" fill="#8CC45E" opacity=".85"/>';
      s+='<path d="M42 74 q14 -8 22 -2 q6 5 -2 10 q-8 4 -16 -1 z" fill="#7FB84A" opacity=".85"/>';
    }
    if(stage>=3){
      // 花苞
      s+='<ellipse cx="42" cy="'+(stemEnd-9)+'" rx="8" ry="12" fill="url(#wc_'+variety+'_p)" stroke="'+v.stroke+'" stroke-width="1"/>';
      s+='<path d="M42 '+(stemEnd-20)+' l-4 10 q4 3 8 0 z" fill="#6FA33E" opacity=".9"/>';
    }
    if(stage>=4){
      var cy=stage===4?stemEnd-12:stemEnd-14;
      if(v.type==='rose'){
        // 写实玫瑰：多层花瓣
        var full=stage===5;
        var nLayers=full?3:2;
        var rOuter=full?14:11;
        for(var L=0;L<nLayers;L++){
          var r=rOuter-L*3.5, op=full?0.92:0.78;
          s+='<g fill="url(#wc_'+variety+'_p)" opacity="'+op+'" stroke="'+v.stroke+'" stroke-width="0.7">';
          var np=full?8:6;
          for(var i=0;i<np;i++){
            var a=(i*360/np+(L*22))*Math.PI/180;
            var px=42+Math.cos(a)*r, py=cy+Math.sin(a)*r*0.8;
            s+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(r*0.55)+'" ry="'+(r*0.4)+'" transform="rotate('+(i*360/np+L*22)+' '+px+' '+py+')"/>';
          }
          s+='<\x2Fg>';
        }
        s+='<circle cx="42" cy="'+cy+'" r="'+(full?4:3)+'" fill="'+v.center+'"/>';
        // 高光
        s+='<ellipse cx="39" cy="'+(cy-4)+'" rx="3" ry="2" fill="#fff" opacity=".35"/>';
      }else{
        // 写实向日葵：双层花瓣 + 花盘
        var np2=stage===5?13:9;
        var rOut2=stage===5?15:12;
        for(var L2=0;L2<2;L2++){
          var r2=L2===0?rOut2:rOut2-5;
          var op2=L2===0?0.9:0.7;
          s+='<g fill="'+v.petal+'" opacity="'+op2+'" stroke="'+v.stroke+'" stroke-width="0.5">';
          for(var i2=0;i2<np2;i2++){
            var a2=(i2*360/np2+(L2*16))*Math.PI/180;
            var px2=42+Math.cos(a2)*r2, py2=cy+Math.sin(a2)*r2*0.9;
            s+='<ellipse cx="'+px2+'" cy="'+py2+'" rx="'+(stage===5?3.8:3)+'" ry="'+(stage===5?7.5:6)+'" transform="rotate('+(i2*360/np2+L2*16)+' '+px2+' '+py2+')"/>';
          }
          s+='<\x2Fg>';
        }
        // 花盘（写实：有籽粒纹理）
        s+='<circle cx="42" cy="'+cy+'" r="'+(stage===5?8:6)+'" fill="'+v.center+'"/>';
        s+='<circle cx="42" cy="'+cy+'" r="'+(stage===5?6:4.5)+'" fill="#8A5A28"/>';
        var seeds=stage===5?9:6;
        for(var si=0;si<seeds;si++){
          var sa=si*360/seeds*Math.PI/180;
          s+='<circle cx="'+(42+Math.cos(sa)*3.4)+'" cy="'+(cy+Math.sin(sa)*3.4)+'" r="0.9" fill="#6E3E18"/>';
        }
      }
    }
  }
  s+='<\x2Fsvg>';
  return s;
}

function petalRing(cx,cy,rx,ry,off,n,rot,fill,stroke){
  return '<path d="M'+x+' '+y+' q'+(angle>0?6:-6)+' -6 '+(angle>0?14:-14)+' -9" fill="none" stroke="#639922" stroke-width="2" stroke-linecap="round"/>';
}
function petalRing(cx,cy,rx,ry,off,n,rot,fill,stroke){
  var s='',i;
  for(i=0;i<n;i++){
    var a=(rot+i*360/n)*Math.PI/180;
    s+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="0.6" transform="translate('+(Math.cos(a)*(rx+off))+','+(Math.sin(a)*(ry+off))+') rotate('+(rot+i*360/n)+')"/>';
  }
  return s;
}

/* ==================== 禅境花园花（3阶段写实风 · 含进度渐进） ==================== */
/* 花盆里的花：陶土花盆 + 写实花。
   参数：variety 品种，stage 阶段(0种子/1萌芽/2开花)，prog 0~1 阶段内进度（决定芽大小/枝长短/花骨朵开放度）
   开花期(prog<1)画「花骨朵（未开放）」，prog 接近 1 时逐渐绽放成完整花朵 */
function zenFlowerSVG(variety,stage,w,h,prog){
  var v=VARIETIES[variety]||VARIETIES.rose_red;
  w=w||84; h=h||99;
  stage=stage==null?2:stage;
  prog=(prog==null||isNaN(prog))?1:prog;
  prog=Math.max(0,Math.min(1,prog));
  var cx=42;
  var s='<svg viewBox="0 0 84 99" width="'+w+'" height="'+h+'">';
  s+='<defs>';
  s+='<radialGradient id="zf_'+variety+'_p" cx="50%" cy="40%" r="62%">'
    +'<stop offset="0%" stop-color="'+v.petal+'"/><stop offset="72%" stop-color="'+v.inner+'"/><stop offset="100%" stop-color="'+v.stroke+'"/><\x2FradialGradient>';
  s+='<linearGradient id="zf_'+variety+'_st" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="#8CC63F"/><stop offset="100%" stop-color="#5A8F2E"/><\x2FlinearGradient>';
  s+='<\x2Fdefs>';

  /* --- 陶土花盆（禅境花园标志性元素） --- */
  s+='<path d="M22 78 l6 14 h28 l6 -14 z" fill="#C98B4E" stroke="#A96B32" stroke-width="1.2"/>';
  s+='<path d="M22 78 l6 14 h28 l6 -14" fill="none" stroke="#E0B77E" stroke-width="1.4"/>';
  s+='<rect x="18" y="73" width="48" height="7" rx="3.5" fill="#B57A40" stroke="#A96B32" stroke-width="1"/>';
  // 盆内泥土（始终有土壤）
  s+='<ellipse cx="42" cy="74" rx="24" ry="4.5" fill="#6E4A22" opacity=".35"/>';
  s+='<ellipse cx="42" cy="73" rx="20" ry="6" fill="#8A5F2E"/>';
  s+='<ellipse cx="42" cy="72" rx="15" ry="4" fill="#9A6B3A"/>';

  if(stage===0){
    /* ===== 种子期：土壤 + 一粒种子，prog 越大芽冒得越高 ===== */
    // 种子（半埋土中，prog 越大露出来越多）
    var seedRy=5+prog*2;
    s+='<ellipse cx="42" cy="'+(71-prog*2)+'" rx="5" ry="'+seedRy+'" fill="#A5763F" stroke="#7A4E1E" stroke-width="1"/>';
    // 刚冒头的小芽（prog 越大越高越绿）
    var sproutH=4+prog*10;   // 芽高度 4~14
    if(prog>0.05){
      var tipY=70-sproutH;
      s+='<path d="M42 70 C41 '+(70-sproutH*0.5)+' 43 '+(tipY+3)+' 42 '+tipY+'" fill="none" stroke="#8CC63F" stroke-width="2.2" stroke-linecap="round"/>';
      var leafSz=2+prog*5;
      s+='<path d="M42 '+(tipY+1)+' q-'+leafSz+' -'+leafSz+' -'+(leafSz+1)+' 0 q'+(leafSz*0.3)+' '+leafSz+' '+leafSz+' '+(leafSz*0.2)+' z" fill="#8CC63F" opacity=".9"/>';
      s+='<path d="M42 '+(tipY+2)+' q'+leafSz+' -'+leafSz+' '+(leafSz+1)+' 0 q-'+(leafSz*0.3)+' '+leafSz+' -'+leafSz+' '+(leafSz*0.2)+' z" fill="#74B032" opacity=".9"/>';
    }
  }else if(stage===1){
    /* ===== 萌芽期：光秃秃的花枝（无花），枝长随 prog 变长 ===== */
    // 茎从泥土长到 stemTop，prog 越大越长越高
    var stemTop=70-prog*26;   // 70(刚萌芽，短) ~ 44(快开花，长)
    s+='<path d="M42 73 C40 66 43 '+(stemTop+10)+' 42 '+stemTop+'" fill="none" stroke="url(#zf_'+variety+'_st)" stroke-width="2.6" stroke-linecap="round"/>';
    // 叶子随高度出现（prog 越大叶子越多/越大）
    if(prog>0.25){
      var leafY1=70-prog*6;
      var lf1=3+prog*6;
      s+='<path d="M42 '+leafY1+' q-'+(lf1+6)+' -'+(lf1+1)+' -'+(lf1+10)+' -1 q-'+(lf1*0.5)+' 4 2 9 q'+(lf1*0.5)+' 4 '+(lf1+4)+' -1 z" fill="#7CB840" opacity=".92"/>';
      s+='<path d="M42 '+leafY1+' q'+(lf1+6)+' -'+(lf1+1)+' '+(lf1+10)+' -1 q'+(lf1*0.5)+' 4 -2 9 q-'+(lf1*0.5)+' 4 -'+(lf1+4)+' -1 z" fill="#69A334" opacity=".92"/>';
    }
    if(prog>0.6){
      var leafY2=stemTop+14;
      var lf2=2+prog*4;
      s+='<path d="M42 '+leafY2+' q-'+(lf2+4)+' -'+(lf2+1)+' -'+(lf2+8)+' -1 q-'+(lf2*0.5)+' 3 1 6 q'+(lf2*0.5)+' 3 '+(lf2+3)+' -1 z" fill="#7CB840" opacity=".85"/>';
      s+='<path d="M42 '+leafY2+' q'+(lf2+4)+' -'+(lf2+1)+' '+(lf2+8)+' -1 q'+(lf2*0.5)+' 3 -1 6 q-'+(lf2*0.5)+' 3 -'+(lf2+3)+' -1 z" fill="#69A334" opacity=".85"/>';
    }
    // 顶端：光秃秃，只有一个很小的嫩芽点（未形成花苞）
    s+='<circle cx="42" cy="'+(stemTop-2)+'" r="2.5" fill="#8CC63F" opacity=".85"/>';
  }else{
    /* ===== 开花期：prog<1 是「花骨朵（未开放）」，prog=1 完全绽放 ===== */
    var stemTop2=44;
    s+='<path d="M42 73 C40 66 43 52 42 '+stemTop2+'" fill="none" stroke="url(#zf_'+variety+'_st)" stroke-width="2.6" stroke-linecap="round"/>';
    // 叶子
    s+='<path d="M42 66 q-13 -7 -20 -1 q-5 4 2 9 q7 4 14 -1 z" fill="#7CB840" opacity=".92"/>';
    s+='<path d="M42 66 q13 -7 20 -1 q5 4 -2 9 q-7 4 -14 -1 z" fill="#69A334" opacity=".92"/>';
    var cy2=stemTop2-13;   // 花朵/花骨朵中心
    var open=prog;         // 开放度 0~1

    if(open<0.999){
      /* ==== 花骨朵：紧闭的花苞，随 prog 略微膨大，颜色透出品种色 ==== */
      // 花萼（绿色托片）
      s+='<path d="M42 '+(cy2-4)+' l-6 8 q6 3 12 0 z" fill="#69A334" opacity=".95"/>';
      s+='<path d="M42 '+(cy2-4)+' l6 8 q-6 3 -12 0 z" fill="#5A8F2E" opacity=".9"/>';
      // 花苞主体：椭圆，随 prog 变大（从紧闭小苞到将开大苞）
      var budRx=4+open*7;      // 4~11
      var budRy=6+open*9;      // 6~15
      s+='<ellipse cx="42" cy="'+(cy2-2)+'" rx="'+budRx+'" ry="'+budRy+'" fill="url(#zf_'+variety+'_p)" stroke="'+v.stroke+'" stroke-width="1"/>';
      // 顶部小尖（花苞闭合的尖端）
      s+='<path d="M42 '+(cy2-2-budRy)+' q-1.5 -5 0 -8 q1.5 3 0 8 z" fill="'+v.inner+'" stroke="'+v.stroke+'" stroke-width="0.6"/>';
      // 花苞上的品种色纹理（prog 越大越明显）
      if(open>0.3){
        s+='<path d="M'+(42-budRx*0.5)+' '+(cy2-2)+' q0 -6 '+(budRx)+' 0" fill="none" stroke="'+v.inner+'" stroke-width="0.8" opacity="'+(open*0.6)+'"/>';
      }
      // 高光
      s+='<ellipse cx="'+(42-budRx*0.3)+'" cy="'+(cy2-4)+'" rx="'+(budRx*0.3)+'" ry="'+(budRy*0.3)+'" fill="#fff" opacity="'+(0.2+open*0.2)+'"/>';
    }else{
      /* ==== 完全绽放 ==== */
      if(v.type==='rose'){
        var layers=3, rOut=15;
        for(var L=0; L<layers; L++){
          var r=rOut-L*4;
          var op=0.94-L*0.08;
          var np=9;
          s+='<g fill="url(#zf_'+variety+'_p)" opacity="'+op+'" stroke="'+v.stroke+'" stroke-width="0.7">';
          for(var i=0;i<np;i++){
            var a=(i*360/np + L*20)*Math.PI/180;
            var px=cx+Math.cos(a)*r, py=cy2+Math.sin(a)*r*0.8;
            s+='<ellipse cx="'+px+'" cy="'+py+'" rx="'+(r*0.58)+'" ry="'+(r*0.44)+'" transform="rotate('+(i*360/np+L*20)+' '+px+' '+py+')"/>';
          }
          s+='<\x2Fg>';
        }
        s+='<circle cx="'+cx+'" cy="'+cy2+'" r="4.5" fill="'+v.center+'"/>';
        s+='<ellipse cx="'+(cx-3)+'" cy="'+(cy2-4)+'" rx="3" ry="2" fill="#fff" opacity=".4"/>';
      }else{
        for(var L2=0; L2<2; L2++){
          var r2=L2===0?16:10.5;
          var op2=L2===0?0.95:0.72;
          var np2=14;
          s+='<g fill="'+v.petal+'" opacity="'+op2+'" stroke="'+v.stroke+'" stroke-width="0.5">';
          for(var i2=0;i2<np2;i2++){
            var a2=(i2*360/np2 + L2*14)*Math.PI/180;
            var px2=cx+Math.cos(a2)*r2, py2=cy2+Math.sin(a2)*r2*0.9;
            s+='<ellipse cx="'+px2+'" cy="'+py2+'" rx="4" ry="8" transform="rotate('+(i2*360/np2+L2*14)+' '+px2+' '+py2+')"/>';
          }
          s+='<\x2Fg>';
        }
        s+='<circle cx="'+cx+'" cy="'+cy2+'" r="8.5" fill="'+v.center+'"/>';
        s+='<circle cx="'+cx+'" cy="'+cy2+'" r="6.5" fill="#8A5A28"/>';
        var seeds=10;
        for(var si=0;si<seeds;si++){
          var sa=si*360/seeds*Math.PI/180;
          s+='<circle cx="'+(cx+Math.cos(sa)*3.8)+'" cy="'+(cy2+Math.sin(sa)*3.8)+'" r="0.9" fill="#6E3E18"/>';
        }
        s+='<circle cx="'+(cx-3)+'" cy="'+(cy2-2)+'" r="1.1" fill="#3A2008"/>';
        s+='<circle cx="'+(cx+3)+'" cy="'+(cy2-2)+'" r="1.1" fill="#3A2008"/>';
        s+='<path d="M'+(cx-3)+' '+(cy2+3)+' q3 2.6 6 0" stroke="#3A2008" stroke-width="1" fill="none" stroke-linecap="round"/>';
      }
    }
  }
  s+='<\x2Fsvg>';
  return s;
}


/* --- 完整花园 SVG（田地+花+蝴蝶+浇水动画） --- */
function gardenSceneSVG(width,height,flowers,opts){
  opts=opts||{};
  width=width||640; height=height||420;
  var s='<svg viewBox="0 0 '+width+' '+height+'" width="100%">';
  // 天空
  s+='<rect width="'+width+'" height="'+height*0.58+'" fill="#C9E6F5"/>';
  // 太阳
  s+='<circle cx="'+(width-64)+'" cy="56" r="26" fill="#F5D76E" opacity=".9"/><circle cx="'+(width-64)+'" cy="56" r="38" fill="#F5D76E" opacity=".22"/>';
  // 云
  s+='<g fill="#fff" opacity=".85"><ellipse cx="'+width*0.2+'" cy="64" rx="32" ry="13"/><ellipse cx="'+width*0.26+'" cy="56" rx="22" ry="11"/><\x2Fg>';
  // 远山
  s+='<path d="M0 '+(height*0.5)+' Q'+(width*0.18)+' '+(height*0.38)+' '+(width*0.36)+' '+(height*0.5)+' Z" fill="#BCD9A0" opacity=".8"/>';
  s+='<path d="M'+(width*0.55)+' '+(height*0.5)+' Q'+(width*0.75)+' '+(height*0.36)+' '+width+' '+(height*0.5)+' Z" fill="#BCD9A0" opacity=".8"/>';
  // 草地
  s+='<rect y="'+height*0.48+'" width="'+width+'" height="'+height*0.22+'" fill="#A8C878"/>';
  // 田地
  s+='<rect y="'+height*0.70+'" width="'+width+'" height="'+height*0.30+'" fill="#8A6B3F"/>';
  // 田地垄沟（透视感：下宽上窄）
  var i;
  for(i=0;i<4;i++){
    var ry=height*(0.74+i*0.07);
    s+='<ellipse cx="'+(width*0.5)+'" cy="'+ry+'" rx="'+(width*0.46)+'" ry="'+(4+i*3)+'" fill="#7A5C32" opacity=".6"/>';
  }
  // 花朵：种在草地上（两排，第二排稍低仍在草地内）
  if(flowers && flowers.length){
    var n=flowers.length;
    var perRow=Math.min(5,Math.max(3,Math.ceil(n/2)));
    flowers.forEach(function(f,idx){
      var row=Math.floor(idx/perRow);
      var col=idx%perRow;
      var rowCount=Math.min(perRow,n-row*perRow);
      var fw=64+row*8;                        // 前排略大
      var fh=fw*100/84;
      var gap=width/(rowCount+0.4);
      var fx=gap*(col+0.7)+(row%2)*gap*0.2;   // 两排错位
      var fy=height*(0.50+row*0.12);          // 花根落在草地内
      var stg=f.stage==null?5:f.stage;
      s+='<g transform="translate('+(fx-fw/2)+','+(fy-fh)+')">'+flowerSVG(f.variety,stg,fw,fh)+'<\x2Fg>';
    });
  }else{
    // 空花园：田里撒几粒种子
    for(i=0;i<5;i++){
      s+='<ellipse cx="'+(width*(0.2+i*0.15))+'" cy="'+(height*0.78+(i%2)*14)+'" rx="4" ry="2.5" fill="#5E431F"/>';
    }
  }
  // 蝴蝶（动画：沿路径飘）
  if(opts.butterfly!==false){
    s+='<g class="butterfly">'
      +'<path d="M0 0 C-9 -11 -20 -6 -15 3 C-9 -2 -4 2 -7 9 C-11 4 -2 7 0 0" fill="#E79BB5" opacity=".85"/>'
      +'<path d="M0 0 C9 -11 20 -6 15 3 C9 -2 4 2 7 9 C11 4 2 7 0 0" fill="#E79BB5" opacity=".85"/>'
      +'<line x1="0" y1="1" x2="0" y2="8" stroke="#7A4A1E" stroke-width="1.4" stroke-linecap="round"/>'
      +'<\x2Fg>';
  }
  s+='<\x2Fsvg>';
  return s;
}

/* --- 图表：横向条形图（模块正确率） --- */
function barChart(rows,opt){
  opt=opt||{};
  var W=620,H=Math.max(200,rows.length*42+56),L=74,R=80,T=30,B=30;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  var maxV=100;
  rows.forEach(function(r){ if(r.v>maxV) maxV=r.v; });
  // 目标线 80%（文字放线右侧，顶部预留 T=30 不被裁剪）
  if(opt.target!=null){
    var tx=L+(W-L-R)*opt.target/maxV;
    s+='<line x1="'+tx+'" y1="'+T+'" x2="'+tx+'" y2="'+(H-B)+'" stroke="#D4A94E" stroke-width="1.5" stroke-dasharray="4 3"/>';
    s+='<text x="'+(tx+5)+'" y="'+(T-8)+'" font-size="11" fill="#B98A2F" font-weight="700">目标 '+opt.target+'%<\x2Ftext>';
  }
  rows.forEach(function(r,i){
    var y=T+i*(H-T-B)/rows.length;
    var bh=(H-T-B)/rows.length-12;
    var bw=(W-L-R)*r.v/maxV;
    s+='<text x="'+(L-8)+'" y="'+(y+bh/2+4)+'" font-size="12" fill="#4A3B2A" text-anchor="end">'+esc(r.name)+'<\x2Ftext>';
    s+='<rect x="'+L+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="6" fill="'+(r.color||'#6F9E4F')+'" opacity=".9"/>';
    s+='<text x="'+(L+bw+6)+'" y="'+(y+bh/2+4)+'" font-size="12" fill="#4A3B2A" font-weight="700">'+Math.round(r.v)+'%<\x2Ftext>';
  });
  s+='<\x2Fsvg>';
  return s;
}

/* --- 图表：折线图（模考趋势） --- */
function lineChart(points,opt){
  opt=opt||{};
  var W=620,H=220,L=44,R=16,T=18,B=32;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  if(!points || points.length<2){ s+='<text x="'+(W/2)+'" y="'+(H/2)+'" font-size="13" fill="#B4A78F" text-anchor="middle">数据不足，先积累模考记录吧<\x2Ftext><\x2Fsvg>'; return s; }
  var minV=Math.min.apply(null,points.map(function(p){return p.v;}))-5;
  var maxV=Math.max.apply(null,points.map(function(p){return p.v;}))+5;
  var iw=W-L-R, ih=H-T-B;
  var X=function(i){ return L+iw*i/(points.length-1); };
  var Y=function(v){ return T+ih*(1-(v-minV)/(maxV-minV)); };
  // 网格
  for(var g=0;g<=3;g++){ var gv=minV+(maxV-minV)*g/3, gy=Y(gv);
    s+='<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="#EEE4D0" stroke-width="1"/>';
    s+='<text x="'+(L-6)+'" y="'+(gy+4)+'" font-size="10" fill="#B4A78F" text-anchor="end">'+Math.round(gv)+'<\x2Ftext>';
  }
  var path='',i;
  for(i=0;i<points.length;i++){ path+=(i?'L':'M')+X(i)+' '+Y(points[i].v)+' '; }
  s+='<path d="'+path+'" fill="none" stroke="#6F9E4F" stroke-width="2.5" stroke-linejoin="round"/>';
  for(i=0;i<points.length;i++){
    s+='<circle cx="'+X(i)+'" cy="'+Y(points[i].v)+'" r="4" fill="#fff" stroke="#6F9E4F" stroke-width="2"/>';
    if(points[i].label){ s+='<text x="'+X(i)+'" y="'+(Y(points[i].v)-8)+'" font-size="11" fill="#4A3B2A" text-anchor="middle" font-weight="700">'+points[i].v+'<\x2Ftext>'; }
  }
  // x 轴标签
  if(points.length<=8){
    for(i=0;i<points.length;i++){ s+='<text x="'+X(i)+'" y="'+(H-10)+'" font-size="10" fill="#B4A78F" text-anchor="middle">'+esc(points[i].x)+'<\x2Ftext>'; }
  }
  s+='<\x2Fsvg>';
  return s;
}

/* --- 图表：环形图（时长分配） --- */
function donutChart(parts,opt){
  opt=opt||{};
  var W=200,H=200,cx=100,cy=100,R=70,r=44;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">';
  var total=0; parts.forEach(function(p){ total+=p.v; });
  if(total===0){ s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#EEE4D0" stroke-width="26"/>'; s+='<text x="'+cx+'" y="'+cy+'" font-size="13" fill="#B4A78F" text-anchor="middle">暂无数据<\x2Ftext><\x2Fsvg>'; return s; }
  var start=-Math.PI/2;
  parts.forEach(function(p){
    var ang=p.v/total*Math.PI*2;
    var end=start+ang;
    var x1=cx+R*Math.cos(start),y1=cy+R*Math.sin(start),x2=cx+R*Math.cos(end),y2=cy+R*Math.sin(end);
    var large=ang>Math.PI?1:0;
    s+='<path d="M'+x1+' '+y1+' A'+R+' '+R+' 0 '+large+' 1 '+x2+' '+y2+'" fill="none" stroke="'+p.c+'" stroke-width="26"/>';
    start=end;
  });
  s+='<text x="'+cx+'" y="'+(cy-4)+'" font-size="15" fill="#4A3B2A" text-anchor="middle" font-weight="800">'+Math.round(total)+'<\x2Ftext>';
  s+='<text x="'+cx+'" y="'+(cy+16)+'" font-size="10" fill="#B4A78F" text-anchor="middle">总时长(h)<\x2Ftext>';
  s+='<\x2Fsvg>';
  return s;
}

<script>
/* ==================== 渲染层：首页 ==================== */

  var dgk=daysBetween(todayStr(),EXAM_GK);

/* ==================== 今日计划（计划执行闭环①） ==================== */
/* 周次计算：W1 从 2026-10-05（周一）开始 */
function planWeekNum(t){
  var w=Math.floor(daysBetween('2026-10-05',t)/7)+1;
  return w>0?w:0;
}
/* 今日计划对象：{week主题, dayTemplate, weekPlan} */
function getTodayPlan(t){
  var plan=(window.KB_DATA&&window.KB_DATA.study_plan)||{};
  var stages=plan.stages||[];
  var weekly=plan.weekly_template||[];
  var wk=planWeekNum(t);
  // 找当周计划
  var wp=null;
  for(var i=0;i<stages.length;i++){
    var list=(stages[i].weeks||[]);
    for(var j=0;j<list.length;j++){
      var wn=parseInt(String(list[j].w||'').replace(/[^0-9]/g,''),10);
      if(!isNaN(wn)&&wn===wk){ wp=list[j]; break; }
    }
    if(wp) break;
  }
  // 周几模板（JS: 0=周日）
  var dayMap=['周日','周一','周二','周三','周四','周五','周六'];
  var dayName=dayMap[new Date(t+'T00:00:00').getDay()];
  var dt=null;
  weekly.forEach(function(w){ if(w.day===dayName) dt=w; });
  return {week:wk, weekPlan:wp, dayTemplate:dt, dayName:dayName};
}
function renderTodayPlan(){
  var el=$('home-plan');
  if(!el) return;
  var t=todayStr();
  var p=getTodayPlan(t);
  var html='';
  if(!p.weekPlan && !p.dayTemplate){
    el.innerHTML=sanitizeHtml('<div style="font-size:13px;color:var(--ink2)">计划未覆盖到今天，去「计划」页看整体安排</div>');
    return;
  }
  // 日期头 + 复盘入口
  html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
    +'<span style="font-size:12px;color:var(--ink3)">'+esc(t)+' · '+esc(p.dayName)+(p.week?(' · W'+p.week):'')+'</span>'
    +'<button class="chip'+(isReviewDay(p.dayName)?' on':'')+'" data-navreview="1">📅 复盘'+(isReviewDay(p.dayName)?'（今天）':'')+'</button>'
    +'</div>';
  // 本周主题（叠加已确认调整）
  if(p.weekPlan){
    html+='<div style="background:var(--green-l);border-radius:10px;padding:10px 12px;margin-bottom:8px">'
      +'<div style="font-size:13px;font-weight:700;color:var(--green-d)">📋 本周（'+esc(p.weekPlan.w)+'）：'+esc(p.weekPlan.topic)+'</div>'
      +'<div style="font-size:12px;color:var(--ink2);margin-top:2px">'+esc(p.weekPlan.detail)+'</div>'
      +'<\x2Fdiv>';
  }
  // 已确认的计划调整（紫卡展示，实时反映调整层）
  var adj=(typeof activeAdjustment==='function')?activeAdjustment(p.week):null;
  if(adj){
    html+='<div style="background:#F1EAF8;border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:3px solid #8B6FB8">'
      +'<div style="font-size:13px;font-weight:700;color:#6B4FA0">📌 已确认调整 <span style="font-weight:400;font-size:11px;color:#9B85B8">'+esc(adj.date)+'确认</span></div>'
      +'<div style="font-size:12px;color:#6B4FA0;margin-top:3px;line-height:1.8">';
    adj.changes.forEach(function(c){ html+='· '+esc(c.text)+'<br>'; });
    html+='</div><\x2Fdiv>';
  }
  // 今日动作
  if(p.dayTemplate){
    var bg=p.dayTemplate.type==='buffer'?'var(--gold-l)':'#fff';
    var tag=p.dayTemplate.type==='main'?'<span class="tag">主力日</span>':p.dayTemplate.type==='buffer'?'<span class="tag o">缓冲日</span>':'<span class="tag g">轻量日</span>';
    html+='<div style="display:flex;align-items:center;gap:8px;background:'+bg+';border:1px solid var(--line);border-radius:10px;padding:10px 12px">'
      +tag
      +'<span style="flex:1;font-size:13px;font-weight:600">'+esc(p.dayTemplate.plan)+'</span>'
      +'<span style="font-size:12px;color:var(--green-d);font-weight:700">'+esc(p.dayTemplate.hours)+'</span>'
      +'<\x2Fdiv>';
  }
  // 近期目标差距（动态：第一个未全达成的里程碑）
  if(typeof goalGapSummary==='function'){
    var gg=goalGapSummary();
    if(gg){
      html+='<div style="margin-bottom:8px;background:#fff;border:1px dashed var(--gold);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.8">'
        +'<b style="color:var(--gold-d)">🎯 '+esc(gg.date)+'目标进度</b>　'
        +gg.items.slice(0,3).map(function(it){ return esc(it.label)+' '+goalLineText(it)+' '+goalIcon(it.g.st); }).join('　')
        +'</div>';
    }
  }
  // 已打卡则显示比对结果，否则提示去打卡
  if(checkedToday()){
    var cmp=comparePlanActual(t,p);
    html+=renderPlanCompare(cmp);
  }else{
    html+='<div style="font-size:12px;color:var(--ink3);margin-top:8px">完成学习后去打卡，系统会自动比对计划完成度 ✓</div>';
  }
  el.innerHTML=sanitizeHtml(html);
}
/* 周一三五复盘日 */
function isReviewDay(dayName){ return dayName==='周一'||dayName==='周三'||dayName==='周五'; }

/* 比对：今日计划 vs 实际打卡（含偏差分级与纠偏动作） */
function comparePlanActual(t,p){
  var res={ok:[],diff:[],suggest:'',level:'ok',action:''};
  var hours=0, mods=[];
  state.checkin.forEach(function(c){
    if(String(c['日期']||'').slice(0,10)!==t) return;
    hours+=num(c['学习时长'])||0;
    var note=String(c['今日收获']||'');
    var m=note.match(/模块：([^；]+)/);
    if(m) mods=mods.concat(m[1].split('、'));
  });
  state.study.forEach(function(s){
    if(String(s['日期']||'').slice(0,10)!==t) return;
    if(String(s['类型']||'')==='历史基线') return;
    if(s['模块']&&mods.indexOf(s['模块'])<0) mods.push(s['模块']);
  });
  var dt=p.dayTemplate;
  // 时长比对
  if(dt){
    var target=parseFloat(dt.hours)||0; // "2.5h"/"0.5-1h"取下限
    if(dt.hours.indexOf('-')>=0) target=parseFloat(dt.hours);
    if(hours>=target*0.8){
      res.ok.push('时长达标：实际 '+hours+'h / 计划 '+dt.hours);
    }else if(hours>0){
      res.diff.push('时长不足：实际 '+hours+'h，计划 '+dt.hours+'（还差 '+Math.max(0,Math.round((target-hours)*10)/10)+'h）');
    }else{
      res.diff.push('还没记录学习时长（计划 '+dt.hours+'）');
    }
    // 内容比对：今天计划里提到的模块是否打了卡
    var planMods=[];
    var kwMap={'申论':['申论'],'时政':['时事政治','政治理论'],'政治理论':['政治理论'],'资料分析':['资料分析'],'数量':['数量关系'],'言语':['言语理解'],'判断':['判断推理'],'常识':['常识判断'],'套卷':['模考']};
    for(var kw in kwMap){
      if(dt.plan.indexOf(kw)>=0){ planMods=planMods.concat(kwMap[kw]); }
    }
    var hit=planMods.some(function(m){ return mods.some(function(x){ return x.indexOf(m)>=0||m.indexOf(x)>=0; }); });
    if(planMods.length===0){ /* 模板未提模块，跳过 */ }
    else if(hit){ res.ok.push('内容对口：今天练的模块与计划一致'); }
    else if(hours>0){ res.diff.push('内容偏差：计划「'+dt.plan+'」，实际练的是 '+(mods.join('、')||'未记录')); }
  }
  // 偏差分级 + 纠偏动作
  var hourGap=0;
  res.diff.forEach(function(s){
    var m=s.match(/还差 ([0-9.]+)h/);
    if(m) hourGap=Math.max(hourGap,parseFloat(m[1]));
  });
  var contentOff=res.diff.some(function(s){ return s.indexOf('内容偏差')>=0; });
  var noRecord=res.diff.some(function(s){ return s.indexOf('还没记录')>=0; });
  if(res.diff.length===0&&res.ok.length){
    res.level='ok'; res.suggest='按计划推进，保持这个节奏 🌱';
  }else if(hourGap>1||(contentOff&&noRecord)){
    res.level='red';
    res.suggest='明显偏差，别慌——看下面两个纠偏选项，选一个就行';
    res.action='red';
  }else if(res.diff.length){
    res.level='yellow';
    res.suggest='轻度偏差：晚上补齐，或顺延到周日 buffer 时间，不追责';
    res.action='yellow';
  }
  return res;
}
function renderPlanCompare(cmp){
  var lvColor=cmp.level==='ok'?'var(--green-d)':cmp.level==='yellow'?'var(--gold-d)':'var(--red)';
  var lvText=cmp.level==='ok'?'✅ 按计划':cmp.level==='yellow'?'🟡 轻度偏差':'🔴 明显偏差';

function moduleStats(){

    if(!map[m]) map[m]={q:0,w:0};
    map[m].q+=num(s['题量'])||0;
    map[m].w+=num(s['错题数'])||0;
  });
  var colors={'政治理论':'#6F9E4F','常识判断':'#8FB36A','言语理解':'#E79BB5','判断推理':'#D9869B','数量关系':'#E86A32','资料分析':'#D4A94E','申论':'#B98A2F','时事政治':'#7A9BB5'};
  var rows=[];
  for(var k in map){ if(map[k].q>0) rows.push({name:k,v:(map[k].q-map[k].w)/map[k].q*100,color:colors[k]||'#6F9E4F'}); }
  rows.sort(function(a,b){ return a.v-b.v; });
  return rows;
}

/* ==================== 量化目标追踪（目标线 × 打卡实际值 自动对比） ==================== */
/* 从里程碑字符串提取数值："≥60%"→60、"8篇"→8、"保55%(只做基础)"→55、"3朵"→3 */
function parseTargetNum(s){
  if(s==null) return null;
  var m=String(s).match(/(\d+)/);
  return m?parseInt(m[1],10):null;
}
/* 单项目标对比：st= ok✅达成 / near🟡接近(≥60%进度) / far🔴差距大 */
function goalItem(label,target,actual){
  if(target==null||target<=0||actual==null) return null;
  var pct=Math.min(999,Math.round(actual/target*100));
  var st=actual>=target?'ok':(pct>=60?'near':'far');
  return {label:label,target:target,actual:actual,pct:pct,st:st};
}
function goalIcon(st){ return st==='ok'?'✅':(st==='near'?'🟡':'🔴'); }
function goalLineText(it){
  if(it.unit==='%') return Math.round(it.g.actual)+'%/'+it.g.target+'%';
  return it.g.actual+'/'+it.g.target+it.unit;
}
/* 里程碑 → 各项实际对比（数据源：刷题打卡moduleStats + 申论练笔 + 花园朵数，全部实时） */
function milestoneProgress(m){
  var items=[];
  var ms=moduleStats(); var mod={}; ms.forEach(function(s){ mod[s.name]=s.v; });
  var shenlunLen=(lsGet('my_shenlun')||[]).length;
  var flowers=totalFlowers();
  var g;
  g=goalItem('申论',parseTargetNum(m.essay),shenlunLen); if(g) items.push({icon:'📝',label:'申论',text:m.essay,unit:'篇',g:g});
  g=goalItem('政治',parseTargetNum(m.zzll),mod['政治理论']); if(g) items.push({icon:'📕',label:'政治',text:m.zzll,unit:'%',g:g});
  g=goalItem('资料',parseTargetNum(m.zlfx),mod['资料分析']); if(g) items.push({icon:'📊',label:'资料',text:m.zlfx,unit:'%',g:g});
  g=m.yysd?goalItem('言语',parseTargetNum(m.yysd),mod['言语理解']):null; if(g) items.push({icon:'💬',label:'言语',text:m.yysd,unit:'%',g:g});
  g=m.shuliang?goalItem('数量',parseTargetNum(m.shuliang),mod['数量关系']):null; if(g) items.push({icon:'🔢',label:'数量',text:m.shuliang,unit:'%',g:g});
  g=goalItem('花园',parseTargetNum(m.flowers),flowers); if(g) items.push({icon:'🌸',label:'花园',text:m.flowers,unit:'朵',g:g});
  return items;
}
/* 当前活跃目标 = 按顺序第一个有未达标项的里程碑；全部达成则取最后一个 */
function currentMilestoneIdx(){
  var ms=(window.KB_DATA.study_plan.milestones)||[];
  for(var i=0;i<ms.length;i++){
    var its=milestoneProgress(ms[i]);
    if(its.length&&its.some(function(it){ return it.g.st!=='ok'; })) return i;
  }
  return ms.length-1;
}
/* 首个未全达成里程碑的差距摘要（供首页/复盘中心调用） */
function goalGapSummary(){
  var ms=(window.KB_DATA.study_plan.milestones)||[];
  var idx=currentMilestoneIdx();
  if(idx<0||!ms[idx]) return null;
  var items=milestoneProgress(ms[idx]).filter(function(it){ return it.g.st!=='ok'; });
  return items.length?{date:ms[idx].date,items:items}:null;
}

/* 禅境花园总览：木架背景 + 一排排花盆（每花一朵） */
function zenGardenSVG(pots){
  var W=640, col=4, padX=18, gapX=10, potW=(W-padX*2-gapX*(col-1))/col;
  var potH=potW*1.18;
  if(!pots || pots.length===0){
    return '<svg viewBox="0 0 '+W+' 240" width="100%">'
      +'<rect width="'+W+'" height="240" fill="#C7A45C"/>'
      +'<rect width="'+W+'" height="170" fill="#D9C48E"/>'
      +'<text x="'+W/2+'" y="120" font-size="15" fill="#8A6B3F" text-anchor="middle">🌱 花园已备好，开始学习来种下第一株花吧<\x2Ftext><\x2Fsvg>';
  }
  var rows=Math.ceil(pots.length/col);
  var H=rows*(potH+26)+40;
  var html='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
  // 背景：禅境花园的木架 + 天空 + 阳光
  html+='<rect width="'+W+'" height="'+H+'" fill="#F7E7C3"/>';                 // 暖阳天空
  html+='<circle cx="'+(W-56)+'" cy="44" r="26" fill="#F9D96B" opacity=".95"/>';
  html+='<circle cx="'+(W-56)+'" cy="44" r="38" fill="#F9D96B" opacity=".25"/>';
  html+='<rect y="'+(H-24)+'" width="'+W+'" height="24" fill="#A9814B"/>';      // 木架底座
  html+='<rect y="'+(H-24)+'" width="'+W+'" height="4" fill="#C49A62"/>';
  pots.forEach(function(p,idx){
    var r=Math.floor(idx/col), c=idx%col;
    var x=padX+c*(potW+gapX);
    var y=30+r*(potH+26);
    // 每盆可点击看特写
    html+='<g data-pot="'+idx+'" style="cursor:pointer">';
    // 木架搁板（每排下方一条）
    if(c===0){ html+='<rect x="'+(padX-8)+'" y="'+(y+potH-8)+'" width="'+(W-padX*2+16)+'" height="10" rx="4" fill="#B98A55" stroke="#9A6B3A" stroke-width="1"/>'; }
    // 花盆里的花（3阶段写实风，开花期花骨朵按进度渐进）
    html+='<g transform="translate('+x+','+y+')">'+zenFlowerSVG(p.variety,p.stage,potW,potH,p.stageProgress)+'<\x2Fg>';
    // 未开花的盆，顶部显示"还差多少"进度标签
    if(!p.done){
      html+='<text x="'+(x+potW/2)+'" y="'+(y-4)+'" font-size="10" fill="#8A6B3F" text-anchor="middle" font-weight="600">还差 '+p.hoursLeft+'h<\x2Ftext>';
    }
    html+='<\x2Fg>';
  });
  html+='<\x2Fsvg>';
  return html;
}

/* ---- PvZ 阳光：SVG + 掉落收集（纯本地趣味，不影响真实数据） ---- */
function sunSVG(size){
  size=size||44;
  var c=size/2, r1=size*0.46, r2=size*0.30;
  var rays='';
  for(var i=0;i<10;i++){
    var a=i*Math.PI/5, x1=c+Math.cos(a)*r2*1.1, y1=c+Math.sin(a)*r2*1.1;
    var x2=c+Math.cos(a)*(r1+3), y2=c+Math.sin(a)*(r1+3);
    rays+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="#FFD23F" stroke-width="'+(size*0.06).toFixed(1)+'" stroke-linecap="round"/>';
  }
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'
    +rays
    +'<circle cx="'+c+'" cy="'+c+'" r="'+r1+'" fill="#FFDD33"/>'
    +'<circle cx="'+c+'" cy="'+c+'" r="'+r2+'" fill="#FFEE88"/>'
    +'<circle cx="'+(c-r2*0.32)+'" cy="'+(c-r2*0.25)+'" r="'+(size*0.035)+'" fill="#B8860B" opacity=".85"/>'
    +'<circle cx="'+(c+r2*0.32)+'" cy="'+(c-r2*0.25)+'" r="'+(size*0.035)+'" fill="#B8860B" opacity=".85"/>'
    +'<path d="M '+(c-r2*0.42)+' '+(c+r2*0.18)+' Q '+c+' '+(c+r2*0.62)+' '+(c+r2*0.42)+' '+(c+r2*0.18)+'" stroke="#B8860B" stroke-width="'+(size*0.04)+'" fill="none" stroke-linecap="round"/>'
    +'<\x2Fsvg>';
}
var _sunTimer=null;
function startSunRain(){
  stopSunRain();
  var zone=$('sun-zone'); if(!zone) return;
  var collected=lsGet('sun_collected')||0;
  var spawn=function(){
    if(!document.getElementById('sun-zone')){ stopSunRain(); return; }
    if(state.route!=='home'){ return; }
    var drop=document.createElement('div');
    drop.className='sun-drop';
    var zoneW=zone.clientWidth||320, zoneH=zone.clientHeight||140;
    drop.style.left=(Math.random()*(zoneW-50)+6)+'px';
    drop.style.setProperty('--fall-h',(zoneH+70)+'px');
    drop.style.animationDuration=(3.6+Math.random()*2.4)+'s';
    drop.innerHTML=sanitizeHtml(sunSVG(44));
    drop.addEventListener('click',function(ev){
      ev.stopPropagation();
      if(drop._got) return; drop._got=true;
      collected++; lsSet('sun_collected',collected);
      var cnt=$('sun-count'); if(cnt) cnt.textContent='☀️ '+collected;
      var fly=document.createElement('div');
      fly.className='sun-collected';
      fly.style.left=drop.style.left;
      fly.style.top=(drop.getBoundingClientRect().top-zone.getBoundingClientRect().top)+'px';
      fly.style.setProperty('--fly-x',(10-Math.random()*40)+'px');
      fly.style.setProperty('--fly-y',(-zoneH-30)+'px');
      fly.innerHTML=sanitizeHtml(sunSVG(36));
      zone.appendChild(fly);
      setTimeout(function(){ fly.remove(); },600);
      drop.remove();
    });
    zone.appendChild(drop);
    setTimeout(function(){ drop.remove(); },7000);
  };
  _sunTimer=setInterval(spawn,3200);
  setTimeout(spawn,600);
}
function stopSunRain(){ if(_sunTimer){ clearInterval(_sunTimer); _sunTimer=null; } }

/* 当前所处阶段 */
function currentStage(stages,t){
  var ranges=[[5,11,24],[11,30,12,27],[2027,1,4,2027,3,20]];
  for(var i=0;i<stages.length;i++){
    var s=stages[i];
    var ws=(s.weeks&&s.weeks[0]&&s.weeks[0].date)||'';
    var we=(s.weeks&&s.weeks[s.weeks.length-1]&&s.weeks[s.weeks.length-1].date)||'';
    // 粗略按日期字符串判断（date 格式 "10/5-10/11"、"11/30-12/6"、"1月" 等），用周次法更稳
  }
  // 用周次法：W1 从 2026-10-05 开始
  var wk=Math.floor(daysBetween('2026-10-05',t)/7)+1;
  if(wk<=0) return stages[0];
  if(wk<=8) return stages[0];
  if(wk<=12) return stages[1];
  return stages[2]||stages[stages.length-1];
}
/* 某周是否为当前周（date 形如 "10/5-10/11" 或 "1月"） */
function isWeekActive(w,t){
  var wk=Math.floor(daysBetween('2026-10-05',t)/7)+1;
  var wn=parseInt(String(w.w||'').replace(/[^0-9]/g,''),10);
  if(!isNaN(wn)&&wn>0) return wn===wk;
  return false;
}

/* 严格数字校验：空/非数字/超范围都报错，返回 {ok,v,msg}；allowEmpty 时不填视为跳过 */
function strictNum(v,opt){
  opt=opt||{};
  var s=String(v==null?'':v).trim();
  if(s===''){
    if(opt.allowEmpty) return {ok:true,v:null};
    return {ok:false,msg:'这里不能空着哦，要填数字'};
  }
  // 拒绝"12abc"、"1.2.3"、全角数字也统一转半角再验
  var half=s.replace(/[０-９]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); }).replace('．','.');
  if(!/^\d+(\.\d+)?$/.test(half)){
    return {ok:false,msg:'「'+s.slice(0,10)+'」不是有效数字，请只填数字'};
  }
  var n=parseFloat(half);
  if(isNaN(n)) return {ok:false,msg:'「'+s.slice(0,10)+'」无法识别为数字'};
  if(opt.min!=null && n<opt.min) return {ok:false,msg:'不能小于 '+opt.min};
  if(opt.max!=null && n>opt.max) return {ok:false,msg:'不能大于 '+opt.max};
  if(opt.integer && Math.floor(n)!==n) return {ok:false,msg:'题量要填整数'};
  return {ok:true,v:n};
}

  /* —— 提交（全部校验通过才写入） —— */
  $('bf-save').addEventListener('click',function(){
    bfErr('');
    /* 1. 客观题行校验 */
    var modRows=[].slice.call(document.querySelectorAll('.bf-mod-row'));

      var rS=row.querySelector('[data-bf="right"]').value;

      var r=strictNum(rS,{integer:true,min:0,max:100000});

    }
    /* 2. 申论校验 */
    var slC=strictNum($('bf-sl-count').value,{allowEmpty:true,integer:true,min:0,max:10000});

    var mockRows=[].slice.call(document.querySelectorAll('.bf-mock-row'));

      var mr=mockRows[j];

      var sc=mr.querySelector('[data-bf="mscope"]').value;
      var sS=mr.querySelector('[data-bf="mscore"]').value;
      var fS=mr.querySelector('[data-bf="mfull"]').value;
      if(dS==='' && sS==='' && fS===''){ continue; }
      if(dS===''){ bfErr('模考日期不能空，格式如 2026-08-15'); return; }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dS)){ bfErr('模考日期「'+dS.slice(0,10)+'」格式不对，要像 2026-08-15 这样'); return; }
      if(new Date(dS.replace(/-/g,'/'))>new Date()){ bfErr('模考日期不能是未来呀'); return; }
      var sv=strictNum(sS,{min:0,max:1000});
      if(!sv.ok){ bfErr('模考得分：'+sv.msg); return; }
      var fv=strictNum(fS,{min:1,max:1000});
      if(!fv.ok){ bfErr('模考满分：'+fv.msg); return; }
      if(sv.v>fv.v){ bfErr('模考得分（'+sv.v+'）不能大于满分（'+fv.v+'）'); return; }
      mocks.push({date:dS,scope:sc,score:sv.v,full:fv.v});
    }
    if(mods.length===0 && (slC.v==null||slC.v===0) && slS.v==null && mocks.length===0){
      bfErr('什么都还没填——至少补录一项，或者点取消'); return;
    }
    if(slC.v!=null && slC.v>0 && slC.v>500){ bfErr('申论篇数最多补录 500 篇'); return; }

    /* —— 写入 —— */
    var today=todayStr();
    var writes=[];
    /* 3a. 客观题 → 学习记录表（类型=历史基线，用时0不污染时长） */
    mods.forEach(function(b,idx){
      var note='【历史补录】'+b.mod+' 累计'+b.t+'题对'+b.r+'题';
      var sp={
        '日期':{date:today},
        '模块':{select:optId('study_module',b.mod)},
        '类型':{select:optId('study_type','历史基线')},
        '题量':{number:b.t},
        '错题数':{number:b.t-b.r},
        '用时分钟':{number:0},
        '备注':{text:note}
      };
      var lp={record_id:'bf_'+Date.now()+'_'+idx,日期:today+'T00:00:00Z',模块:b.mod,类型:'历史基线',题量:b.t,错题数:b.t-b.r,用时分钟:0,备注:note};
      writes.push(addStudyRecord(sp,lp).then(function(ok){ if(ok){ state.study.unshift(lp); } }));
    });
    /* 3b. 申论 → my_shenlun（补录记录带 backfill 标记；篇数 0 时只记录分数） */
    if(slC.v!=null && slC.v===0 && slS.v!=null){
      var list0=lsGet('my_shenlun')||[];
      list0.push({title:'历史练笔（仅记录分数）',type:$('bf-sl-type').value,date:today,score:Math.round(slS.v),chars:0,backfill:true});
      lsSet('my_shenlun',list0);
    }else if(slC.v!=null && slC.v>0){
      var list=lsGet('my_shenlun')||[];
      for(var k2=0;k2<slC.v;k2++){
        list.push({title:'历史练笔'+(slC.v>1?(' '+(k2+1)):''),type:$('bf-sl-type').value,date:today,score:(k2===0&&slS.v!=null)?Math.round(slS.v):(60+((k2*7)%15)),chars:0,backfill:true});
      }
      lsSet('my_shenlun',list);
    }
    /* 3c. 模考 → localStorage（bf_mocks，只做记录展示，暂不参与追踪） */
    if(mocks.length){
      var all=(lsGet('bf_mocks')||[]).concat(mocks);
      lsSet('bf_mocks',all);
    }
    Promise.all(writes).then(function(){
      closeSheet();
      renderAll();
      var parts=[];
      if(mods.length) parts.push(mods.length+'个模块刷题');
      if(slC.v!=null && slC.v>0) parts.push(slC.v+'篇申论');
      else if(slC.v===0 && slS.v!=null) parts.push('申论分数1条');
      if(mocks.length) parts.push(mocks.length+'次模考');
      toast('📥 已补录：'+parts.join('、'),true);
      if(typeof checkAndNotify==='function') setTimeout(checkAndNotify,1500);
    });
  });
}

/* 基础对话调用（文本消息数组） */
function aiChat(messages,opts){
  opts=opts||{};
  var key=aiKey();
  if(!key) return Promise.reject('未配置 API Key');
  var body={
    model:getAICfg().model,
    messages:messages,
    max_tokens:opts.max_tokens||2048,
    thinking:{type:'disabled'}
  };
  // API 级结构化约束：GLM 支持 response_format，强制模型输出合法 JSON
  if(opts.jsonMode){ body.response_format={type:'json_object'}; }
  return fetch(getAICfg().base,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify(body)
  }).then(function(r){
    return r.json().then(function(d){
      if(!r.ok){ throw (d&&d.error&&d.error.message)||('HTTP '+r.status); }
      var msg=d.choices&&d.choices[0]&&d.choices[0].message;
      var txt=(msg&&msg.content)||'';
      if(!txt) throw 'AI 返回为空（可能是网络或配额问题）';
      return txt;
    });
  });
}
/* 图片识别（vision）：传 dataUrl + 提示词 */
function aiVision(dataUrl,prompt,maxTokens){

    ]
  }];

  if(!key) return Promise.reject('未配置 API Key');
  var body={model:getAICfg().model,messages:messages,max_tokens:maxTokens||2048,thinking:{type:'disabled'}};

/* 解析 AI 返回的 JSON（容错：剥代码块标记） */
/* —— 容错层①：AI输出标准化 ——
   任何形状的 adjustments 输入 → 一律转为 string[]（过滤垃圾项，截断长度） */
function normalizeAdjustments(raw){
  var out=[];
  try{
    var arr=null;
    if(Array.isArray(raw)){ arr=raw; }
    else if(typeof raw==='string'){ arr=raw.split('\n'); }
    else if(raw&&typeof raw==='object'&&raw.text){ arr=[raw]; }
    else if(raw&&typeof raw==='object'&&raw.adjustments){ return normalizeAdjustments(raw.adjustments); }
    else{ return []; }
    arr.forEach(function(item){
      var s='';
      if(typeof item==='string') s=item;
      else if(item&&typeof item==='object'){ s=item.text||item.content||item.suggestion||''; }
      else if(typeof item==='number') s=String(item);
      s=String(s).trim();
      if(s && s!=='null' && s!=='undefined' && s!=='[object Object]'){
        out.push(s.slice(0,200));
      }
    });
  }catch(e){ return []; }
  return out.slice(0,6);
}
/* —— 容错层②：调整层读取净化 ——
   localStorage 被污染（旧版本/意外写入）时：非数组→空；脏项→过滤 */
function sanitizeAdjustments(list){
  if(!Array.isArray(list)) return [];
  return list.filter(function(a){
    return a && typeof a==='object' && Array.isArray(a.changes);
  }).map(function(a){
    return {
      date:String(a.date||'').slice(0,10),
      week:(typeof a.week==='number')?a.week:null,
      fromAI:!!a.fromAI,
      changes:a.changes.filter(function(c){ return c&&typeof c==='object'&&typeof c.text==='string'&&c.text.trim(); })
                       .map(function(c){ return {type:String(c.type||'ai'),text:c.text.slice(0,200)}; })
    };
  }).filter(function(a){ return a.changes.length>0; });
}
function parseAIJSON(txt){
  var s=String(txt).trim();
  s=s.replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  var m=s.match(/\{[\s\S]*\}/);
  if(m) s=m[0];
  return JSON.parse(s);
}

/* ==================== 申论批改评分引擎（本地规则） ==================== */
function scoreShenlun(input){
  var title=input.title||'';
  var answer=input.answer||'';
  var type=input.type||'大作文（议论文）';
  var chars=answer.replace(/\s/g,'').length;
  var dims=[];
  var suggestions=[];

  // 1. 切题度（标题/正文是否含主题关键词）
  var titleKeywords=title.replace(/[，。、：；（）《》""''\s]/g,'').slice(0,20);
  var qietiScore=0, qietiFull=20;
  // 提取主题词（去掉"以/为题/围绕/写一篇/议论文"等虚词）
  var themeWords=titleKeywords.split('');
  var hitCount=0;
  // 简单策略：正文长度足够 + 出现标题中的实词
  var coreTerms=extractCoreTerms(title);
  coreTerms.forEach(function(term){
    if(answer.indexOf(term)>=0) hitCount++;
  });
  qietiScore=Math.min(qietiFull, Math.round(qietiFull*0.4 + (coreTerms.length? hitCount/coreTerms.length:0)*qietiFull*0.6));
  if(hitCount===0){ suggestions.push('作答似乎没有紧扣题目主题，建议在开头、分论点和结尾反复点题。'); }

  // 2. 结构（是否分段 + 有无分论点标记）
  var jiegouScore=0, jiegouFull=20;
  var paras=answer.split(/\n+/).filter(function(p){return p.trim().length>10;});
  if(paras.length>=5) jiegouScore+=10; else if(paras.length>=3) jiegouScore+=6; else jiegouScore+=3;
  var hasFenlun=/首先|其次|再次|最后|一方面|另一方面|第一|第二|第三|其一|其二|其一|一是|二是|三是|分论点/.test(answer);
  if(hasFenlun) jiegouScore+=6;
  if(/总之|综上所述|因此|故而|总而言之|由此可见/.test(answer)) jiegouScore+=4;
  jiegouScore=Math.min(jiegouFull,jiegouScore);
  if(paras.length<3){ suggestions.push('段落偏少，建议采用「开头—分论点（2~3个）—结尾」的总分总结构。'); }
  if(!hasFenlun){ suggestions.push('缺少明显的分论点标志（如「第一/第二/一方面」），建议让结构更清晰。'); }

  // 3. 表达（规范词 + 政策热词命中）
  var guifanScore=0, guifanFull=20;
  var stdWords=(window.KB_DATA.shenlun_tools&&window.KB_DATA.shenlun_tools.standard_words)||[];
  var hitWords=[];
  stdWords.forEach(function(dom){ (dom.words||[]).forEach(function(w){ if(answer.indexOf(w.word)>=0) hitWords.push(w.word); }); });
  // 政策热词（申论大作文高频核心词汇，客观列出用于检测）
  var POLICY_TERMS=['高质量发展','新发展理念','以人民为中心','久久为功','精准施策','因地制宜','绿水青山就是金山银山','科技自立自强','共同富裕','乡村振兴','守正创新','创新驱动','统筹兼顾','系统思维','底线思维','钉钉子精神','功成不必在我','功成必定有我','问题导向','目标导向','新发展格局','中国式现代化','基层治理','共建共治共享','因地制宜','分类施策','靶向发力','抓铁有痕','踏石留印','人民至上','文化自信','生态文明','绿色低碳','数字中国','人才强国','协同发展','优势互补','长远眼光','战略定力','科学决策','法治思维','依法治国','全面从严治党','自我革命'];
  POLICY_TERMS.forEach(function(t){ if(answer.indexOf(t)>=0) hitWords.push(t); });
  guifanScore=Math.min(guifanFull, hitWords.length*2);
  if(hitWords.length<4){ suggestions.push('规范词/政策热词使用偏少（命中 '+hitWords.length+' 个），可到「写作工具」积累，如「久久为功」「精准施策」等。'); }

  // 4. 表达流畅（字数合理性 + 标点）
  var biaodaScore=0, biaodaFull=20;
  if(type.indexOf('大作文')>=0){
    if(chars>=800) biaodaScore+=8; else if(chars>=500) biaodaScore+=5; else biaodaScore+=2;
  }else{
    if(chars>=150) biaodaScore+=6; else if(chars>=80) biaodaScore+=4; else biaodaScore+=2;
  }
  var hasQuote=/「」|""|“”|古人云|正如|有言/.test(answer);
  if(hasQuote) biaodaScore+=4;
  var hasParallel=/(既是|不是|无论).*?，(也|而是|无论).*?，/.test(answer);
  if(hasParallel) biaodaScore+=4;
  var sentenceCount=(answer.match(/[。！？]/g)||[]).length;
  if(sentenceCount>0 && chars/sentenceCount<80) biaodaScore+=4; // 句子长度适中
  biaodaScore=Math.min(biaodaFull,biaodaScore);
  if(!hasQuote){ suggestions.push('可适当引用金句或古文增强文采，如「功成不必在我」「绿水青山就是金山银山」。'); }

  // 5. 字数（独立维度）
  var zishuScore=0, zishuFull=20;
  var target = type.indexOf('大作文')>=0?1000:250;
  zishuScore=Math.min(zishuFull, Math.round(chars/target*zishuFull));
  if(chars < target*0.5){ suggestions.push('字数偏少（'+chars+'字），'+type+'建议达到'+target+'字左右，内容会更充实。'); }

  dims=[
    {key:'qieti',score:qietiScore,full:qietiFull},
    {key:'jiegou',score:jiegouScore,full:jiegouFull},
    {key:'biaoda',score:biaodaScore,full:biaodaFull},
    {key:'zishu',score:zishuScore,full:zishuFull},
    {key:'guifan',score:guifanScore,full:guifanFull}
  ];
  var total=0; dims.forEach(function(d){ total+=d.score; });
  var totalFull=0; dims.forEach(function(d){ totalFull+=d.full; });
  var score=Math.round(total/totalFull*100);

  // 总评
  var comment;
  if(score>=80) comment='非常棒！你的作答结构清晰、表达规范，已经具备申论高分的雏形。继续保持，重点打磨个别分论点的论证深度即可。';
  else if(score>=65) comment='不错，基础框架已经搭起来了。主要提升空间在规范表达和论证深度，多积累规范词、金句，让语言更"申论"。';
  else if(score>=50) comment='已经迈出第一步了！目前结构还比较松散，表达偏口语化。建议先模仿范文的「总分总」结构，逐步替换大白话为规范词。';
  else comment='万事开头难，能写出来就是胜利！建议先多看范文结构、积累规范词，从"能写"到"写规范"需要一个过程，慢慢来。';

  if(score>=80) suggestions.unshift('保持当前水平，建议挑战更高难度的真题主题。');
  if(suggestions.length>4) suggestions=suggestions.slice(0,4);

  return {title:title,type:type,answer:answer,chars:chars,score:score,dims:dims,comment:comment,suggestions:suggestions};
}

/* 从标题提取核心主题词 */
function extractCoreTerms(title){
  var s=title.replace(/以|为题|围绕|为主题|写一篇|写一|议论文|谈谈|对|的理解|谈谈对|，|。|、|：|；|（|）|《|》|"|"|'|'|\s/g,'');
  // 取前若干字作为主题词
  var terms=[];
  if(s.length>=2){
    terms.push(s.slice(0,2));
    if(s.length>=4) terms.push(s.slice(0,4));
  }
  return terms;
}

/* 本周快照 */
function weekSnapshot(wk){
  var days={},hours=0,total=0,wrong=0,modSet={},shenlun=0;
  var wkStart=wk?('2026-10-05'):''; // 简化：7天窗口
  var t=todayStr();
  var start=new Date(); start.setDate(start.getDate()-6);
  var startStr=start.toISOString().slice(0,10);
  state.checkin.forEach(function(c){
    var d=String(c['日期']||'').slice(0,10);
    if(d<startStr||d>t) return;
    days[d]=1; hours+=num(c['学习时长'])||0;
  });
  state.study.forEach(function(s){
    var d=String(s['日期']||'').slice(0,10);
    if(d<startStr||d>t) return;
    if(String(s['类型']||'')==='历史基线') return;
    total+=num(s['题量'])||0; wrong+=num(s['错题数'])||0;
    if(s['模块']) modSet[s['模块']]=1;
  });
  getReviewNotes; // noop
  (lsGet('my_shenlun')||[]).forEach(function(e){ if(e.date&&e.date>=startStr&&e.date<=t) shenlun++; });
  var mods=Object.keys(modSet).join('、');
  return {days:Object.keys(days).length,hours:Math.round(hours*10)/10,total:total,wrong:wrong,mods:mods,shenlun:shenlun};
}

/* AI 偏差分析（计划 vs 实际 + 动态调整建议） */
var PROMPT_GAP='你是公考备考规划教练。任务：对比学生的备考计划与实际执行情况，给出偏差分析和下一步动态调整建议。\n'
 +'【输入】JSON：plan（本周计划）、actual（本周实际数据）、history（历史复盘要点）、baseline（初始各模块正确率）。\n'
 +'【分析要求】\n'
 +'1. 完成度：哪些做到了、哪些没做到（用数据说话）；\n'
 +'2. 偏差归因：没做到的可能原因（不指责，客观分析：时间不够/内容偏难/状态问题）；\n'
 +'3. 动态调整：根据实际情况给出下周的具体调整——如果超前了建议加量或提前进入下周内容；如果滞后了建议砍哪些保哪些（主线=申论+资料分析+政治理论）；如果正确率异常低建议降低难度；；【调整触发规则】单次偏差只提示不动计划；连续2个复盘日同向滞后→给出下调20%的具体方案；连续2个复盘日超前→建议加量或提前；调整必须经学生确认才生效\n'
 +'4. 原则：不排满、留buffer、正向反馈语气、不承诺分数。\n'
 +'【输出】只输出一个JSON：{"completion":"完成度一句话(如 85% 或 3/5项)","matches":["做到的点1","2"],"gaps":["没做到的点1","2"],"reasons":["可能原因1","2"],"adjustments":["下周具体调整1","2","3"],"encourage":"一句鼓励的话"}\n'
 +'JSON必须可被JSON.parse解析，不要其他文字。';
/* ==================== 确定性规则引擎（不依赖AI的偏差分析·兜底层） ====================
   完成度/偏差/调整建议全部由算法算出——数值永远准确，AI 只是「润色建议」的可选增强。
   AI 挂了/超时/输出坏数据 → 自动降级到这里，功能不缺席。 */
function ruleGapAnalysis(wk,snap,notes){
  var plan=(window.KB_DATA&&window.KB_DATA.study_plan)||{};
  var p=getTodayPlan();
  var wp=p.weekPlan;
  var res={completion:'',matches:[],gaps:[],reasons:[],adjustments:[],encourage:'',byRule:true};
  // —— 完成度：周内已学天数 / 目标天数（主力+轻量日按计划为6天，buffer日不计）——
  var targetDays=6;
  var dayPct=Math.round(snap.days/targetDays*100);
  var hourTarget=7.5;  // 周计划上限
  var hourPct=Math.round(snap.hours/hourTarget*100);
  var overall=Math.min(100,Math.round(dayPct*0.5+hourPct*0.5));
  res.completion=overall+'%';
  // —— 做到了 ——
  if(snap.days>0) res.matches.push('本周已学习 '+snap.days+' 天、累计 '+snap.hours+' 小时');
  if(snap.total>0) res.matches.push('练题 '+snap.total+' 道'+(snap.total?('，正确率 '+Math.round((snap.total-snap.wrong)/snap.total*100)+'%'):''));
  if(snap.shenlun>0) res.matches.push('申论练笔 '+snap.shenlun+' 篇');
  // —— 没做到 ——
  if(snap.days<targetDays) res.gaps.push('学习天数 '+snap.days+'/'+targetDays+' 天（按每周节奏模板还差 '+(targetDays-snap.days)+' 天）');
  if(snap.hours<hourTarget*0.8) res.gaps.push('总时长 '+snap.hours+'h，低于周目标的 80%（'+(hourTarget*0.8)+'h）');
  if(snap.shenlun===0) res.gaps.push('本周还没写申论（主线科目，每周至少 1 篇）');
  if(wp&&wp.topic.indexOf('申论')>=0&&snap.shenlun===0) res.gaps.push('本周主题就是「'+wp.topic+'」，需要抓紧');
  // —— 归因（规则式：数据可推断的部分）——
  if(snap.days<targetDays&&snap.hours>0){
    var avg=snap.hours/snap.days;
    res.reasons.push('单日均 '+Math.round(avg*10)/10+'h，'+(avg<1?'低于在职节奏（可能被工作挤占），建议把任务挪到周日/周一主力日':'节奏尚可，主要是天数不足')+'');
  }
  if(snap.total>0&&(snap.total-snap.wrong)/snap.total<0.5){
    res.reasons.push('正确率低于 50%，可能当前题目难度偏高，建议退回基础题');
  }
  // —— 调整建议（触发规则：滞后/超前 → 具体动作）——
  if(overall<60){
    res.adjustments.push('本周完成度不足六成：保留主线（申论+资料+政治理论），本周数量/常识任务顺延到下周');
    res.adjustments.push('下周目标下调 20%：申论 1 篇保底，主力日优先，轻量日可只做 15 分钟');
  }else if(overall<85){
    res.adjustments.push('接近达标：保持当前节奏，周日前把主线科目补齐即可');
  }else{
    res.adjustments.push('超前完成：可提前预习下周主题，或加 1 篇申论练笔');
  }
  if(snap.shenlun===0) res.adjustments.push('申论是当前最优先科目：下次主力日先写 1 篇（可传手写图让 AI 批改）');
  res.encourage=overall>=85?'节奏很好，继续保持 🌱':overall>=60?'已经过半了，周末主力日冲一下就达标 💪':'别焦虑，先从今晚 30 分钟开始，比计划更重要的是别断 ✨';
  return res;
}

function aiGapAnalysis(wk,snap,notes){
  var plan=(window.KB_DATA&&window.KB_DATA.study_plan)||{};
  var p=getTodayPlan();
  var payload={
    plan:{week:p.week,weekPlan:p.weekPlan,stage:(plan.stages||[]).map(function(s){return s.name+'('+s.range+'):'+s.goal;})},
    actual:snap,
    history:notes.slice(-3).map(function(n){return {date:n.date,learned:n.learned,errors:n.errors,adjust:n.adjust};}),
    baseline:(plan.diagnosis||[])
  };
  var ruleRes=ruleGapAnalysis(wk,snap,notes);
  openSheet('<div style="text-align:center;padding:24px 0"><div style="font-size:36px;margin-bottom:8px">🤖<\x2Fdiv><div style="font-size:14px;color:var(--ink2)">AI 正在分析你的计划执行情况…<br><span style="font-size:12px">（约10-30秒，失败时自动用规则分析兜底）<\x2Fspan><\x2Fdiv><\x2Fdiv>');
  aiChat([
    {role:'system',content:PROMPT_GAP},
    {role:'user',content:JSON.stringify(payload)}
  ],{max_tokens:4096,jsonMode:true}).then(function(txt){
    var d;
    try{ d=parseAIJSON(txt); }catch(pe){ d=ruleRes; toast('AI 输出异常，已用规则分析兜底'); }
    if(!d||typeof d!=='object'||(!d.completion&&!d.gaps&&!d.matches)){ d=ruleRes; toast('AI 输出不完整，已用规则分析兜底'); }
    d.adjustments=normalizeAdjustments(d.adjustments);
    renderGapResult(wk,d);
  }).catch(function(err){
    toast('AI 不可用，已用规则分析（数据可靠）');
    renderGapResult(wk,ruleRes);
  });
}
/* 偏差结果渲染（AI 与规则引擎共用） */
function renderGapResult(wk,d){
  var body='';
  body+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
    +'<span style="font-size:12px;color:var(--ink3)">W'+(wk||'?')+' · '+todayStr()+(d.byRule?' · 📐 规则引擎':' · 🤖 AI')+'<\x2Fspan>'
    +'<span style="font-size:22px;font-weight:800;color:var(--gold-d)">'+esc(d.completion||'—')+'<\x2Fspan><\x2Fdiv>';
  if(d.matches&&d.matches.length){
    body+='<div class="rule-card"><h4>✓ 做到了<\x2Fh4>';
    d.matches.forEach(function(s){ body+='<p style="margin-bottom:4px">· '+esc(s)+'<\x2Fp>'; });
    body+='<\x2Fdiv>';
  }
  if(d.gaps&&d.gaps.length){
    body+='<div class="rule-card rose"><h4>△ 没做到<\x2Fh4>';
    d.gaps.forEach(function(s){ body+='<p style="margin-bottom:4px">· '+esc(s)+'<\x2Fp>'; });
    body+='<\x2Fdiv>';
  }
  if(d.reasons&&d.reasons.length){
    body+='<div class="rule-card"><h4>🔎 可能原因<\x2Fh4>';
    d.reasons.forEach(function(s){ body+='<p style="margin-bottom:4px">· '+esc(s)+'<\x2Fp>'; });
    body+='<\x2Fdiv>';
  }
  if(d.adjustments&&d.adjustments.length){
    body+='<div class="rule-card gold"><h4>🔧 下周动态调整建议<\x2Fh4>';
    d.adjustments.forEach(function(s){ body+='<p style="margin-bottom:5px;line-height:1.7">· '+esc(s)+'<\x2Fp>'; });
    body+='<button class="btn btn-pri btn-block btn-sm" id="btn-adj-apply" style="margin-top:8px">📝 认可这些建议？转为正式调整<\x2Fbutton>';
    body+='<\x2Fdiv>';
  }
  if(d.encourage) body+='<div style="text-align:center;font-size:13px;color:var(--green-d);font-weight:600;margin-top:10px">'+esc(d.encourage)+'<\x2Fdiv>';
  body+='<div style="font-size:11px;color:var(--ink3);margin-top:10px;text-align:center">确认制：点上方按钮→可编辑→确认后，日历与今日计划立即显示新安排；不确认则维持原计划。<\x2Fdiv>';
  openFull('计划偏差分析',body);
  var applyBtn=$('btn-adj-apply');
  if(applyBtn) applyBtn.addEventListener('click',function(){
    confirmAdjustmentFlow(wk||getTodayPlan().week,d.adjustments);
  });
}

/* ==================== 微信通知（计划严重偏离提醒 · Server酱通道） ==================== */
function notifyKey(){ return lsGet('notify_sckey')||''; }
function notifyReady(){ return !!notifyKey(); }
/* 发送：no-cors fire-and-forget（form-urlencoded 是 CORS 安全类型，服务端可正常解析） */
function sendWxNotify(title,despMd){
  var key=notifyKey();
  if(!key) return Promise.resolve(false);
  return fetch('https://sctapi.ftqq.com/'+encodeURIComponent(key)+'.send',{
    method:'POST',mode:'no-cors',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'title='+encodeURIComponent(title.slice(0,32))+'&desp='+encodeURIComponent(despMd||'')
  }).then(function(){ return true; }).catch(function(){ return false; });
}
/* 当日去重标记 */
function notifyFlag(rule){
  var f=lsGet('notify_sent')||{};
  var t=todayStr();
  if(f.date!==t){ f={date:t}; }
  return !!f[rule];
}
function setNotifyFlag(rule){
  var f=lsGet('notify_sent')||{};
  var t=todayStr();
  if(f.date!==t){ f={date:t}; }
  f[rule]=1;
  lsSet('notify_sent',f);
}
/* —— 检测规则（确定性，复用已有偏差引擎）——
   A: 今日打卡后 comparePlanActual 为明显偏差(红)
   B: 当前量化目标里 🔴差距大 的项 ≥2
   未配置 key 时首次触发 → 每天只提示一次去配置 */
function checkAndNotify(){
  var severe=[];
  try{
    var p=getTodayPlan();
    if(checkedToday()){
      var cmp=comparePlanActual(todayStr(),p);
      if(cmp.level==='red') severe.push('A');
    }
    var gg=(typeof goalGapSummary==='function')?goalGapSummary():null;
    if(gg){
      var farCnt=gg.items.filter(function(it){ return it.g.st==='far'; }).length;
      if(farCnt>=2) severe.push('B');
    }
  }catch(e){ return; }
  if(!severe.length) return;
  // 组装消息
  var lines=[];
  severe.forEach(function(r){
    if(r==='A') lines.push('- 今日打卡与计划**明显偏差**（时长差>1h或内容跑偏），纠偏建议见工作台首页');
    if(r==='B'){
      var gg2=goalGapSummary();
      var parts=(gg2?gg2.items:[]).filter(function(it){ return it.g.st==='far'; }).slice(0,3)
        .map(function(it){ return it.label+' '+goalLineText(it); });
      if(parts.length) lines.push('- 量化目标落后：'+parts.join('、')+'（'+(gg2?gg2.date:'')+'目标）');
    }
  });
  if(!lines.length) return;
  var title=gardenName()+'：学习计划偏离提醒';
  var desp='**今天是 '+todayStr()+'**\n\n'+lines.join('\n\n')+'\n\n> 别慌，打开工作台看「纠偏二选一」，补主线即可。';
  if(!notifyReady()){
    // 未配置：每天提示一次去配置（不打扰）
    if(!notifyFlag('hint')){ setNotifyFlag('hint'); toast('检测到计划明显偏离，可在「申论-配置」里开启微信提醒'); }
    return;
  }
  var flag=severe.join('_');

/* ==================== 计划调整层（数据流：基础JSON + 调整记录 → 界面实时叠加） ==================== */
/* 结构：{date:'确认日', week:W号, changes:[{type:'reduce'|'add'|'replace', target:'W9', text:'...'}], fromAI:bool}
   存 localStorage(plan_adjustments) + 云端任务清单表备份(任务=[计划调整]/状态=已确认) */
function getAdjustments(){ return sanitizeAdjustments(lsGet('plan_adjustments')); }
function activeAdjustment(week){
  var list=getAdjustments();
  for(var i=list.length-1;i>=0;i--){ if(!list[i].week || list[i].week===week) return list[i]; }
  return null;
}
function saveAdjustment(adj){
  adj={date:String(adj.date||'').slice(0,10),week:(typeof adj.week==='number')?adj.week:null,fromAI:!!adj.fromAI,
       changes:(Array.isArray(adj.changes)?adj.changes:[]).filter(function(c){return c&&typeof c.text==='string'&&c.text.trim();})
         .map(function(c){return {type:String(c.type||'ai'),text:c.text.slice(0,200)};})};
  if(adj.changes.length===0){ toast('调整内容为空，未保存'); return false; }
  var list=getAdjustments();
  list.push(adj);
  try{ lsSet('plan_adjustments',list); }catch(x){ toast('本地存储失败'); return false; }
  // 云端备份（fire-and-forget）
  if(state.online && typeof addTaskRecord==='function'){
    addTaskRecord({
      '任务':{text:'[计划调整W'+(adj.week||'?')+'] '+adj.changes.map(function(c){return c.text;}).join('；').slice(0,180)},
      '日期':{date:adj.date},
      '模块':{select:optId('task_module','复盘')},
      '状态':{select:optId('task_status','复盘')}
    },{record_id:'adj_'+Date.now(),任务:'[计划调整]',日期:adj.date+'T00:00:00Z',模块:'复盘',状态:'复盘'});
  }
  return true;
}
/* AI 建议一键转「待确认草稿」→ 用户编辑确认后保存 → 界面立即重渲染 */
/* manual=true 时不带 AI 建议，用户自己从零写（AI 不合理时走这条路） */
function confirmAdjustmentFlow(week,aiAdjustments,manual){
  aiAdjustments=normalizeAdjustments(aiAdjustments);
  var body='';
  body+='<div style="font-size:12px;color:var(--ink3);margin-bottom:10px">'+(manual?'自己写一条计划调整：写清楚改什么、怎么改，确认后界面立即更新（可随时在「调整记录」里撤销）。':'把 AI 建议转成本周的正式调整。下面的文字【可以直接改】——删掉不认可的行、改成你要的说法，再确认。')+'</div>';
  body+='<div class="field"><label>调整内容（可编辑，删掉你不认可的）</label>';
  body+='<textarea class="input" id="adj-text" rows="4" style="resize:vertical;line-height:1.7">';
  (aiAdjustments||[]).forEach(function(a,i){ body+=(i?'\n':'')+a; });
  body+='</textarea></div>';
  body+='<div class="field"><label>生效范围</label><select class="select" id="adj-scope"><option value="0">从本周起持续生效</option><option value="'+week+'">仅 W'+week+' 本周</option></select></div>';
  body+='<div style="display:flex;gap:8px"><button class="btn btn-pri" style="flex:1" id="adj-confirm">✓ 确认调整（界面立即更新）</button><button class="btn btn-ghost" data-sf-close>取消</button></div>';
  openSheet(body);
  $('adj-confirm').addEventListener('click',function(){
    var txt=$('adj-text').value.trim();
    if(!txt){ toast(manual?'写点内容再确认':'内容已清空——全不认可就点取消，或改写后再确认'); return; }
    var scope=$('adj-scope').value;
    var lines=txt.split('\n').filter(function(l){return l.trim();}).map(function(l){return l.trim().replace(/^[-·•]\s*/,'');});
    var ok=saveAdjustment({date:todayStr(),week:scope==='0'?null:parseInt(scope,10),changes:lines.map(function(l){return {type:'ai',text:l};}),fromAI:true});
    if(ok){ closeSheet(); toast('✓ 调整已生效，界面已更新'); renderAll(); }
  });
}

function getAllCategories(){

    +'🧮 本次自动汇总：总题量 <b>'+s.total+'</b> 题 · 错题 <b>'+s.wrong+'</b> 题 · '+(s.rate!=null?('错误率 <b>'+s.rate+'%</b>'):'未填题量')
    +(s.parts.length?('<br><span style="font-size:12px;color:var(--ink2)">'+s.parts.join(' ｜ ')+'</span>'):'')
    +'</div>');
}
/* 汇总所有已填数量的错题标签：{total,wrong,rate,parts:[...]}，全部为空返回 null */
function wrongQtySummary(){
  var total=0,wrong=0,filled=0,parts=[];
  var cats=getAllCategories();
  state.ckWrongSelected.forEach(function(key){
    var q=state.ckWrongQty[key]||{};
    var t=num(q.total),w=num(q.wrong);
    if(t!=null||w!=null){
      if(t==null)t=0; if(w==null)w=0;
      filled++;
      total+=t; wrong+=w;
      var rate=t>0?Math.round((t-w)/t*100):null;
      parts.push(esc(subName(key))+' '+t+'题/错'+w+(rate!=null?('（正确率'+rate+'%）'):''));
    }
  });
  if(!filled) return null;
  var rate=total>0?Math.round((total-wrong)/total*1000)/10:null;
  return {total:total,wrong:wrong,rate:rate,parts:parts};
}
/* 错题标签汇总 → 所属一级模块聚合（用于学习记录表分模块写入） */
function wrongQtyByCat(){
  var map={};   // {catName:{total,wrong}}
  state.ckWrongSelected.forEach(function(key){
    var q=state.ckWrongQty[key]||{};
    var t=num(q.total),w=num(q.wrong);
    if(t==null && w==null) return;
    if(t==null)t=0; if(w==null)w=0;
    var catKey=key.indexOf('_')>=0?key.slice(0,key.indexOf('_')):key;
    var cat=findCategory(catKey);
    var nm=cat?cat.name:'其他';
    if(!map[nm]) map[nm]={total:0,wrong:0};
    map[nm].total+=t; map[nm].wrong+=w;
  });
  return map;
}
