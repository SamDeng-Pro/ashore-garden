政是申论文化自信主题的素材富矿，重点把握精神内涵与传承路径。", "申论角度": "「文化自信」「精神谱系」「守正创新」等主题的核心案例。", "行测角度": "常识判断考精神谱系内涵、红色遗址等。"}]}, {"date": "2026-10-03", "title": "тЏатю░тѕХт«ютЈЉт▒ЋтЁиУ║ФТЎ║УЃйС║ДСИџ", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/03/content_30184169.html", "page": "第03版 要闻", "category": "科技航天", "full_text": "一台四足机器人，本事真不小——搭载可见光、红外、气体等多类传感器，一旦捕捉到监测对象微量泄漏，即刻向中控平台发出预警。\n在位于浙江绍兴市上虞区的具身智能测试实验室长三角中心，完成15天化工真实工况考核、取得国家级测试认证后，这款四足机器人前不久在浙江闰土新材料有限公司液氯生产车间正式“上岗”。公司常务副总经理傅哉荣说，“用上机器人，高危区域人员暴露时长降低90%，提高安全性，效率还高。”\n7月30日召开的中共中央政治局会议强调，“深入实施‘人工智能+’行动，发展智能经济新形态”。\n上虞区已引进具身智能产业项目20个、总投资超150亿元，行业头部项目加速集聚。科研能力相对弱、人才吸引力不强，何以竞逐新赛道？上虞区的回答是：因地制宜，推动科技创新和产业创新深度融合，把具身智能发展突破口聚焦在产业化落地。\n以场景开放厚植发展根基——\n2025年底，上虞区相关部门走访调研110余家化工企业，梳理安全巡检、危险作业监督等6类典型场景，选取包括闰土新材料在内的5家企业开展机器人智能巡检试点。\n克服高温、强电磁等复杂工况，40台数据采集机器人持续收集生产信息，获取高精度操作数据超15万条，汇入具身智能数据底座。\n机器人逐步掌握识读仪表、排查泄漏等专业技能。具身智能机器人企业扎根生产场景，打磨出更成熟的智能设备；在垂直领域训练模型，让传统化工园区更安全、更智能。\n不拼模型拼场景、不拼算力拼制造、不追全面追特色，上虞坚持走场景牵引、制造配套的发展路径。今年初，上虞区设立场景培育应用办公室，助力具身智能等产业发展。\n以生态协同培育转型优势——\n在卧龙电气驱动集团股份有限公司生产车间，一枚枚关节电机有序下线。它们将被送往浙江智鼎机器人有限公司上虞生产基地，驱动机器人四肢灵活行动。\n“深耕电机制造40余年，面对人工智能发展浪潮，我们急需为传统制造寻找新的突破口。”卧龙电气驱动集团董事长庞欣元坦言。\n在上虞区政府牵线搭桥下，该企业与机器人整机企业协同攻关，打通上下游协作堵点。2025年，卧龙电气驱动集团关节电机及模组订单实现较快增长，老牌制造企业拓展出“第二增长曲线”。\n另一边，浙江中欣氟材股份有限公司研发的轻量化高强度特种材料，可用于机器人关键构件，在市场上具备一定竞争优势。在上虞区，具身智能完整产业配套体系加快成形，本土制造基础正持续转化为发展优势。\n智元创新、翼菲科技、七腾机器人等一批具身智能标杆企业相继落地，总投资超15亿元的绍兴具身智能综合服务中心投用……上虞区构建起测试认证、指挥调度、场景体验、中试训练一体化支撑体系。\n“发展未来产业不必另起炉灶，扎根既有产业根基同样能实现换道超车。”上虞区委书记钱林江表示，上虞区将坚持打好“平台、产业、场景、生态”组合拳，不断集聚产业资源、凝聚发展合力。\n浙江绍兴市上虞区深入实施“人工智能+”行动\n因地制宜发展具身智能产业\n本报记者  刘军国 《人民日报》（ 2026年10月03日 第 03 版）", "facts": ["公司常务副总经理傅哉荣说，“用上机器人，高危区域人员暴露时长降低90%，提高安全性，效率还高", "”\n7月30日召开的中共中央政治局会议强调，“深入实施‘人工智能+’行动，发展智能经济新形态”", "上虞区已引进具身智能产业项目20个、总投资超150亿元，行业头部项目加速集聚"], "summary": "一台四足机器人，本事真不小——搭载可见光、红外、气体等多类传感器，一旦捕捉到监测对象微量泄漏，即刻向中控平台发出预警。\n在位于浙江绍兴市上虞区的具身智能测试实验室长三角中心，完成15天化工真实工况考核、取得国家级测试认证后，这款四足机器人前…", "analysis": [{"考点": "科技航天/数字经济", "解读": "科技成就与数字经济是常识判断高频考点，重点记忆成就名称、时间节点、首次/突破等关键信息。", "申论角度": "科技创新素材，可支撑「科技自立自强」「新质生产力」「数字中国」等大作文主题。", "行测角度": "常识判断考成就与意义对应；注意「首次」「突破」等限定词。"}, {"考点": "经济民生", "解读": "民生经济类政策是申论与行测双高频，重点把握政策的目标、举措与成效。", "申论角度": "民生保障、高质量发展主题的核心论据，可提炼「问题—举措—成效」论证链。", "行测角度": "常识判断可能考政策名称、出台背景与具体数字。"}]}, {"date": "2026-10-03", "title": "жЊ┐жћхТГЦС╝љ  уї«уц╝уЦќтЏй", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/03/content_30184170.html", "page": "第03版 要闻", "category": "重要会议/讲话", "full_text": "10月1日，澳门特区政府庆祝中华人民共和国成立77周年升旗仪式上，首次全面采用中式队列步操及中国人民解放军敬礼方式。护旗队及仪仗队以饱满的热忱、昂扬的风貌，展现专业风采与飒爽英姿，用铿锵的步伐向祖国献礼。\n澳门特区政府不久前修订《敬礼及礼仪规章》行政法规，规定澳门保安部队及保安部门人员的敬礼及礼仪制度以中国人民解放军的敬礼方式及中式步操作为标准。修改后的行政法规自10月1日起生效。\n澳门全面推行中式队列步操，正式与国家标准接轨，彰显了国家主权与民族精神。整齐划一的正步，表达了澳门儿女对祖国的热爱和尊敬，标志着爱国爱澳教育的持续深化落实。\n从金莲花广场上的中式队列步操中，澳门居民深深感受到澳门与祖国血脉相连，澳门的前行离不开祖国的关怀支持和温暖托举。澳门居民特别是青年一代，将更多、更深入地了解国家发展，主动、紧密地对接国家“十五五”规划，贯彻实施澳门第三个五年规划，奋力开创“一国两制”事业高质量发展新局面。\n铿锵步伐  献礼祖国\n富子梅 《人民日报》（ 2026年10月03日 第 03 版）", "facts": ["10月1日，澳门特区政府庆祝中华人民共和国成立77周年升旗仪式上，首次全面采用中式队列步操及中国人民解放军敬礼方式", "修改后的行政法规自10月1日起生效", "铿锵步伐  献礼祖国\n富子梅 《人民日报》（ 2026年10月03日 第 03 版）"], "summary": "10月1日，澳门特区政府庆祝中华人民共和国成立77周年升旗仪式上，首次全面采用中式队列步操及中国人民解放军敬礼方式。护旗队及仪仗队以饱满的热忱、昂扬的风貌，展现专业风采与飒爽英姿，用铿锵的步伐向祖国献礼。\n澳门特区政府不久前修订《敬礼及礼仪…", "analysis": [{"考点": "经济民生", "解读": "民生经济类政策是申论与行测双高频，重点把握政策的目标、举措与成效。", "申论角度": "民生保障、高质量发展主题的核心论据，可提炼「问题—举措—成效」论证链。", "行测角度": "常识判断可能考政策名称、出台背景与具体数字。"}, {"考点": "文化传承/精神谱系", "解读": "文化类时政是申论文化自信主题的素材富矿，重点把握精神内涵与传承路径。", "申论角度": "「文化自信」「精神谱系」「守正创新」等主题的核心案例。", "行测角度": "常识判断考精神谱系内涵、红色遗址等。"}]}, {"date": "2026-10-03", "title": "С║«уѓ╣у║итЉѕ  СИГтЏйС╗БУАетЏбтєЇУјиСИЃжЄЉ", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/03/content_30184171.html", "page": "第03版 要闻", "category": "重要会议/讲话", "full_text": "当地时间10月2日，名古屋亚运会迎来开幕后的第十三个比赛日。中国体育代表团全力拼搏、亮点纷呈，在拳击、网球等7个大项中各夺得1枚金牌。截至当日比赛结束，中国代表团共获得162金81银73铜，继续领跑奖牌榜。\n拳击项目的11个级别决赛全部在2日进行。在女子51公斤级决赛中，本届亚运会开幕式中国代表团旗手、巴黎奥运会冠军吴愉以5∶0战胜越南选手阮氏心，成功卫冕。杨成宇、包子怡和韩雪振在各自级别中各获一枚银牌。\n网球女单决赛，王曦雨以6∶2、6∶1战胜队友张帅摘得金牌，收获洛杉矶奥运会参赛资格，张帅获得银牌。中国队实现亚运会网球女单六连冠，同时连续三届包揽该项目冠亚军。蒋欣玗/张天汇获得混双铜牌。\n牛馨冉在柔道女子78公斤以上级决赛中取胜，马静月在跆拳道女子49公斤级决赛中胜出，分别为中国代表团赢得了本届亚运会的首枚柔道金牌和跆拳道金牌。李梦麒/朱静怡为中国队夺得了射箭反曲弓混合团体金牌。陈琳和苑丽颖分别赢得皮划艇激流回旋女子极限皮艇和场地自行车女子争先赛的冠军。\n摔跤项目当日继续进行，中国队选手佈和额尔敦获得男子自由式125公斤级银牌，冯紫琪和李文吉在各自级别获得铜牌。\n（本报记者刘硕阳、李硕、孙龙飞、孙亚慧）\n亚运会开幕后第十三个比赛日\n亮点纷呈  中国代表团再获七金\n《人民日报》（ 2026年10月03日 第 03 版）", "facts": ["当地时间10月2日，名古屋亚运会迎来开幕后的第十三个比赛日", "中国体育代表团全力拼搏、亮点纷呈，在拳击、网球等7个大项中各夺得1枚金牌", "截至当日比赛结束，中国代表团共获得162金81银73铜，继续领跑奖牌榜"], "summary": "当地时间10月2日，名古屋亚运会迎来开幕后的第十三个比赛日。中国体育代表团全力拼搏、亮点纷呈，在拳击、网球等7个大项中各夺得1枚金牌。截至当日比赛结束，中国代表团共获得162金81银73铜，继续领跑奖牌榜。\n拳击项目的11个级别决赛全部在2…", "analysis": [{"考点": "综合时政", "解读": "综合类时政，建议结合具体内容做常识性了解。", "申论角度": "可作背景知识储备，理解国家发展大势。", "行测角度": "常识判断可能以细节题形式考查。"}]}, {"date": "2026-10-03", "title": "СИГтЏйуйЉуљЃтЦ│тЇЋт«ъуј░С║џУ┐љтЁГУ┐ътєа", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/03/content_30184172.html", "page": "第03版 要闻", "category": "重要会议/讲话", "full_text": "当地时间10月2日，在名古屋亚运会网球女单决赛中，中国队选手王曦雨以6∶2、6∶1战胜队友张帅，摘得金牌，同时拿下洛杉矶奥运会的参赛席位。中国队实现亚运会网球女单六连冠，也达成连续三届包揽该项目冠亚军的亮眼战绩。\n相差12岁的两代网球金花，决赛后真诚相拥，张帅亲手将国旗披在王曦雨身上，定格下属于中国网球的温情瞬间。\n“今年我为自己定了两个目标，一个是拿大满贯冠军，另一个就是参加亚运会。”这是张帅第四次参加亚运会，早在2010年广州亚运会，她就收获了女团金牌。她依然渴望站上亚运会赛场，为国争光。\n王曦雨的晋级之路遭遇了考验。半决赛对阵菲律宾选手伊埃拉，她一度落后，却顶住压力顽强反击，最终完成逆转。看到王曦雨获胜，等待双打比赛上场的张帅与她拥抱庆祝。“帅姐说太棒了，恭喜你。我说谢谢帅姐，我们互相成就。”王曦雨说。\n决赛后的新闻发布会上，张帅坦言，自己由衷为王曦雨的突破感到高兴，“属于她的美好都还在后面。”\n面对前辈的祝福，王曦雨也动情回应：“在我最不自信的时候，是她一直告诉我：‘你可以。’”\n这份温情，并不只流淌在她们二人之间。长期在海外巡回赛独自打拼的队员们，在中国网球队这个集体里享受到让人安心的归属感。王曦雨说：“我们所有队员一直在互帮互助，彼此鼓舞。”她感慨，代表国家出战给予了自己更多力量。\n前辈倾情应援，后辈心怀感念，这份可贵的精神底色，比一枚金牌更加珍贵。中国女网能够在亚运赛场保持强势，背后正是生生不息的集体力量。\n（本报记者王美华、人民网记者胡雪蓉参与采写）\n中国网球女单实现亚运六连冠\n本报记者  李  硕  高  佶 《人民日报》（ 2026年10月03日 第 03 版）", "facts": ["当地时间10月2日，在名古屋亚运会网球女单决赛中，中国队选手王曦雨以6∶2、6∶1战胜队友张帅，摘得金牌，同时拿下洛杉矶奥运会的参赛席位", "相差12岁的两代网球金花，决赛后真诚相拥，张帅亲手将国旗披在王曦雨身上，定格下属于中国网球的温情瞬间", "”这是张帅第四次参加亚运会，早在2010年广州亚运会，她就收获了女团金牌"], "summary": "当地时间10月2日，在名古屋亚运会网球女单决赛中，中国队选手王曦雨以6∶2、6∶1战胜队友张帅，摘得金牌，同时拿下洛杉矶奥运会的参赛席位。中国队实现亚运会网球女单六连冠，也达成连续三届包揽该项目冠亚军的亮眼战绩。\n相差12岁的两代网球金花，…", "analysis": [{"考点": "文化传承/精神谱系", "解读": "文化类时政是申论文化自信主题的素材富矿，重点把握精神内涵与传承路径。", "申论角度": "「文化自信」「精神谱系」「守正创新」等主题的核心案例。", "行测角度": "常识判断考精神谱系内涵、红色遗址等。"}]}, {"date": "2026-10-03", "title": "赓续伟大精神  凝聚奋进力量", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/03/content_30184175.html", "page": "第04版 视觉", "category": "重要会议/讲话", "full_text": "今年是中国共产党成立105周年、红军长征胜利90周年。“雄关漫道真如铁，而今迈步从头越。”伟大长征精神穿越时空、历久弥新，在新时代愈发彰显重要意义。\n追寻足迹，上好“行走的大思政课”。人们纷纷奔赴“重走长征路”的旅途，在革命旧址前重温峥嵘岁月，在烈士陵园里缅怀革命先烈，在崇山峻岭间寻访红军小道。用脚步丈量岁月，用体验加深感悟，伟大长征精神在砥砺前行中薪火相传。\n传承精神，用好红色资源这一生动教材。纪念中国工农红军长征胜利90周年主题展览、《伟大转折》演出等，吸引人们到场观看；各类红色主题活动走进社区、乡村、学校、公园，通过更加多元的渠道直抵大众。拓展文化载体、创新表达形式，让历史变得更加可亲可感，伟大长征精神在守正创新中大力弘扬。\n矢志振兴，走好老区发展新路。充分挖掘长征历史文化资源，深耕红色旅游，加力农文旅融合发展；造大桥、通高铁、兴产业，让发展成果更好惠及人民群众……长征沿线老区奋力推动乡村全面振兴、经济社会发展，伟大长征精神在实践创造中熠熠生辉。\n习近平总书记指出：“不论我们的事业发展到哪一步，不论我们取得了多大成就，我们都要大力弘扬伟大长征精神，在新的长征路上继续奋勇前进。”追寻长征足迹，传承红色基因，赓续伟大精神，凝聚奋进力量，我们一定能在新时代的长征路上续写新的辉煌！\n赓续伟大精神  凝聚奋进力量\n韩春瑶 《人民日报》（ 2026年10月03日 第 04 版）", "facts": ["今年是中国共产党成立105周年、红军长征胜利90周年", "纪念中国工农红军长征胜利90周年主题展览、《伟大转折》演出等，吸引人们到场观看", "赓续伟大精神  凝聚奋进力量\n韩春瑶 《人民日报》（ 2026年10月03日 第 04 版）"], "summary": "今年是中国共产党成立105周年、红军长征胜利90周年。“雄关漫道真如铁，而今迈步从头越。”伟大长征精神穿越时空、历久弥新，在新时代愈发彰显重要意义。\n追寻足迹，上好“行走的大思政课”。人们纷纷奔赴“重走长征路”的旅途，在革命旧址前重温峥嵘岁…", "analysis": [{"考点": "重要会议/领导人讲话", "解读": "时政高频考点，重点记忆讲话中的核心论断、重大判断与标志性表述，常以常识判断或申论材料背景形式出现。", "申论角度": "讲话精神可作为申论大作文的立意来源与论据引用，如「中国式现代化」「以人民为中心」等主题。", "行测角度": "常识判断常考讲话中的新提法、新表述；政治理论模块可能考查讲话出处与核心要义。"}, {"考点": "科技航天/数字经济", "解读": "科技成就与数字经济是常识判断高频考点，重点记忆成就名称、时间节点、首次/突破等关键信息。", "申论角度": "科技创新素材，可支撑「科技自立自强」「新质生产力」「数字中国」等大作文主题。", "行测角度": "常识判断考成就与意义对应；注意「首次」「突破」等限定词。"}]}, {"date": "2026-10-02", "title": "神州共欢歌  同心贺华诞", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184111.html", "page": "第01版 要闻", "category": "重要会议/讲话", "full_text": "这是举国同庆的时刻，这是献给母亲的赞歌。\n“此时此刻，我们为新中国取得的举世瞩目成就无比自豪，对中国式现代化的光明前景充满信心。”习近平总书记在庆祝中华人民共和国成立77周年招待会上指出。\n10月1日，从天安门广场到雪域边疆，一面面五星红旗迎风飘扬，一曲曲雄壮国歌响彻心扉，一声声“祖国万岁”深情抒怀。亿万中华儿女共同祝福伟大祖国繁荣富强、各族人民幸福安康，意气风发豪情万丈。\n中国红，涌动神州。盛景里，深沉的爱国情怀沛然奔涌。\n同升一面旗\n矢志不渝的告白\n1日6时许，首都北京。迎着清晨第一缕阳光，国旗护卫队英姿飒爽走向天安门广场升旗台。\n“向——国旗——敬礼！”\n随着仪仗队员的口号声，《义勇军进行曲》响彻广场，人们肃立注目，齐声高唱国歌，五星红旗在朝阳中冉冉升起。随后万羽和平鸽掠过，《歌唱祖国》旋律奏响，人们挥舞着手中的国旗，放声合唱。\n这一刻，最深情的告白发自肺腑，最美好的祝福献给祖国。从亚运会赛场回来的中国举重队教练员石智勇说：“看着五星红旗升起，我深刻感受到祖国的强盛伟大。”曾以运动员的身份让五星红旗一次次在国际赛场升起的他，决心带领队伍“用成绩为祖国争光”。\n这一天，“我爱你，中国”响彻神州各地，中国红映照街头巷尾，五星红旗飘扬在国门口岸，中国空间站传来“宇宙级”祝福。云南玉溪聂耳广场，国歌声嘹亮，市民王爽特意带女儿看升旗，“这样的国庆特别有意义。”江西南昌八一广场，数万人肃立注视国旗冉冉升起，祝愿祖国蒸蒸日上。人们与国旗同框，与时代同行，与国家同心，坚信明天会更好。\n“家是玉麦，国是中国”，用行动道出最深沉的爱恋。1日10时，西藏隆子县玉麦乡，玉麦边境派出所国门护旗队步履铿锵。按照国家移民管理局部署，“国门同升一面旗”主题升旗仪式在大型对外开放口岸、边境旅游景区举行。这是玉麦被列入首批重要口岸升旗点位后，首次在国庆举行集中升旗仪式。\n当年玉麦升起的第一面五星红旗下，只有守边人一家三口。如今，百余人在这里观礼，“三人乡”也成了“小康乡”。守边人卓嘎的女儿、玉麦乡纽林塘村党支部书记巴桑卓嘎说：“从小看着阿妈和外公守玉麦，现在我接过了接力棒。”\n同怀赤子心\n薪火相传的信仰\n欢度国庆，是对来时路的回望，更是一场跨越时空的爱国主义共鸣。人们瞻仰革命旧址、重温红色故事，在历史纵深中锚定前行方向。\n上海兴业路76号，石库门小楼的朱红窗棂一如百余年前，五星红旗迎风飘扬，“一大红”与“国庆红”交相辉映。\n中共一大纪念馆里，20多名孩子围坐一堂，跟着老师读创意童书，学党史故事。这是纪念馆在国庆假期为青少年开设的实景党史课堂。\n翻开立体书，“南陈北李，相约建党”的画卷映入眼帘。“真理的味道，非常甜！”复旦大学第二附属学校学生陈阅禾学得认真。厚重的历史，走出展柜、走进心灵。\n从哪里来，到哪里去，鉴往知来、向史而新。从石库门前红旗猎猎，嘉兴南湖波光粼粼，到宝塔山下绿意葱茏，太行深处生生不息……薪火相传，源于一脉相承的价值追求。\n嘉陵江畔，重庆渝中，红岩精神的发源地。\n红岩革命纪念馆展厅中央，“千秋红岩”情景剧上演。结合馆藏文物和史料，工作人员用演出串联起峥嵘岁月。红色文化的滋养，在思接千载的历史回眸之中，也在可感、可知、可参与的切身体验之中。\n同筑强国梦\n一往无前的奋进\n太行山下，河南林州市庙荒村，红旗渠水穿村而过。昔日贫瘠的荒山坡，长出稳产增收的丰产田。\n20多公里外，红旗渠纪念馆纪念碑广场上，游客们高唱《歌唱祖国》，在不远处的抡锤体验点，人们双手攥紧铁锤奋力挥下，感受着数十年前逢山凿洞、遇沟架桥的可贵精神。\n“老一辈人靠苦干实干，硬生生凿出红旗渠。”来自山东的创业者刘可说，跟修渠一样，脚踏实地、实干奋斗，才能把日子越过越红火。\n在中华民族绵延发展的历史长河中，爱国主义始终是激昂的主旋律，也必将作为团结奋斗、自强不息的精神纽带，激励我们朝气蓬勃迈向未来。\n“一步一步坚定走”。今日中国，走出万千气象，走在中国式现代化的康庄大道。看，长征出发地瑞金到落脚点延安高铁直达，平陆运河通江达海，“九章四号”刷新纪录，丰收画卷徐徐铺展，科技进步日新月异，爱国主义深入人心，团结奋斗精神昂扬。\n“只要我们坚定信心、锚定目标，一步一步扎实往前走，成功就一定属于伟大的中国共产党、伟大的中国人民、伟大的中华人民共和国！”\n前进的号角激昂嘹亮，逐梦的光芒照见未来！\n（本报记者潘俊强、琼达卓嘎、曹玲娟、沈靖然、赵帅杰、张天培、周欢、叶传增；统筹：栾心怡）\n神州共欢歌  同心贺华诞\n本报记者 《人民日报》（ 2026年10月02日 第 01 版）", "facts": ["”习近平总书记在庆祝中华人民共和国成立77周年招待会上指出", "10月1日，从天安门广场到雪域边疆，一面面五星红旗迎风飘扬，一曲曲雄壮国歌响彻心扉，一声声“祖国万岁”深情抒怀", "同升一面旗\n矢志不渝的告白\n1日6时许，首都北京"], "summary": "这是举国同庆的时刻，这是献给母亲的赞歌。\n“此时此刻，我们为新中国取得的举世瞩目成就无比自豪，对中国式现代化的光明前景充满信心。”习近平总书记在庆祝中华人民共和国成立77周年招待会上指出。\n10月1日，从天安门广场到雪域边疆，一面面五星红旗…", "analysis": [{"考点": "重要会议/领导人讲话", "解读": "时政高频考点，重点记忆讲话中的核心论断、重大判断与标志性表述，常以常识判断或申论材料背景形式出现。", "申论角度": "讲话精神可作为申论大作文的立意来源与论据引用，如「中国式现代化」「以人民为中心」等主题。", "行测角度": "常识判断常考讲话中的新提法、新表述；政治理论模块可能考查讲话出处与核心要义。"}, {"考点": "科技航天/数字经济", "解读": "科技成就与数字经济是常识判断高频考点，重点记忆成就名称、时间节点、首次/突破等关键信息。", "申论角度": "科技创新素材，可支撑「科技自立自强」「新质生产力」「数字中国」等大作文主题。", "行测角度": "常识判断考成就与意义对应；注意「首次」「突破」等限定词。"}]}, {"date": "2026-10-02", "title": "坚定信心、锚定目标，一步一步扎实往前走", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184112.html", "page": "第01版 要闻", "category": "重要会议/讲话", "full_text": "时间坐标，镌刻坚实足迹。壮阔征程，召唤新的进发。\n“只要我们坚定信心、锚定目标，一步一步扎实往前走，成功就一定属于伟大的中国共产党、伟大的中国人民、伟大的中华人民共和国！”\n在庆祝中华人民共和国成立77周年招待会上，习近平总书记回顾新中国成立以来党团结带领人民不懈奋斗取得的伟大成就，充分肯定今年以来党和国家事业取得新进展新成效，对推进中国式现代化提出明确要求，激励全党全国各族人民朝着全面建成社会主义现代化强国的第二个百年奋斗目标奋勇前进。\n道路决定命运。历经千辛万苦、付出巨大代价，中国式现代化是中国共产党和中国人民长期实践探索的成果，何其伟大、何其不易！\n从“一派衰败凋零的景象”到“一派欣欣向荣的气象”，站在历史节点上回望，新中国取得的举世瞩目成就令人无比自豪，我们更加深刻认识到，中国式现代化是强国建设、民族复兴的康庄大道。\n在“两个结合”中守好根和魂，这条路走得对。\n平陆运河通江达海，开辟西南地区运距最短、最经济、最便捷的出海通道，让100多年前《建国方略》中的设想变为现实。放眼今日中华大地，高速列车飞驰、公路四通八达……“只有我们中国共产党人实现了”。\n从“一辆汽车、一架飞机、一辆坦克、一辆拖拉机都不能造”，到如今成为工业门类最齐全的世界制造业第一大国、世界第二大经济体，以现代化产业体系为战略依托，我国经济顶风破浪、保持强大韧性和活力。\n致力于团结奋斗、致力于共同富裕、致力于全面发展、致力于永续发展、致力于和平发展，这条路“深深植根于中华优秀传统文化，体现科学社会主义的先进本质，借鉴吸收一切人类优秀文明成果，代表人类文明进步的发展方向”。\n中国式现代化，开辟的是人类迈向现代化的新道路，开创的是人类文明新形态，把一个个“不可能”变成“一定能”。\n以“中国之制”支撑“中国之治”，这条路走得稳。\n这样的时刻振奋人心！继今年7月长征火箭完成全球首次海上网系回收后，8月朱雀火箭成功实现我国首次陆地回收。发挥新型举国体制优势，火箭回收海陆双捷再次证明“对我们‘卡脖子’是卡不住的”。\n直面经济下行压力，一揽子增量政策促进经济回暖向好；遭遇关税战、贸易战，“打出了中国人的志气骨气底气，彰显了我们的硬核实力”……\n极不寻常、极不平凡的新时代，我们为什么能够一次次临危不乱、化险为夷？\n“经过长期探索和实践，中国特色社会主义制度展现出巨大优势，我国国家治理体系和治理能力现代化水平不断提高，实现中华民族伟大复兴势不可挡。”习近平总书记的话语贯穿历史、当下和未来。\n实践充分证明，党的领导是中国特色社会主义制度的最大优势。有党中央集中统一领导，亿万人民就有了风雨来袭时最可靠的主心骨，就能把国家发展进步的命运牢牢掌握在自己手中。\n以高质量发展全面推进中国式现代化，这条路走得好。\n从建成全球规模最大、发展最快的可再生能源体系，到全球百强创新集群数量连续四年位居全球第一，再到“中国智造”成为中国式现代化的又一亮丽名片……\n“中国是全球稳定与增长、贸易以及技术变革的稳定力量和核心引擎。”有国际人士认为，高质量发展已经成为当下中国的鲜明特征，标志着中国正在转向以新质生产力、创新、可持续和韧性为核心的增长。\n今天的中国，锚定高质量发展这一首要任务，新质生产力勃发奔涌，城乡融合、区域协调发展蓄势向前，在创造高品质生活、推进高效能治理、实现高水平安全、扩大高水平开放中不断拓展发展空间、引领发展未来。\n胸怀远大目标、立志千秋伟业。\n越是前无古人的伟大事业，越要坚定道路自信、理论自信、制度自信、文化自信，保持道不变、志不改的定力；\n越是充满光荣和梦想的远征，越要激扬“要登绝顶莫辞劳”的韧劲、保持“一步一步扎实往前走”的干劲。\n奋进“十五五”，展望“2035”，眺望“本世纪中叶”，蓝图已经绘就，道路在我们脚下延伸。\n向前进，我们笃定且从容——\n中国式现代化前景无比光明，中国人民和中华民族的前进步伐不可阻挡！\n坚定信心、锚定目标，一步一步扎实往前走\n——论学习贯彻习近平总书记在庆祝中华人民共和国成立77周年招待会上重要讲话\n本报评论员 《人民日报》（ 2026年10月02日 第 01 版）", "facts": ["平陆运河通江达海，开辟西南地区运距最短、最经济、最便捷的出海通道，让100多年前《建国方略》中的设想变为现实", "继今年7月长征火箭完成全球首次海上网系回收后，8月朱雀火箭成功实现我国首次陆地回收", "奋进“十五五”，展望“2035”，眺望“本世纪中叶”，蓝图已经绘就，道路在我们脚下延伸"], "summary": "时间坐标，镌刻坚实足迹。壮阔征程，召唤新的进发。\n“只要我们坚定信心、锚定目标，一步一步扎实往前走，成功就一定属于伟大的中国共产党、伟大的中国人民、伟大的中华人民共和国！”\n在庆祝中华人民共和国成立77周年招待会上，习近平总书记回顾新中国成…", "analysis": [{"考点": "重要会议/领导人讲话", "解读": "时政高频考点，重点记忆讲话中的核心论断、重大判断与标志性表述，常以常识判断或申论材料背景形式出现。", "申论角度": "讲话精神可作为申论大作文的立意来源与论据引用，如「中国式现代化」「以人民为中心」等主题。", "行测角度": "常识判断常考讲话中的新提法、新表述；政治理论模块可能考查讲话出处与核心要义。"}, {"考点": "经济民生", "解读": "民生经济类政策是申论与行测双高频，重点把握政策的目标、举措与成效。", "申论角度": "民生保障、高质量发展主题的核心论据，可提炼「问题—举措—成效」论证链。", "行测角度": "常识判断可能考政策名称、出台背景与具体数字。"}]}, {"date": "2026-10-02", "title": "朝着全面建成社会主义现代化强国目标奋勇前进", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184113.html", "page": "第01版 要闻", "category": "重要会议/讲话", "full_text": "“只要我们坚定信心、锚定目标，一步一步扎实往前走，成功就一定属于伟大的中国共产党、伟大的中国人民、伟大的中华人民共和国！”9月30日晚，习近平总书记在庆祝中华人民共和国成立77周年招待会上发表重要讲话。\n广大干部群众和社会各界表示，习近平总书记重要讲话令人鼓舞、催人奋进，要坚定信心、奋楫笃行，在新的征程上以只争朝夕、永不懈怠的精神，凝心聚力把强国建设、民族复兴的宏伟蓝图变成美好现实。\n为成就无比自豪，对前景充满信心\n现场聆听习近平总书记的重要讲话，全国劳动模范、中国铁路哈尔滨局集团有限公司齐齐哈尔车辆段满洲里运用车间工会主席陈佳倍感自豪。\n“从自主设计修建京张铁路，到如今纵横交错的高铁网，一部中国铁路发展史，就是一部民族复兴史的缩影。中国发展的列车一路奔驰向前，我们真心感到无比骄傲。”陈佳说。\n汽笛鸣响，运河奔流。平陆运河通航半个月以来，5000吨级船舶穿行，书写西南向海新篇章。\n“总书记谈到新中国77年来取得的成就，我们既是见证者，也是参与者。”平陆运河集团广西平陆运河建设有限公司董事长程耀飞说，“平陆运河的通航凝聚了几代人的梦想，是伟大祖国非凡成就的最好例证。能够参与建设运河，我感到与有荣焉，也更加明白了伟大成就是党和人民一道拼、一道干、一道奋斗出来的。”\n就在几天前，“中国天眼”迎来落成十周年。“十年来，‘中国天眼’交出远超预期的科学答卷。从跟跑、追赶到世界领跑，背后是一代代人筚路蓝缕、不懈努力，伟大事业薪火相传。我们将接续奋斗，不断提升原始创新能力，打牢科技强国建设根基，朝着全面建成社会主义现代化强国的第二个百年奋斗目标奋勇前进。”中国科学院国家天文台副台长、“中国天眼”总工程师姜鹏说。\n今年是中国共产党成立105周年。历史雄辩地证明，没有中国共产党，就没有新中国，就没有中华民族伟大复兴。\n“正如习近平总书记重要讲话中所强调的，我们党团结带领人民不懈奋斗，创造了经济快速发展和社会长期稳定两大奇迹。”“七一勋章”获得者、河南濮阳县庆祖镇西辛庄村党支部书记李连成感慨万千，“火车跑得快，全靠车头带，基层党组织是战斗堡垒。我们基层党员干部要牢固树立和践行正确政绩观，在推进乡村全面振兴中带好头，发扬优良作风，带领乡亲们撸起袖子加油干。”\n制度优势是一个国家的最大优势。全国人大代表、新疆大学历史学院教授孟楠说：“总书记指出，‘经过长期探索和实践，中国特色社会主义制度展现出巨大优势’。我们要立足高校历史学科优势，继续讲好制度优势的生动实践，以学术担当助力国家发展。”\n锐意进取、奋力拼搏，实现“十五五”良好开局\n“十五五”开局起步，我国发展进入基本实现社会主义现代化夯实基础、全面发力的关键时期。\n山东省德州市陵城区边临镇的农田里，一派丰收在望的喜人景象。今年6月24日，习近平总书记曾来到这里，同乡亲们亲切交流。种粮大户范长顺当时就在现场。\n“总书记在讲话中强调要努力完成全年目标任务，实现‘十五五’良好开局。照目前的玉米长势看，今年一定又是大丰收。”范长顺说，“现在种地全程机械化，农技人员经常到田间地头指导精细化管理，越来越方便省心。加快建设农业强国，种好粮、多打粮，我们信心十足。”\n中国式现代化关键在科技现代化。“十五五”开局之年，以习近平同志为核心的党中央高度重视科技创新，始终把科技创新摆在现代化建设突出位置。\n在位于北京亦庄的国家信创园，开源开放的AI智能体共性基础设施“灵玑OS”项目正在加速技术攻关与标准制定。\n北京通明湖信息技术应用创新中心主任谢涛说：“推进高水平科技自立自强，是时代赋予我们的重大使命。我们将集中力量以关键技术突破筑牢安全根基，努力把科技创新实实在在转化为产业竞争力，奋力为‘十五五’高质量发展夯实科技底座。”\n老百姓的生活是家事，更是国事。“人民生活品质不断提高”是“十五五”时期经济社会发展的主要目标之一。\n即将到来的国庆长假，是上海市黄浦区半淞园路街道市民新村居民区改造后，老街坊们回到这里生活的第一个国庆假期。居委会主任张蔚这几天正忙着和同事们挨家挨户走访居民，开展节前安全检查和服务保障工作。\n“总书记反复嘱托，要切实保障和改善民生。我们必须始终把民生提质作为基层工作重心，用心用情为居民做好事、办实事、解难事。”张蔚说。\n蓝图绘就，实干为要。\n在雄安新区启动区雄安国贸中心项目建设现场，有一片被称为“地下心脏”的区域，900多间地下机房承载着电气、暖通、消防、给排水等多个系统功能。雄安雄商置业有限公司工程管理部工程师崔浩田正打着手电筒，认真逐排检查管线。\n“习近平总书记格外看重‘雄安质量’。对我们一线建设者来说，创造‘雄安质量’就是要把每一道工序做成放心工程，把每一次调试做到准确无误。”崔浩田说，“我们要通过苦干实干，把美好蓝图变成生动可及、经得起时间检验的现实。”\n使命如山，号角催征。国防大学军事文化学院教授程倩表示：“习主席的重要讲话令全军官兵倍感振奋，我们一定牢记统帅嘱托，深入贯彻习近平强军思想，把我们党领导的这支英雄军队锻造得更加坚强，为实现建军一百年奋斗目标、开创国防和军队现代化新局面不懈奋斗。”\n坚定信心、锚定目标，一步一步扎实往前走\n国庆节前的北京长安街花团锦簇，从建国门的“长征赓续”花坛，到复兴门以奔腾骏马为主景的“勇往直前”花坛，串起中国的过去、现在与未来。\n“我们外卖骑手每次路过这些花坛时，都感觉很振奋。习近平总书记说，一步一步扎实往前走，成功就一定属于伟大的中国共产党、伟大的中国人民、伟大的中华人民共和国！我坚定相信，大家把每份工作做好、每一步走好，一定会有更美好的未来。”在国庆招待会现场，全国优秀共产党员、北京美团707骑手党支部书记高丰信心满满。\n基础研究是科技创新的源头，其水平决定着一个国家科技创新的底蕴和后劲。今年4月30日，习近平总书记出席加强基础研究座谈会并发表重要讲话，发出了新时代新征程进一步打牢科技强国建设根基的号召。\n“国家所需，就是科研所向。”在西安交通大学绿色氢电全国重点实验室，中国科学院院士郭烈锦和团队成员正坚守在科研一线。“我们要按照总书记要求，传承弘扬西迁精神，强化家国担当，坚持教育科技人才一体推进，围绕能源供给安全与绿色低碳转型等领域，啃硬骨头、闯无人区，以原始创新的扎实成果服务中国式现代化建设。”郭烈锦说。\n革命摇篮井冈山，来自各地的参观者走进纪念场馆，从红色记忆里汲取奋进力量，在今昔映照中感悟老区振兴发展实践。\n“今年是中国工农红军长征胜利90周年。站在新的历史起点，铭记苦难辉煌，奔赴复兴梦想。我们要深刻领悟习近平总书记重要讲话精神，以井冈山精神、苏区精神、长征精神滋养初心、砥砺品格，教育引导党员、干部坚定理想信念、牢记初心使命、积极开拓进取、勇于担当作为，努力为党和人民争取更大光荣。”中国井冈山干部学院教授杨少华说。\n国家的希望在青年，民族的未来在青年。\n“今年5月，习近平总书记回信鼓励我们‘青年建功正当其时’，这次的重要讲话，令我感到奋进方向更加清晰。”中国青年五四奖章获得者、一汽解放集团股份有限公司商用车开发院特级技能师时敬龙表示，将牢记嘱托，“坚定信心、锚定目标”，在新征程上贡献青春力量。\n弘扬家国情怀，开创远大前程。\n“习近平总书记的重要讲话让我感受深刻，香港的底气在祖国，香港的机遇在祖国。”香港大学机械工程系教授黄明欣对未来更有信心。\n安徽省政协港澳台侨和外事委员会副主任吴志斌表示，习近平总书记在国庆招待会上重申了对港澳的相关方针政策，我们应当发扬爱国爱港爱澳的传统，在融入与服务国家发展大局的同时实现自身更好发展。\n“国家好，民族好，两岸同胞才会好。”全国台企联常务副会长吴家莹说，台湾同胞将与大陆同胞并肩携手、同心同行，为实现中华民族伟大复兴而努力。\n朝着全面建成社会主义现代化强国目标奋勇前进\n——习近平总书记在庆祝中华人民共和国成立77周年招待会上的重要讲话激励亿万人民踔厉奋发、勇毅前行\n新华社记者 《人民日报》（ 2026年10月02日 第 01 版）", "facts": ["”9月30日晚，习近平总书记在庆祝中华人民共和国成立77周年招待会上发表重要讲话", "平陆运河通航半个月以来，5000吨级船舶穿行，书写西南向海新篇章", "“总书记谈到新中国77年来取得的成就，我们既是见证者，也是参与者"], "summary": "“只要我们坚定信心、锚定目标，一步一步扎实往前走，成功就一定属于伟大的中国共产党、伟大的中国人民、伟大的中华人民共和国！”9月30日晚，习近平总书记在庆祝中华人民共和国成立77周年招待会上发表重要讲话。\n广大干部群众和社会各界表示，习近平总…", "analysis": [{"考点": "重要会议/领导人讲话", "解读": "时政高频考点，重点记忆讲话中的核心论断、重大判断与标志性表述，常以常识判断或申论材料背景形式出现。", "申论角度": "讲话精神可作为申论大作文的立意来源与论据引用，如「中国式现代化」「以人民为中心」等主题。", "行测角度": "常识判断常考讲话中的新提法、新表述；政治理论模块可能考查讲话出处与核心要义。"}, {"考点": "文化传承/精神谱系", "解读": "文化类时政是申论文化自信主题的素材富矿，重点把握精神内涵与传承路径。", "申论角度": "「文化自信」「精神谱系」「守正创新」等主题的核心案例。", "行测角度": "常识判断考精神谱系内涵、红色遗址等。"}]}, {"date": "2026-10-02", "title": "从“红色电波”到数智之城（赓续长征精神  奋进复兴征程）", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184114.html", "page": "第01版 要闻", "category": "科技航天", "full_text": "贵州省遵义市红花岗区子尹路96号，遵义会议纪念馆，一座二层小楼静静矗立。纪念馆里有一件特别的藏品——“半部电台”复制品，90多年前，“红色电波”穿越战火、传递情报，帮助红军长征时在危急关头掌握主动、寻得出路。\n90多年后，在这片见证历史转折的土地上，新的变化正在发生。\n2021年2月，习近平总书记在贵州考察时强调，“在实施数字经济战略上抢新机”“从长征精神和遵义会议精神中深刻感悟共产党人的初心和使命，落实新时代党的建设总要求，实事求是、坚持真理，科学应变、主动求变，咬定目标、勇往直前，走好新时代的长征路”。2025年3月，总书记在贵州考察时指出：“要弘扬长征精神和遵义会议精神，以昂扬斗志走好新时代的长征路。”\n深入贯彻落实习近平总书记重要指示精神，近年来，遵义抢抓机遇，着力发展数字经济，2025年全市大数据融合发展指数提升至50.51，综合发展水平位居全省前列。\n瞄准技术前沿，发展闯出新天地。\n在遵义高新区的菲利信（遵义）数字科技有限公司，数据标注师紧盯屏幕。随着鼠标移动，街景轮廓、物体框线被一一勾勒。在这里，海量原始数据经过加工后，将为智能驾驶迭代提供支撑。\n“公司从签约到投运，仅用时3个月。”菲利信公司总经理文维介绍，公司聚焦AI（人工智能）大模型训练、互联网内容审核、自动驾驶数据标注三大业务，交付效能相较行业平均水平提升40%。\n“遵义发挥丰富的应用场景、充足的人力资源和毗邻成渝等优势，在数字经济赛道上寻找突破口。”遵义市大数据发展中心主任安超介绍，2025年遵义新增培育500万元以上软件和信息技术服务企业7家，规上软件和信息技术服务业营收增速达43.6%，规上互联网和相关服务业营收增速达4.8%。\n坚持数实融合，产业焕发新活力。\n在位于播州区的卓豪农业科技（集团）股份有限公司，“卓豪源”农业生产智慧化管理平台集成气象监测、精准灌溉、虫情预警等功能，实现农产品从生产到销售的全流程管理。“以前农民靠眼看、手摸，现在平台自动预警、自动推送防治方案，相当于给土地装上了‘传感器’。”公司技术负责人梅建飞说，平台汇聚农事记录170万条，相关技术已推广至外地。\n山地农业、酱酒产业、红色文化资源等，都是遵义发展数字经济的“家底”。立足自身资源禀赋和产业基础，遵义积极推动传统产业数字化升级。目前，遵义已在农业、工业等领域落地175个优秀数字化应用场景，文旅产业也找到了新的表达空间。\n戴上VR（虚拟现实）设备，眼前是弥漫的硝烟，耳边是呼啸的炮火……在遵义会议纪念馆“转折·从头越”展厅，游客仿佛亲历了娄山关大捷的激战时刻。2025年，纪念馆完成数字化展陈升级，重点实施投影系统改造，以虚实结合的方式全景呈现长征关键节点场景。“数字化保护、场景化呈现，让每一件文物都可以讲述长征故事，助力弘扬伟大长征精神。”遵义会议纪念馆信息技术部副主任黄超说。\n回望烽火岁月，红军将士在黔北大地冲破重重困局，于绝境之中寻出路，实现伟大历史转折。今天，遵义拥抱数字经济，变的是发展场景，不变的是一脉相承的精神力量。\n贵州遵义着力发展数字经济\n从“红色电波”到数智之城（赓续长征精神  奋进复兴征程）\n本报记者  马跃峰  陈隽逸 《人民日报》（ 2026年10月02日 第 01 版）", "facts": ["贵州省遵义市红花岗区子尹路96号，遵义会议纪念馆，一座二层小楼静静矗立", "纪念馆里有一件特别的藏品——“半部电台”复制品，90多年前，“红色电波”穿越战火、传递情报，帮助红军长征时在危急关头掌握主动、寻得出路", "90多年后，在这片见证历史转折的土地上，新的变化正在发生"], "summary": "贵州省遵义市红花岗区子尹路96号，遵义会议纪念馆，一座二层小楼静静矗立。纪念馆里有一件特别的藏品——“半部电台”复制品，90多年前，“红色电波”穿越战火、传递情报，帮助红军长征时在危急关头掌握主动、寻得出路。\n90多年后，在这片见证历史转折…", "analysis": [{"考点": "重要会议/领导人讲话", "解读": "时政高频考点，重点记忆讲话中的核心论断、重大判断与标志性表述，常以常识判断或申论材料背景形式出现。", "申论角度": "讲话精神可作为申论大作文的立意来源与论据引用，如「中国式现代化」「以人民为中心」等主题。", "行测角度": "常识判断常考讲话中的新提法、新表述；政治理论模块可能考查讲话出处与核心要义。"}, {"考点": "科技航天/数字经济", "解读": "科技成就与数字经济是常识判断高频考点，重点记忆成就名称、时间节点、首次/突破等关键信息。", "申论角度": "科技创新素材，可支撑「科技自立自强」「新质生产力」「数字中国」等大作文主题。", "行测角度": "常识判断考成就与意义对应；注意「首次」「突破」等限定词。"}]}, {"date": "2026-10-02", "title": "从9月4场展会看“中国机遇2.0”", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184115.html", "page": "第01版 要闻", "category": "科技航天", "full_text": "“十五五”开局之年，中国经济向新向优，对外开放步履稳健。\n刚刚过去的9月，4场重要展会——第二十六届中国国际投资贸易洽谈会、2026年中国国际服务贸易交易会、第二十三届中国—东盟博览会和第五届全球数字贸易博览会，先后在福建厦门、北京、广西南宁和浙江杭州举办。\n习近平总书记指出：“‘十五五’规划既是中国自身的发展蓝图，也是面向世界的合作清单。”\n投洽会聚焦双向投资，服贸会立足服务贸易，东博会扎根区域合作，数贸会锚定数字贸易。4场展会，主题各有侧重，却交相呼应，贸易强国的三大支柱货物贸易、服务贸易、数字贸易均在其中。\n透过4场展会，“中国机遇2.0”徐徐铺展——不再只是单一的市场优势，而是开放红利、创新红利、市场红利融合共振，给世界带来更多的发展机遇、更大的发展空间。\n开放红利——\n展会每年如约而至，高水平开放的稳定承诺\n4场展会每年如约而至，本身就是中国对外开放掷地有声的稳定承诺。\n国际形势动荡加剧，中国坚持开门办展，搭建联通全球的经贸平台，用持续落地的行动证明，开放不是一时之举，而是长期不变的选择。\n细看4场展会的主宾国，一张跨越大洲的合作网络清晰延展。投洽会首次设置双主宾国，芬兰、沙特阿拉伯携手担任；服贸会主宾国为挪威，集中展示绿色能源、数字科技等；东博会迈入“12国13方”共办新格局，东盟扩容以后11个东盟国家首次在南宁齐聚；数贸会主宾国由马来西亚、匈牙利担任，海外展团数量超过往届总和。\n从北欧、中东到东盟，不同资源禀赋、不同发展阶段的国家，都能在中国的展会平台上找到合作切口。\n中国机遇是什么？\n投洽会现场，一大批跨国企业用实际行动给出了答案：稳定发展的中国，正是全球资本追寻的确定性“绿洲”，“到中国去”成为跨国企业实实在在的行动。\n截至2025年底，中国吸收外资的存量近4万亿美元。今年上半年，近4800家外资企业追加对华投资。\n“高水平对外开放不仅带来了资本的流动和技术的进步，更增强了理念的融合和创新的发展。”ABB集团全球副总裁董慧娟表示，近年来，中国通过出台稳外资行动方案，实施新版鼓励外商投资产业目录，有效激发了外资企业在华增资发展的积极性。\n中国的对外开放，从来不是单向的“引进来”，而是双向奔赴的投资共赢。\n印度尼西亚岛屿众多，能源基础设施分布不均，如何提升资源利用效率？中集集团子公司中集安瑞科携手合作伙伴在当地建设钢焦一体化项目，将工业尾气转化为高附加值的清洁能源产品，为全球工业绿色转型提供系统化的“中国方案”。\n截至2025年底，我国在境外设立的企业达5.8万家，为东道国年均创造就业岗位超200万个。中国企业“走出去”，带去项目、技术与就业，激活当地发展动能，实现“各美其美”。\n东博会开幕前夕，平陆运河正式通航，为中国西南与东盟的产业协作打开了新的想象空间。“平陆运河未来还有望开拓欧洲、非洲和印度洋方向的贸易路线。”马来亚大学中国研究所所长饶兆斌说。\n创新红利——\n首发首秀集中亮相，新技术驱动合作新引擎\n展会，是近距离观察中国创新的绝佳窗口。4场展会现场，大量首发首秀集中亮相。\n浙江追梦空天在数贸会展示的混动倾转载人eVTOL（电动垂直起降飞行器），最大有效载荷600公斤，最大设计航程1000公里，不仅速度高、航程远，而且补能快、基建轻。\n乐奇Rokid第二代带显示的全功能人工智能眼镜，在拍摄、翻译、提词、导航、支付等功能基础上，进一步强化了细分场景能力。\n…………\n澳大利亚资本投资有限公司副总裁郑汉镇表示，国际资本在评估中国企业时，除了关注中国市场本身，也越来越关注企业能否依托中国的研发、制造和供应链能力，长期服务于全球市场。\n从“在中国生产”转向“在中国创造”，越来越多的跨国公司来到中国，设立研发中心、地区总部，深度融入中国创新链、产业链。在中国，各国企业能够快捷地找到从研发、试制到量产的全流程合作伙伴。\n“中国对外资的吸引逻辑，正从提供市场机会进一步走向提供创新机会。”勃林格殷格翰相关负责人殷妤涵表示，计划在上海张江设立新的研发中心，深化与中方的合作。\n中国的创新红利，不仅意味着投资机遇，还有赋能发展、共享成果。很多中国创新走的是开源路线，这让更多国家特别是发展中国家能够用得上、用得起新技术、新产品。\n数智经济时代，如何弥合数智鸿沟？今年的东博会上，人工智能唱主角，机器人天团、脊柱三维测量、人工智能儿科医生、智能教具等轮番登场，发布东盟人工智能应用场景合作需求42项，达成初步合作意向近百个，其中与东盟国家达成意向合作金额超10亿元。\n中国的新兴领域技术和产品，带给世界的不是冲击而是机遇，不是威胁而是赋能。\n市场红利——\n商品服务协同发力，超大规模市场生机无限\n中国机遇是什么？\n很多人第一反应是庞大的市场。沙特能源巨头Acwa中国区主席赛乐·哈卜提说，中国拥有非常强大的潜在需求市场，有着规模庞大且消费能力与富裕度持续提升的人群。\n从传统供需视角来解构中国超大规模市场——\n需求侧，14亿多人口构筑起超大规模内需基本盘，消费持续迭代升级，为全球企业开辟广阔市场空间；供给侧，完备的工业体系、庞大的产业集群、持续深化的产业转型，释放大量中间品、装备、技术合作空间。\n在服贸会，中国机遇2.0有了新的观察视角——\n产业升级和品质生活需要牵引下，催生出海量的服务业和服务消费发展空间。\n世界贸易中心协会副总裁王迅表示，越来越多的中国品牌走向海外，带出去的不仅是产品，还包括设计、文化和商业模式；与此同时，众多国际品牌进入中国市场，根据中国消费者需求不断创新。\n当前，中国消费市场已进入“商品+服务”并重的发展阶段，过去5年中国人均服务性消费支出年均增长8.5%。从衣食住行，到企业转型、科技创新，都离不开服务业的高质量发展。\n毕马威中国区主席邹俊表示，中国服务业在沿着数智化、标准化、融合化、国际化发展路径稳步前行，“中国服务”的专业能力和国际竞争力不断提升。\n顺应产业发展趋势，中国将服务业作为扩大开放的重点。“过去，我们在制造业上深化改革、扩大开放，成为‘世界工厂’；当前，我们在服务业上以高水平开放促深层次改革、促高质量发展，同样会创造‘中国服务’品牌。”国务院发展研究中心副主任杨正位说。\n澳洲会计师公会会长兼董事会主席戴宾图表示，澳中合作正从传统货物贸易向服务贸易和知识型产业延伸升级，数字经济、专业服务、绿色低碳等领域合作前景广阔。\n中国持续以展会为桥，敞开大门、共享创新、联通市场，让互利共赢的合作之路越走越宽。\n“中国将持续推动高质量发展，扩大高水平对外开放，落实全球发展倡议，推进高质量共建‘一带一路’，同世界各国共享机遇、共创繁荣。”\n从9月4场展会看“中国机遇2.0”\n本报记者  罗珊珊  窦瀚洋 《人民日报》（ 2026年10月02日 第 01 版）", "facts": ["4场展会，主题各有侧重，却交相呼应，贸易强国的三大支柱货物贸易、服务贸易、数字贸易均在其中", "透过4场展会，“中国机遇2.0”徐徐铺展——不再只是单一的市场优势，而是开放红利、创新红利、市场红利融合共振，给世界带来更多的发展机遇、更大的发展空间", "开放红利——\n展会每年如约而至，高水平开放的稳定承诺\n4场展会每年如约而至，本身就是中国对外开放掷地有声的稳定承诺"], "summary": "“十五五”开局之年，中国经济向新向优，对外开放步履稳健。\n刚刚过去的9月，4场重要展会——第二十六届中国国际投资贸易洽谈会、2026年中国国际服务贸易交易会、第二十三届中国—东盟博览会和第五届全球数字贸易博览会，先后在福建厦门、北京、广西南…", "analysis": [{"考点": "重要会议/领导人讲话", "解读": "时政高频考点，重点记忆讲话中的核心论断、重大判断与标志性表述，常以常识判断或申论材料背景形式出现。", "申论角度": "讲话精神可作为申论大作文的立意来源与论据引用，如「中国式现代化」「以人民为中心」等主题。", "行测角度": "常识判断常考讲话中的新提法、新表述；政治理论模块可能考查讲话出处与核心要义。"}, {"考点": "科技航天/数字经济", "解读": "科技成就与数字经济是常识判断高频考点，重点记忆成就名称、时间节点、首次/突破等关键信息。", "申论角度": "科技创新素材，可支撑「科技自立自强」「新质生产力」「数字中国」等大作文主题。", "行测角度": "常识判断考成就与意义对应；注意「首次」「突破」等限定词。"}]}, {"date": "2026-10-02", "title": "全社会跨区域人员流动量预计超3.3亿人次", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184116.html", "page": "第01版 要闻", "category": "民生社会", "full_text": "本报北京10月1日电  （记者韩鑫）记者从交通运输部获悉：10月1日，国庆假期首日，预计全社会跨区域人员流动量33410万人次，环比增长52.3%。\n分方式来看，铁路客运量预计2480万人次，环比增长26.9%，比去年同期增长7.2%；公路人员流动量预计30545万人次，环比增长55.4%，比去年同期下降1.1%；水路客运量预计134万人次，环比增长63%，比去年同期增长1.4%；民航客运量预计251万人次，环比增长2.4%，比去年同期增长0.3%。\n国庆假期首日\n全社会跨区域人员流动量预计超3.3亿人次\n《人民日报》（ 2026年10月02日 第 01 版）", "facts": ["本报北京10月1日电  （记者韩鑫）记者从交通运输部获悉：10月1日，国庆假期首日，预计全社会跨区域人员流动量33410万人次，环比增长52.3%", "分方式来看，铁路客运量预计2480万人次，环比增长26.9%，比去年同期增长7.2%", "公路人员流动量预计30545万人次，环比增长55.4%，比去年同期下降1.1%"], "summary": "本报北京10月1日电  （记者韩鑫）记者从交通运输部获悉：10月1日，国庆假期首日，预计全社会跨区域人员流动量33410万人次，环比增长52.3%。\n分方式来看，铁路客运量预计2480万人次，环比增长26.9%，比去年同期增长7.2%；公路…", "analysis": [{"考点": "综合时政", "解读": "综合类时政，建议结合具体内容做常识性了解。", "申论角度": "可作背景知识储备，理解国家发展大势。", "行测角度": "常识判断可能以细节题形式考查。"}]}, {"date": "2026-10-02", "title": "迈步新征程，我们自信而笃行（一见）", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184117.html", "page": "第02版 要闻", "category": "政策文件", "full_text": "春秋代序又一年，中华人民共和国迎来77周年华诞。中国式现代化，强国建设、民族复兴的唯一正确道路，我们当以怎样的面貌接续走好？\n9月30日，在庆祝中华人民共和国成立77周年招待会上，习近平总书记的重要讲话振奋人心也启迪人心。“自信”与“笃行”是其中蕴藏的深刻指引。\n先说自信。它源于走过的关山千万重。\n“77年来，我们党团结带领人民不懈奋斗，创造了经济快速发展和社会长期稳定两大奇迹，实现了全面建成小康社会的第一个百年奋斗目标”，习近平总书记提纲挈领，激荡持久共鸣。\n筚路蓝缕，以启山林。从“中国人民从此站起来了”的豪迈宣言，到创造“彪炳史册的人间奇迹”历史性解决绝对贫困；从孙中山先生《建国方略》里拓于纸面的铁路、公路、运河蓝图，到一笔笔“只有我们中国共产党人实现了”的历史书写；从期盼“让乡亲们饱餐一顿肉”，到“反而有时候吃五谷杂粮吃得还挺好”的日常点滴……对这个古老民族而言，多少梦想实现在新中国、实现在新时代！\n“此时此刻，我们为新中国取得的举世瞩目成就无比自豪，对中国式现代化的光明前景充满信心。”习近平总书记抚今追昔，更着眼于未来。\n对过去的自豪，涵养于来路上的点滴成效；对未来的自信，则淬炼于实践探索中找到的科学方法、形成的制度优势。\n“经过长期探索和实践，中国特色社会主义制度展现出巨大优势，我国国家治理体系和治理能力现代化水平不断提高，实现中华民族伟大复兴势不可挡。”习近平总书记指出。\n2024年的国庆招待会上，习近平总书记曾深刻阐释“中国共产党领导”“中国特色社会主义道路”之于推进中国式现代化的重要意义。今年的重要讲话里，被两次提及的“十五五”也是优势的例证。\n编制实施“十五五”规划，今年以来“党和国家事业取得新进展新成效”的有力保证；“努力完成全年目标任务”，锚定实现“十五五”良好开局……回溯与展望，“十五五”这条线贯穿始终。\n五年规划，经济社会发展的蓝图和行动纲领。习近平总书记深刻指出：“科学制定和接续实施五年规划，是我们党治国理政一条重要经验，也是中国特色社会主义一个重要政治优势。”正是14个五年的滚石上山，垒筑起中国从站起来、富起来到强起来的历史跨越。而今年，正是“十五五”开局之年。\n迈步新的征程，自信襟怀之外，离不开笃行的实践品格。\n“坚持稳中求进工作总基调，完整准确全面贯彻新发展理念，加快构建新发展格局，进一步深化改革开放，更好统筹发展和安全”；\n“坚定不移贯彻‘一国两制’、‘港人治港’、‘澳人治澳’、高度自治方针，支持香港、澳门更好融入和服务国家发展大局，保持长期繁荣稳定”；\n“坚决打击‘台独’分裂势力，反对外部势力干涉，推动两岸关系和平发展，推进祖国统一大业”；\n“坚持独立自主的和平外交政策，推动落实四大全球倡议，推动构建人类命运共同体，为变乱交织的世界注入更多确定性和正能量”；\n…………\n崇尚什么，反对什么，落脚在行动上。一个个“坚持”“坚定”“坚决”，笃行最生动的彰显——“路子选对了就要坚持走下去”。\n人贵有恒，治国理政更需一股“钉钉子”的精神。它源于习近平同志的长期丰富的基层工作实践，也在治国理政的新实践中得到检验和发展：“钉钉子往往不是一锤子就能钉好的，而是要一锤一锤接着敲，直到把钉子钉实钉牢，钉牢一颗再钉下一颗，不断钉下去，必然大有成效。”\n在比历史上任何时期都更接近实现中华民族伟大复兴的目标的今天，每一步向前迈进都是一次知重负重的勇毅攀登。两年前的国庆招待会上，习近平总书记曾引用南岳衡山的一副对联勉励大家：“遵道而行，但到半途须努力；会心不远，要登绝顶莫辞劳”。\n今年的国庆招待会上，习近平总书记的话同样掷地有声，给人接续奋斗的力量：“只要我们坚定信心、锚定目标，一步一步扎实往前走，成功就一定属于伟大的中国共产党、伟大的中国人民、伟大的中华人民共和国！”\n庆祝共和国华诞的最好行动，就是把以中国式现代化全面推进强国建设、民族复兴这一前无古人的伟大事业不断推向前进。新征程就在脚下，满怀自信，实干笃行，宏伟目标终将实现。\n迈步新征程，我们自信而笃行（一见）\n本报记者  王  洲 《人民日报》（ 2026年10月02日 第 02 版）", "facts": ["春秋代序又一年，中华人民共和国迎来77周年华诞", "9月30日，在庆祝中华人民共和国成立77周年招待会上，习近平总书记的重要讲话振奋人心也启迪人心", "2024年的国庆招待会上，习近平总书记曾深刻阐释“中国共产党领导”“中国特色社会主义道路”之于推进中国式现代化的重要意义"], "summary": "春秋代序又一年，中华人民共和国迎来77周年华诞。中国式现代化，强国建设、民族复兴的唯一正确道路，我们当以怎样的面貌接续走好？\n9月30日，在庆祝中华人民共和国成立77周年招待会上，习近平总书记的重要讲话振奋人心也启迪人心。“自信”与“笃行”…", "analysis": [{"考点": "重要会议/领导人讲话", "解读": "时政高频考点，重点记忆讲话中的核心论断、重大判断与标志性表述，常以常识判断或申论材料背景形式出现。", "申论角度": "讲话精神可作为申论大作文的立意来源与论据引用，如「中国式现代化」「以人民为中心」等主题。", "行测角度": "常识判断常考讲话中的新提法、新表述；政治理论模块可能考查讲话出处与核心要义。"}, {"考点": "经济民生", "解读": "民生经济类政策是申论与行测双高频，重点把握政策的目标、举措与成效。", "申论角度": "民生保障、高质量发展主题的核心论据，可提炼「问题—举措—成效」论证链。", "行测角度": "常识判断可能考政策名称、出台背景与具体数字。"}]}, {"date": "2026-10-02", "title": "多国人士盛赞中国发展成就  期待深化对华合作", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184118.html", "page": "第02版 要闻", "category": "国际外交", "full_text": "据新华社北京电  综合新华社驻外记者报道：近日，我驻外使领馆在全球多地举办招待会等活动，隆重庆祝中华人民共和国成立77周年。出席活动的多国政要高度评价中国发展成就，期待与中国加深互利合作。\n朝鲜最高人民会议常任委员会副委员长金亨植表示，77年来，勤劳勇敢的中国人民战胜种种困难挑战，创造了令人瞩目的发展成就。朝方愿同中方共同努力，为了两国人民的共同利益，推动朝中友好合作关系不断深化发展。\n缅甸副总统南尼尼埃在致辞时高度评价中方提出的四大全球倡议，钦佩中国取得的发展成就，重申缅甸坚定奉行一个中国政策，愿缅中胞波友谊万古长青。\n意大利副总理兼基础设施与交通部部长马泰奥·萨尔维尼说，意中关系富有建设性且充满活力。在人工智能领域，中国已走在前列，两国围绕此领域开展交流十分重要。期盼能再次访华，将中国经验带回意大利。\n津巴布韦高等教育、创新、科学与技术发展部部长弗雷德里克·沙瓦表示，津中友谊历经考验、韧性强大，两国关系建立在主权平等、相互尊重基础之上。同中国的合作对津经济发展起到变革性推动作用，显著改善了民众生活。津方将继续坚定恪守一个中国原则，并在多边场合同中方保持紧密协作。\n南非旅游部部长帕特里夏·德利莱代表南非政府向中国政府和人民致以诚挚祝贺，高度评价中国经济社会发展成就，感谢中方对南非提供的支持和帮助，表示南非愿进一步密切对华交流合作，不断提升两国关系水平。\n波黑议会代表院副主席马林科·查瓦拉表示，波黑从共建“一带一路”合作中获益良多，中国的发展经验为波黑提供了借鉴。他向中国人民致以节日祝贺，祝愿中国更加美好、更加繁荣，在世界上发挥更重要影响力。\n秘鲁外交部副部长埃里克·安德森代表秘鲁政府祝贺新中国成立77周年和秘中建交55周年，高度评价两国建交以来在政治、经贸、人文等领域取得的合作成果。他表示，秘方愿继续同中方加强高层对话，拓展贸易、投资、互联互通等领域发展合作，推动更多合作成果转化为发展、就业、技术进步和民生福祉，不断巩固秘中友好关系。\n斯里兰卡港口和民航部部长兼能源部部长阿努拉·卡鲁纳蒂拉卡高度评价中国式现代化取得的发展成就和斯中合作，重申斯方坚定奉行一个中国政策，感谢中国长期以来给予斯里兰卡的宝贵支持，期待双方继续深化各领域合作，共同建设和平、繁荣的未来。\n德国下萨克森州州长奥拉夫·利斯说，中国展现出的蓬勃活力和创新能力令人印象深刻。下萨克森州有对华合作传统，希望双方在交通、数字经济、智能制造、汽车工业、港口等重点领域继续开展合作。\n澳大利亚新南威尔士州州督代表、州督官方秘书迈克尔·米勒表示，中华人民共和国77年的非凡历程，见证了令人瞩目的发展成就。近20年来，中国一直是新南威尔士州最大的贸易伙伴，期待双方在贸易、医疗和生命科学以及净零排放等领域的合作不断发展。\n哈萨克斯坦外交部驻阿拉木图代表处负责人阿布德拉绍夫说，中国为世界树立了坚持可持续发展的典范。明年将迎来哈中建交35周年，相信这一重要节点将赋予哈中合作新的内涵，进一步释放双方合作潜力。\n比利时副首相兼就业、经济和农业大臣克拉兰瓦尔代表比方热烈祝贺中华人民共和国成立77周年，表示中国是世界主要经济体和比利时的重要伙伴，比方愿同中方一道努力，将双方合作潜力转化为更多惠及两国人民的务实成果。\n土库曼斯坦副总理兼外长梅列多夫祝贺新中国成立77周年，并表示近年来，土中贸易往来与人文交流规模显著增长，期待两国合作不断扩展到更多领域。\n欧盟对外行动署副秘书长茨瓦赫代表欧盟向中方致以国庆祝贺，表示欧中关系已成为世界上最具影响力的双边关系之一，希望双方加强建设性沟通，推动欧中关系向前发展。\n联合国秘书长办公厅主任拉特雷等联合国高官热烈祝贺新中国成立77周年取得的辉煌成就，高度评价中国为联合国多边主义事业所作贡献，并衷心期盼中国为全球和平与发展注入更多动力，推动凝聚更多国际共识造福世界。\n新加坡总理公署部长兼财政部和国家发展部第二部长英兰妮热烈祝贺中华人民共和国成立77周年，积极评价新中国取得的非凡发展成就。英兰妮表示，对新中全方位高质量的前瞻性伙伴关系不断发展满怀信心。明年，新加坡将担任东盟轮值主席国，期待与中方加强协调、密切合作，共同推动地区和平、稳定与繁荣。\n博茨瓦纳总统事务部部长莫瓦萨说，向中国人民致以热烈的节日祝贺。新中国取得的巨大发展成就鼓舞了许多国家，博茨瓦纳愿借鉴中国在改善人民生活和减贫方面的经验。中国是博茨瓦纳“忠实的朋友和可靠的发展伙伴”，博方愿吸引更多中国投资。\n马达加斯加武装力量部部长拉扎菲通布向中国人民致以诚挚的节日祝福。他说，马中两国在农业、数字发展、基础设施建设以及人员培训与交流等领域合作日益密切。马方愿进一步深化对华合作，增进彼此了解，更好服务国家发展，惠及两国人民。\n南非国民议会事务主席塞弗罗利克表示，新中国成立77年来，中国已成为全球主要经济体、科技创新中心以及国际事务的重要参与者。中国的长远眼光、对人才与基础设施的持续投入，为全球南方发展提供了启示。\n加纳环境、科学与技术部部长阿杰曼—罗林斯高度评价新中国77年来取得的辉煌成就及加中各领域合作成果。加纳将于2027年担任非盟轮值主席国，愿同中方持续深化合作，推动非中关系不断迈上新台阶。\n孟加拉国地方政府、农村发展和合作部部长莫因·汗表示，新中国成立77年来，中国走出了一条符合自身国情的中国式现代化道路，为世界和平与发展贡献中国智慧和中国方案。孟方愿同中方加强合作交流，更好造福两国人民。\n阿塞拜疆副总理穆斯塔法耶夫表示，中国是阿塞拜疆的主要经贸伙伴之一，双方投资领域合作积极发展，中国企业越来越广泛地参与阿塞拜疆经济建设。绿色能源是阿塞拜疆同中国开展互利合作的重要领域之一，中国先进的技术能力和丰富经验助力阿塞拜疆开发可再生能源潜力。\n亚美尼亚副总理格里戈良表示，深化发展对华关系是亚美尼亚外交政策优先方向之一。两国政治对话不断深化、经贸合作持续扩大，亚美尼亚“和平十字路口”计划有望与共建“一带一路”倡议有效对接。\n哈萨克斯坦副总理兼国民经济部部长茹曼加林说，发展对华关系是哈外交始终不变的优先方向。哈方愿同中方进一步深化战略互信，推动两国各领域合作在新的“黄金三十年”取得更多成果。\n突尼斯经济与规划部部长阿卜杜勒哈菲兹说，中国宣布对53个非洲建交国实施100％税目产品零关税为密切突中经贸往来提供了重要机遇，突方支持全球发展倡议等中方倡议，愿同中方在中非合作论坛、中阿合作论坛框架下深化互利合作。\n巴西外交部副部长克莱班克在致辞中祝贺中华人民共和国成立77周年。她表示，近年来，巴西已成为中国投资主要目的地，双方还在人工智能、教育、医学等领域开展合作。两国还举办“巴中文化年”各项活动，开展了广泛而多元的文化交流项目，极大促进双方的相互了解。\n乌克兰外交部副部长佩列彼尼斯高度评价新中国波澜壮阔的发展历程和取得的巨大成就，期待同中方深入挖掘合作潜力，携手开启伙伴关系新篇章。\n奥地利前总统菲舍尔说，奥中两国经济联系非常密切，据奥方统计，2025年中国是奥地利在全球第三大贸易伙伴。中国是一个爱好和平的国家、一个值得信赖的伙伴，中国在奥地利民众中享有良好声誉。\n韩国国会副议长南仁顺表示，中国拥有悠久历史，充满发展活力。韩国国会将基于民生与和平两大支柱，推动韩中战略合作伙伴关系顺应时代潮流，不断向前发展。\n多国人士盛赞中国发展成就  期待深化对华合作\n《人民日报》（ 2026年10月02日 第 02 版）", "facts": ["据新华社北京电  综合新华社驻外记者报道：近日，我驻外使领馆在全球多地举办招待会等活动，隆重庆祝中华人民共和国成立77周年", "朝鲜最高人民会议常任委员会副委员长金亨植表示，77年来，勤劳勇敢的中国人民战胜种种困难挑战，创造了令人瞩目的发展成就", "秘鲁外交部副部长埃里克·安德森代表秘鲁政府祝贺新中国成立77周年和秘中建交55周年，高度评价两国建交以来在政治、经贸、人文等领域取得的合作成果"], "summary": "据新华社北京电  综合新华社驻外记者报道：近日，我驻外使领馆在全球多地举办招待会等活动，隆重庆祝中华人民共和国成立77周年。出席活动的多国政要高度评价中国发展成就，期待与中国加深互利合作。\n朝鲜最高人民会议常任委员会副委员长金亨植表示，77…", "analysis": [{"考点": "重要会议/领导人讲话", "解读": "时政高频考点，重点记忆讲话中的核心论断、重大判断与标志性表述，常以常识判断或申论材料背景形式出现。", "申论角度": "讲话精神可作为申论大作文的立意来源与论据引用，如「中国式现代化」「以人民为中心」等主题。", "行测角度": "常识判断常考讲话中的新提法、新表述；政治理论模块可能考查讲话出处与核心要义。"}, {"考点": "科技航天/数字经济", "解读": "科技成就与数字经济是常识判断高频考点，重点记忆成就名称、时间节点、首次/突破等关键信息。", "申论角度": "科技创新素材，可支撑「科技自立自强」「新质生产力」「数字中国」等大作文主题。", "行测角度": "常识判断考成就与意义对应；注意「首次」「突破」等限定词。"}]}, {"date": "2026-10-02", "title": "谱写构建中文命运共同体新篇章（大使随笔）", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184119.html", "page": "第02版 要闻", "category": "国际外交", "full_text": "9月30日，习近平主席同文莱苏丹哈桑纳尔互致贺电，庆祝两国建交35周年。文莱北濒南海，素有“和平之邦”和“婆罗洲明珠”美誉。中文传统友谊源远流长、历久弥坚，两国在携手现代化进程中树立了大小国家相互尊重、平等相待、共同发展的典范。建交35年来，中文政治互信不断深化，各领域合作成果丰硕，人文交流更加密切。\n元首领航，锚定前行方向。元首引领是中文关系快速发展的根本保障。2013年以来，习近平主席和哈桑纳尔苏丹多次会见会谈，建立了深厚互信和诚挚友谊，从战略高度和长远角度为双边关系把舵定向，引领中文关系不断实现历史性跨越。2013年，两国元首决定建立中文战略合作关系。2018年11月，习近平主席对文莱进行国事访问，两国关系提升为战略合作伙伴关系。2025年2月，习近平主席同来华进行国事访问的哈桑纳尔苏丹举行会谈，双方就共建中文命运共同体达成重要共识，引领两国关系进入新的历史发展阶段。\n互利共赢，共享发展成果。中国和文莱坚持共商共建共享，高质量共建“一带一路”取得累累硕果，广西—文莱经济走廊、恒逸石化等旗舰项目稳步推进，为增进文莱民生福祉、加快经济多元化进程作出重要贡献。2025年双边贸易额27.26亿美元，是建交时的200多倍，中国连续多年成为文莱最大外资来源国和前三大贸易伙伴。两国在基础设施、清洁能源利用、杂交水稻育种等领域合作取得积极成果，人工智能、数字经济等领域合作方兴未艾。今年是中国“十五五”开局之年，文莱正朝着“2035宏愿”奋进，两国正以互利共赢的行动，书写在实现现代化道路上携手前行的崭新篇章。\n相知相亲，赓续友好情谊。国之交在于民相亲，中国连续多年成为文莱第二大游客来源国，两国间直飞航班日益频密，民众如走亲戚般常来常往。中国武术教练扎根文莱20年，带领文莱武术运动员多次亮相国际赛事并斩获金牌。今年双方人文交流更放异彩，中国国产具身智能机器人亮相文莱开斋节庆典，中国无人机在文莱夜空画出“共建中文命运共同体”绚丽色彩，中国残疾人艺术团时隔22年再次到访文莱。中国南京市向文莱友城斯里巴加湾市赠送友好纪念雕塑“梦舟”，成为承载中文友好的新地标。\n相互支持，巩固伙伴关系。建交35年来，中文两国在涉及彼此核心利益和重大关切问题上始终坚定支持。文莱坚定奉行一个中国政策，支持中国统一大业。习近平主席提出的构建人类命运共同体理念和四大全球倡议得到文方积极响应。两国在国际和地区事务中密切配合，坚持不同文明和合共生、美美与共，坚持世界各国合作共赢、共同发展，坚定维护多边主义，共同应对全球性挑战。不久前，文莱加入世界人工智能合作组织，同中方一道积极致力于人工智能国际合作和全球治理。两国在推动平等有序的世界多极化和普惠包容的经济全球化等方面有越来越多的共同语言和协同行动，正为新时代中文关系发展注入强劲动力。\n当前，中文关系站在新的历史起点上。在两国元首战略引领下，在两国人民共同努力下，中文两国必将赓续传统友谊，筑牢合作基石，在共同追求现代化的征程上并肩前行，共同谱写构建中文命运共同体新篇章，为地区和世界的和平稳定与发展繁荣作出新的更大贡献。\n（作者为中国驻文莱大使）\n谱写构建中文命运共同体新篇章（大使随笔）\n陈少春 《人民日报》（ 2026年10月02日 第 02 版）", "facts": ["9月30日，习近平主席同文莱苏丹哈桑纳尔互致贺电，庆祝两国建交35周年", "建交35年来，中文政治互信不断深化，各领域合作成果丰硕，人文交流更加密切", "2013年以来，习近平主席和哈桑纳尔苏丹多次会见会谈，建立了深厚互信和诚挚友谊，从战略高度和长远角度为双边关系把舵定向，引领中文关系不断实现历史性跨越"], "summary": "9月30日，习近平主席同文莱苏丹哈桑纳尔互致贺电，庆祝两国建交35周年。文莱北濒南海，素有“和平之邦”和“婆罗洲明珠”美誉。中文传统友谊源远流长、历久弥坚，两国在携手现代化进程中树立了大小国家相互尊重、平等相待、共同发展的典范。建交35年来…", "analysis": [{"考点": "重要会议/领导人讲话", "解读": "时政高频考点，重点记忆讲话中的核心论断、重大判断与标志性表述，常以常识判断或申论材料背景形式出现。", "申论角度": "讲话精神可作为申论大作文的立意来源与论据引用，如「中国式现代化」「以人民为中心」等主题。", "行测角度": "常识判断常考讲话中的新提法、新表述；政治理论模块可能考查讲话出处与核心要义。"}, {"考点": "科技航天/数字经济", "解读": "科技成就与数字经济是常识判断高频考点，重点记忆成就名称、时间节点、首次/突破等关键信息。", "申论角度": "科技创新素材，可支撑「科技自立自强」「新质生产力」「数字中国」等大作文主题。", "行测角度": "常识判断考成就与意义对应；注意「首次」「突破」等限定词。"}]}, {"date": "2026-10-02", "title": "“东盟同中国经贸关系将更加紧密”", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184121.html", "page": "第02版 要闻", "category": "国际外交", "full_text": "“东盟—中国自贸区3.0版升级议定书生效实施后，双方将利用新机遇，在数字化、人工智能、绿色产业和可再生能源等方面培育新的增长动能，实现更大的互利互惠、合作共赢。”在第二十三届中国—东盟博览会期间，东盟秘书长高金洪接受媒体联合采访时表示，自贸区3.0机遇为双方加快建设一体化大市场、创新合作、共同繁荣开辟新路径，推动双方高质量合作迈入新阶段。\n今年对于中国—东盟关系而言是具有里程碑意义的年份，双方迎来建立全面战略伙伴关系5周年、建立对话关系35周年。“35年来，东盟与中国关系稳定发展，双方在政治安全、经济和社会文化三大支柱下设有60多个跨领域合作机制，各领域合作取得丰硕成果；近5年来，东盟与中国关系更是持续拓展、深化、巩固。相信在自贸区3.0机遇推动下，东盟同中国经贸关系将更加紧密，合作领域不断扩大。”高金洪说。\n2025年，中国与东盟贸易额首次突破1万亿美元，达1.05万亿美元，同比增长7.4%。中国连续17年保持东盟第一大贸易伙伴地位，东盟连续6年成为中国最大贸易伙伴。今年前8个月，中国与东盟贸易总值达5.95万亿元人民币，同比增长20.6%。“数据印证了双方关系发展的成色，尽管面临各类挑战，我们始终携手同行。”高金洪表示，应加强东盟—中国自贸区3.0版与《区域全面经济伙伴关系协定》协调，为企业贸易和投资提供更大便利，特别是帮助中小微企业更有效参与区域产供链深度融合，从自贸区3.0机遇中获得实实在在的好处。\n高金洪高度评价东博会在促进东盟国家同中国贸易往来、旅游经济、人员交流等方面发挥的关键作用。“如今，东博会已经成为东盟拓展并深化与中国合作的重要平台，为双方深化务实合作积累互信。”他表示，期待东博会持续发挥关键作用，把自贸区3.0版创造的机会转化为更牢固的商业伙伴关系、更广泛的参与和新的增长来源，助力东盟和中国共同发展进步。\n平陆运河打造了一条中国西南地区联通东盟的航程更短、成本更低、运输更便捷的水运通道。“这是一条具有重要历史意义的运河。”高金洪认为，东盟和中国之间往来的大量货物需要通过港口运输，平陆运河有利于降低物流成本、提升运输稳定性、增强区域经济竞争力，为双方深化务实合作开辟新机遇。\n当前，东盟各国正在推进《东盟数字经济框架协议》谈判。高金洪表示，随着数字经济不断发展，数字化合作有望成为未来东盟与中国合作的重要方向。“东盟—中国自贸区3.0版涵盖数字化相关内容，希望东盟和中国加强创新合作，共享人工智能红利，不仅让企业界受益，更应惠及双方民众，提升东盟地区整体数字化水平。”高金洪说。\n“东盟同中国经贸关系将更加紧密”\n——访东盟秘书长高金洪\n本报记者  李  琰 《人民日报》（ 2026年10月02日 第 02 版）", "facts": ["“东盟—中国自贸区3.0版升级议定书生效实施后，双方将利用新机遇，在数字化、人工智能、绿色产业和可再生能源等方面培育新的增长动能，实现更大的互利互惠、合作共赢", "今年对于中国—东盟关系而言是具有里程碑意义的年份，双方迎来建立全面战略伙伴关系5周年、建立对话关系35周年", "“35年来，东盟与中国关系稳定发展，双方在政治安全、经济和社会文化三大支柱下设有60多个跨领域合作机制，各领域合作取得丰硕成果"], "summary": "“东盟—中国自贸区3.0版升级议定书生效实施后，双方将利用新机遇，在数字化、人工智能、绿色产业和可再生能源等方面培育新的增长动能，实现更大的互利互惠、合作共赢。”在第二十三届中国—东盟博览会期间，东盟秘书长高金洪接受媒体联合采访时表示，自贸…", "analysis": [{"考点": "科技航天/数字经济", "解读": "科技成就与数字经济是常识判断高频考点，重点记忆成就名称、时间节点、首次/突破等关键信息。", "申论角度": "科技创新素材，可支撑「科技自立自强」「新质生产力」「数字中国」等大作文主题。", "行测角度": "常识判断考成就与意义对应；注意「首次」「突破」等限定词。"}, {"考点": "经济民生", "解读": "民生经济类政策是申论与行测双高频，重点把握政策的目标、举措与成效。", "申论角度": "民生保障、高质量发展主题的核心论据，可提炼「问题—举措—成效」论证链。", "行测角度": "常识判断可能考政策名称、出台背景与具体数字。"}]}, {"date": "2026-10-02", "title": "苍洱之间  活力涌现（培育更多“中国服务”品牌）", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184122.html", "page": "第03版 要闻", "category": "民生社会", "full_text": "苍山青翠，洱海泛波。云南大理白族自治州大理市海东镇，环海彩虹公路延展，民宿与小店错落，咖啡飘香，游人漫步。\n旅居游客李丽、荣蓉、朱佩云，在海东镇晶海康养旅居基地结识成伴。“风景漂亮，烟火气足，住得舒心。”李丽说。\n“这边能做理疗，也有乡村集市。”晶海康养旅居基地负责人刘晶晶介绍，“我们还定制了乡村漫游路线，方便客人游玩。”\n惬意的旅居体验，源自这些年的文旅品牌打造。“打造旅居品牌，要盘活乡村资源，补齐发展短板。”海东镇镇长张少玖说，品牌建设之初挑战重重：基础设施需要修缮，新型文旅业态缺少成熟的参考范本，标准化旅居服务体系需要从零搭建……\n村落转型，阻力不小。几年前，海东镇文笔村还是青壮年大量外流、发展滞后的小渔村，村内土路坑洼破损，还有不少院落闲置，更没有完善的配套设施和服务。来村游客多是短期观光，几乎无人长期驻留。\n村党组织牵头，盘活闲置资源，提升接待能力，并优化旅居服务，村民也纷纷投身文旅，创业务工……2025年，文笔村集体收入近百万元，360余人在本村就业。\n文笔村的变迁，是大理州旅居产业提质升级的缩影。\n长久以来，当地文旅产业过度依赖山水观光，产业链条较短。2024年12月，大理州出台关于推进“旅居大理”建设的实施意见，实施“‘百村千宿’培育工程”“经营主体引育工程”等6项重点任务，推动文旅产业从单一观光向康养旅居、文艺创作等多元业态转型。\n洱海对岸，凤阳邑村古朴宁静，成为许多人安居、创业的落脚点。“最打动我的，是它的人文气息和创业氛围。”旅居创业者龚滟蓉说。她和丈夫深挖茶马古道历史，运用白族扎染、草编等本土元素，创作现代艺术作品，还组织本地手艺人与外来创作者相互学习。传统与现代双向赋能、共生共长。\n废弃库房成了美术馆，闲置老宅变身文创空间……凤阳邑村成为名副其实的艺术栖居地，并获评云南省“艺术家第二居所”试点单位，年均接待游客超百万人次。\n“旅居大理”建设过程中，如何跳出同质化发展困境，打造辨识度鲜明的区域品牌？\n大理州持续引导各县市因地制宜、挖掘特色、错位发展，推出文艺、养老、医养、体育等各类主题旅居旅创产品38个，形成多点开花的发展格局。鹤庆县配套建设旅居食堂、亲子托管、村级医疗点等设施，搭建精细化旅居服务体系；巍山彝族回族自治县深挖古城文化与美食资源，依托文体节庆聚拢人气、激活业态；剑川县依托完整茶马古道古村落资源，统筹全县古院落、古镇资源，打造慢生活旅居体系。\n此外，大理州还同步推进专业人才引育工作，激活乡村内生动力。以弥渡县新街镇上马台村为例，当地引入文旅企业，进行专业管理与服务运营，常态化开展社群活动，同时配套收益反哺机制，壮大村集体经济。\n目前，大理州已出台17项专项扶持政策，推动80余个重点村落配备专业运营主体。苍洱之间，这个兼具颜值、文化与温度的旅居目的地，正让越来越多的人“在大理爱上生活”。\n云南大理白族自治州打造特色文旅品牌\n苍洱之间  活力涌现（培育更多“中国服务”品牌）\n本报记者  李茂颖 《人民日报》（ 2026年10月02日 第 03 版）", "facts": ["村党组织牵头，盘活闲置资源，提升接待能力，并优化旅居服务，村民也纷纷投身文旅，创业务工……2025年，文笔村集体收入近百万元，360余人在本村就业", "大理州持续引导各县市因地制宜、挖掘特色、错位发展，推出文艺、养老、医养、体育等各类主题旅居旅创产品38个，形成多点开花的发展格局", "目前，大理州已出台17项专项扶持政策，推动80余个重点村落配备专业运营主体"], "summary": "苍山青翠，洱海泛波。云南大理白族自治州大理市海东镇，环海彩虹公路延展，民宿与小店错落，咖啡飘香，游人漫步。\n旅居游客李丽、荣蓉、朱佩云，在海东镇晶海康养旅居基地结识成伴。“风景漂亮，烟火气足，住得舒心。”李丽说。\n“这边能做理疗，也有乡村集…", "analysis": [{"考点": "经济民生", "解读": "民生经济类政策是申论与行测双高频，重点把握政策的目标、举措与成效。", "申论角度": "民生保障、高质量发展主题的核心论据，可提炼「问题—举措—成效」论证链。", "行测角度": "常识判断可能考政策名称、出台背景与具体数字。"}]}, {"date": "2026-10-02", "title": "新场景激活发展新动能", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184123.html", "page": "第03版 要闻", "category": "科技航天", "full_text": "场景是新技术、新产品、新业态创新性应用的具体情境，一头连着技术、一头连着产业，一头连着研发、一头连着市场。大型矿区里，清洁能源重卡穿行如织；长江航道上，无人机外卖“从天而降”；京杭大运河，新能源船舶驶在零碳航道……一个个具体而生动的场景，把“养在深闺”的技术和产品送进千行百业、推向广阔天地。场景正加速成为释放创新活力、激活发展新动能的重要载体。\n通过培育开放场景释放发展潜能、塑造竞争优势\n我国拥有超大规模的市场、完备的产业体系、巨大的人口规模，带来丰富场景的巨大优势，场景已经成为关键的创新资源。2024年12月召开的中央经济工作会议提出，开展新技术新产品新场景大规模应用示范行动。“十五五”规划纲要中，“场景”一词出现19次，凸显其重要性。面对新一轮科技革命和产业变革，我们必须抓住历史机遇，把丰富场景盘活、用好，将场景优势源源不断地转化为发展动能。\n新场景培育新质生产力，让创新“破土成林”。新质生产力是创新起主导作用的先进生产力质态，它的培育壮大，离不开场景“土壤”的滋养。从历次工业革命实践历程看，新技术新产品从产生到大规模应用，普遍需要经过一段曲折漫长的过程。依托场景培育和开放，有效发挥政府引导作用，可以大幅缩短推广应用过程，实现技术革命性突破和生产力加速提升。以前瞻性场景建设，引导创新资源集聚，让新技术新产品各就各位、各展其长，在真实场景中真刀真枪历练，将助力老树发新芽、新苗成大树、良种占先机。\n新场景释放内需潜力，让市场活力“奔涌成潮”。当前，外部环境复杂严峻，我们必须坚持扩大内需这个战略基点。场景培育和开放，正逐步成为激发消费活力、带动有效投资、畅通经济循环的新支撑。融合多种新技术新业态新模式的场景，能够更好激发和满足人们多元化、差异化的消费需求，以消费增量带动经济发展，让需求“活”起来；能够拉动各类基础设施建设，加快城市更新与街区改造进程，加速5G网络、算力中心等新型基础设施布局，为有效投资开辟新空间；能够以新需求牵引新供给，让企业看得清市场、摸得准需求，生产更对路，同时以新供给创造新需求，通过新场景带来新产品新服务，让供需两端在场景中双向奔赴，使经济循环更畅通。\n场景培育开放蓬勃兴起、亮点纷呈\n各有关部门和地方瞄准有效需求、结合发展实际，积极探索挖掘场景资源，一批标志性应用场景加速落地。\n场景供给不断增加。场景是体系化的“社会性中试”，既是产业升级的“加速器”，又是消费扩容的“催化剂”，还是制度改革的“试金石”，正在逐渐渗透到经济社会的各个方面。生产领域，场景加快向制造、农业等环节铺开。比如，一批智能工厂、无人车间加快落地，工业机器人与工人协同作业，帮助生产流程持续优化。又如，无人机广泛应用于植保、施肥、吊运等环节，成为田间地头的“新农具”。消费领域，场景不断打开新的需求空间。比如，文旅新场景通过把文化元素深度融入旅游空间，让游客从“看景”变为“入景”。又如，融合趣味互动训练的银发科技健身房、提供老年课程与社交活动的社区文娱中心等新场景，让老年群体不仅老有所养，更能老有所乐、老有所享。\n场景探索各具特色。各地立足实际，在挖掘场景资源、开放场景的过程中，逐步探索出一批可复制可推广的路径。\n一是活动搭台，实战应用。在运动会、博览会等重大活动中集中应用新技术新产品，既能接受实战检验，又能形成示范效应。比如，第十五届全运会开幕式首次采用“高可靠市电+新型储能在线”主供方案，为大型赛事保供电开辟新路。\n二是全域集成，协同验证。把一个区域整体开放出来，让多种先进技术、多种应用形态在同一空间集成验证、协同运转，既能降低单个技术的验证成本，又能催生技术之间的协同效应。比如，安徽合肥骆岗公园拿出12.7平方公里陆域和3公里机场跑道，让无人巴士、无人物流、空中交通在同一园区交叉验证、协同运转，推动一批新技术新产品新场景落地。\n三是赛事牵引，竞技淬炼。通过举办大型赛事，以同场竞技倒逼技术突破，既能加速产品迭代升级，又能带动产业发展壮大。比如，北京举办人形机器人运动会，通过“以赛促产”加快推动机器人技术从基础运动能力向实际应用跨越，从“能跑能跳”向“能干活、能解决问题”进化。\n推动场景培育开放走深走实、落地见效\n场景的“小切口”，连着发展的“大文章”。2025年11月，国务院办公厅印发《关于加快场景培育和开放推动新场景大规模应用的实施意见》，系统部署了场景培育开放的路线图。“十五五”时期，要把场景的“富矿”开发好、把创新的“舞台”搭宽广，让新动能在场景培育开放中竞相迸发、奔涌向前。\n敞开“准入之门”，丰富高质量场景供给。场景培育开放，供给是前提。要加强国家层面场景培育和开放统筹协调。谋划推出一批引领性强、带动面广的重点领域超级场景，促进行业性场景生态开放。分批次组织实施标志性重大应用场景项目，支持建设一批综合性重大场景、行业领域集成式场景、高价值小切口场景，以点带面推进新场景培育和规模化应用。选取一批城市开展场景培育和开放综合试点，体系性推进场景工作，为全国探索可复制可推广经验。推动跨领域跨区域协作，注重场景特色化差异化，因地制宜培育和拓展新场景大规模应用，防止一哄而上、重复建设。\n架好“供需之桥”，推动场景资源高效对接。场景培育开放，不是打造一个封闭、孤立的“展示柜”，而是要积极吸引各类主体共同参与场景建设。政府机关、事业单位、国有企业要强化示范引领，国有企业特别是中央企业要主动开放主业领域场景，吸引民营企业、中小企业和科研院所参与。要建立场景资源市场化配置机制，推动场景机会平等获取和场景资源优化配置，让各类主体公平参与场景培育开放，让场景资源的效用得到最大程度发挥。\n用好“改革法宝”，协同推进制度创新。场景培育和开放不仅需要推动基础设施和平台等“硬建设”，更需要法规、制度、政策等“软创新”。要加强部门协同、健全监管机制、探索尽职免责，试点一批新制度新规则，持续提升市场规则、标准体系、监管手段、政策体系与新业态新领域发展的适配性，在真实应用中厘清各方责任边界、完善安全标准、探索准入规则，把“无章可循”变为“有规可依”。要协同推进准入、场景、要素改革，在可控环境中打通部门壁垒、行业壁垒，优化市场准入环境，提升资源配置效率。要强化技术、数据、人才、资金等要素保障，健全数据、深海、地下空间等新型要素确权和交易规则，充分释放新型要素潜在价值，培育良好创新生态。\n沃土方能育良种，开放方能聚动能。培育开放新场景，其时已至、其势已成。我们要深入贯彻落实党中央决策部署，加快形成央地协同、政企联动、社会参与、多元共建的良好场景创新生态，以新场景大规模应用为“十五五”时期加快培育发展新质生产力、推动经济社会高质量发展提供坚实有力支撑。\n新场景激活发展新动能\n金  轩 《人民日报》（ 2026年10月02日 第 03 版）", "facts": ["2024年12月召开的中央经济工作会议提出，开展新技术新产品新场景大规模应用示范行动", "“十五五”规划纲要中，“场景”一词出现19次，凸显其重要性", "能够拉动各类基础设施建设，加快城市更新与街区改造进程，加速5G网络、算力中心等新型基础设施布局，为有效投资开辟新空间"], "summary": "场景是新技术、新产品、新业态创新性应用的具体情境，一头连着技术、一头连着产业，一头连着研发、一头连着市场。大型矿区里，清洁能源重卡穿行如织；长江航道上，无人机外卖“从天而降”；京杭大运河，新能源船舶驶在零碳航道……一个个具体而生动的场景，把…", "analysis": [{"考点": "科技航天/数字经济", "解读": "科技成就与数字经济是常识判断高频考点，重点记忆成就名称、时间节点、首次/突破等关键信息。", "申论角度": "科技创新素材，可支撑「科技自立自强」「新质生产力」「数字中国」等大作文主题。", "行测角度": "常识判断考成就与意义对应；注意「首次」「突破」等限定词。"}, {"考点": "经济民生", "解读": "民生经济类政策是申论与行测双高频，重点把握政策的目标、举措与成效。", "申论角度": "民生保障、高质量发展主题的核心论据，可提炼「问题—举措—成效」论证链。", "行测角度": "常识判断可能考政策名称、出台背景与具体数字。"}]}, {"date": "2026-10-02", "title": "香港、澳门特区政府举行升旗仪式和国庆酒会庆祝新中国成立77周年", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184124.html", "page": "第03版 要闻", "category": "民生社会", "full_text": "本报香港10月1日电  （记者冯学知）香港特区政府1日举行升旗仪式和国庆酒会，庆祝中华人民共和国成立77周年。\n升旗仪式上午8时在金紫荆广场举行。全国政协副主席梁振英、香港特区行政长官李家超、中央政府驻港联络办主任周霁、驻港国家安全公署署长董经纬、外交部驻港公署特派员崔建春、中国人民解放军驻香港部队政治委员赖如鑫，以及香港社会各界知名人士等出席。\n随着乐队奏响国歌，鲜艳的中华人民共和国国旗和香港特别行政区区旗冉冉升起，嘉宾们行注目礼，唱国歌。\n升旗仪式结束后，观礼嘉宾移步香港会议展览中心出席国庆酒会。李家超在酒会上致辞表示，这是香港首份五年规划公布后迎来的第一个国庆日，别具意义。今天，中国已成为世界制造业第一大国、货物贸易第一大国等，在国际事务中发挥着关键的影响力。香港制定五年规划，不仅是制定一系列政策举措，更是立足“一国两制”独特优势、顺应时代潮流、抓紧国家发展机遇的战略谋划。\n李家超表示，我们必须抓紧机遇，主动融入和服务国家发展大局，令香港发展得更好，让市民分享更多发展红利。“我有信心，只要我们在各自岗位齐心协力，共同发挥力量，香港定必风光无限。”\n本报澳门10月1日电  （记者富子梅）澳门特区政府1日举行升旗仪式和国庆酒会，庆祝中华人民共和国成立77周年。\n全国政协副主席何厚铧，澳门特区行政长官岑浩辉，中央政府驻澳门联络办公室主任郑新聪，澳门特区前任行政长官崔世安、贺一诚，外交部驻澳门特派员公署署理特派员程雷，解放军驻澳部队司令员陈文胜，以及澳门社会各界知名人士等出席。\n升旗仪式8时在金莲花广场举行，治安警察局护旗队及保安范畴仪仗队首次正式以中式队列步操亮相。伴随着国歌，国旗和区旗在金莲花广场冉冉升起。\n国庆酒会9时30分在中国与葡语国家商贸合作服务平台综合体举行。岑浩辉致辞时表示，祖国日新月异的蓬勃发展，始终是澳门最坚强的后盾和最温暖的港湾。特区政府主动、紧密对接国家“十五五”规划，凝聚各界智慧和发展共识，编制实施第三个五年规划。\n岑浩辉说，展望未来，特区政府紧扣“以市民为中心”的精细化管理和“防范化解内外风险挑战”两大立足点，在有效应对风险挑战中，实现可持续发展；在激发市场活力中，提升综合竞争力；在增进民生福祉中，确保居民安居乐业；奋力推动特区各领域工作再上新台阶；在强国建设、民族复兴的伟大征程中展现更大作为，奋力谱写具有澳门特色“一国两制”成功实践的崭新篇章。\n香港、澳门特区政府举行升旗仪式和国庆酒会庆祝新中国成立77周年\n《人民日报》（ 2026年10月02日 第 03 版）", "facts": ["本报香港10月1日电  （记者冯学知）香港特区政府1日举行升旗仪式和国庆酒会，庆祝中华人民共和国成立77周年", "升旗仪式上午8时在金紫荆广场举行", "”\n本报澳门10月1日电  （记者富子梅）澳门特区政府1日举行升旗仪式和国庆酒会，庆祝中华人民共和国成立77周年"], "summary": "本报香港10月1日电  （记者冯学知）香港特区政府1日举行升旗仪式和国庆酒会，庆祝中华人民共和国成立77周年。\n升旗仪式上午8时在金紫荆广场举行。全国政协副主席梁振英、香港特区行政长官李家超、中央政府驻港联络办主任周霁、驻港国家安全公署署长…", "analysis": [{"考点": "经济民生", "解读": "民生经济类政策是申论与行测双高频，重点把握政策的目标、举措与成效。", "申论角度": "民生保障、高质量发展主题的核心论据，可提炼「问题—举措—成效」论证链。", "行测角度": "常识判断可能考政策名称、出台背景与具体数字。"}, {"考点": "国际外交", "解读": "外交外事类时政重点记忆主场外交、多边机制、合作倡议的名称与成果。", "申论角度": "「人类命运共同体」「对外开放」等主题的宏观背景素材。", "行测角度": "常识判断考外交成果与倡议名称对应。"}]}, {"date": "2026-10-02", "title": "射击项目十六金收官  创多个世界纪录", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184125.html", "page": "第03版 要闻", "category": "民生社会", "full_text": "当地时间10月1日，名古屋亚运会迎来开幕后第十二个比赛日，中国体育代表团当日在皮划艇、帆船、攀岩项目上收获4枚金牌。\n攀岩项目当日产生两枚金牌，均被中国队选手获得：张悦彤以85分的成绩获得女子攀石项目金牌，储守宏以4秒71的成绩夺得男子速度赛金牌。\n女子攀石对标洛杉矶奥运会设项，选手们需要挑战4条线路，每条线路如果第一次尝试即登顶可以得到25分，完成4条线路的满分为100分。张悦彤在前三条线路一次过关，在第四条线路获10分，为中国攀岩队摘得本届亚运会首金。\n皮划艇激流回旋男子单人划艇项目，中国队选手张志成以98.09秒的成绩夺冠。帆船项目男子快速艇49人级比赛，中国队组合刘添/温在鼎成功卫冕。\n射击项目当日迎来收官战。中国队在本届亚运会共获16金8银4铜，在多个项目上创造新纪录：王子菲、韩佳予、杜雨宸在女子10米气步枪团体项目打出1904.2环，夺得金牌并打破世界纪录；张常鸿、盛李豪、马思涵以1899.0环的成绩在男子10米气步枪团体项目上夺金并刷新世界纪录；盛李豪/王子菲组合在10米气步枪混合团体项目决赛夺金，并以507.1环的成绩打破世界纪录。在飞碟项目方面，江伊婷在女子双向决赛上35中追平世界纪录，与吕健林在双向混团项目上52中创造新的世界纪录。盛李豪在男子10米气步枪个人项目上打出254.2环，刷新本人保持的亚洲纪录、亚运会纪录。加上与刘宇坤、张常鸿在男子50米步枪三姿团体项目上夺金，盛李豪在本届亚运会共夺得4枚金牌。\n网球赛场，中国队选手张帅和王曦雨会师女单决赛；男双组合姜福民/张天汇获得铜牌，为中国男网时隔16年再获亚运会男双奖牌。张帅以6∶4、6∶2战胜哈萨克斯坦选手，进入决赛；王曦雨首盘3∶6告负，后以6∶3、6∶2逆转对手。中国队提前锁定女单冠亚军，实现亚运会女单六连冠，这也是继雅加达、杭州后第三次在亚运会上包揽女单冠亚军。\n（本报记者范佳元、陈晨曦、孙龙飞、高佶、李硕）\n亚运会中国代表团持续发力\n射击项目十六金收官  创多个世界纪录\n《人民日报》（ 2026年10月02日 第 03 版）", "facts": ["当地时间10月1日，名古屋亚运会迎来开幕后第十二个比赛日，中国体育代表团当日在皮划艇、帆船、攀岩项目上收获4枚金牌", "攀岩项目当日产生两枚金牌，均被中国队选手获得：张悦彤以85分的成绩获得女子攀石项目金牌，储守宏以4秒71的成绩夺得男子速度赛金牌", "女子攀石对标洛杉矶奥运会设项，选手们需要挑战4条线路，每条线路如果第一次尝试即登顶可以得到25分，完成4条线路的满分为100分"], "summary": "当地时间10月1日，名古屋亚运会迎来开幕后第十二个比赛日，中国体育代表团当日在皮划艇、帆船、攀岩项目上收获4枚金牌。\n攀岩项目当日产生两枚金牌，均被中国队选手获得：张悦彤以85分的成绩获得女子攀石项目金牌，储守宏以4秒71的成绩夺得男子速度…", "analysis": [{"考点": "综合时政", "解读": "综合类时政，建议结合具体内容做常识性了解。", "申论角度": "可作背景知识储备，理解国家发展大势。", "行测角度": "常识判断可能以细节题形式考查。"}]}, {"date": "2026-10-02", "title": "一步一步扎实往前走", "source_media": "人民日报", "source_url": "http://paper.people.com.cn/rmrb/pc/content/202610/02/content_30184135.html", "page": "第04版 视觉", "category": "重要会议/讲话", "full_text": "金秋时节山河锦绣，中华儿女喜迎国庆。在庆祝中华人民共和国成立77周年招待会上，习近平总书记指出：“此时此刻，我们为新中国取得的举世瞩目成就无比自豪，对中国式现代化的光明前景充满信心。”\n神州大地上，到处洋溢着浓郁热烈、欢欣鼓舞的节日氛围。\n祝福伟大祖国，激扬奋斗豪情。从天安门广场，到山乡和边陲，再到海外的亚运会赛场，鲜艳的国旗、激昂的国歌让我们心潮澎湃、充满力量，一张张自信的笑脸，一句句深情的祝福，汇聚成奋进新征程、建功新时代的磅礴伟力。\n欢度国庆佳节，焕发文旅活力。人们或奔赴山川名胜，感受自然风光与历史文化魅力；或寻访红色足迹，追忆峥嵘岁月，感悟初心使命；或走向街市公园、餐厅影院，体验热闹氛围，品味人间烟火。多彩的假日生活，彰显经济社会的蓬勃生机。\n共创美好生活，致敬在岗坚守。公安民警巡逻执勤，铁路职工服务旅客，医护人员迎接新生命到来……一个个仍在忙碌的身影，让节日平安祥和，为幸福增色添彩。\n习近平总书记强调：“只要我们坚定信心、锚定目标，一步一步扎实往前走，成功就一定属于伟大的中国共产党、伟大的中国人民、伟大的中华人民共和国！”\n爱我中华，团结奋进；扎实前行，成功可期！\n一步一步扎实往前走\n张雪妍 《人民日报》（ 2026年10月02日 第 04 版）", "facts": ["在庆祝中华人民共和国成立77周年招待会上，习近平总书记指出：“此时此刻，我们为新中国取得的举世瞩目成就无比自豪，对中国式现代化的光明前景充满信心", "一步一步扎实往前走\n张雪妍 《人民日报》（ 2026年10月02日 第 04 版）"], "summary": "金秋时节山河锦绣，中华儿女喜迎国庆。在庆祝中华人民共和国成立77周年招待会上，习近平总书记指出：“此时此刻，我们为新中国取得的举世瞩目成就无比自豪，对中国式现代化的光明前景充满信心。”\n神州大地上，到处洋溢着浓郁热烈、欢欣鼓舞的节日氛围。\n…", "analysis": [{"考点": "重要会议/领导人讲话", "解读": "时政高频考点，重点记忆讲话中的核心论断、重大判断与标志性表述，常以常识判断或申论材料背景形式出现。", "申论角度": "讲话精神可作为申论大作文的立意来源与论据引用，如「中国式现代化」「以人民为中心」等主题。", "行测角度": "常识判断常考讲话中的新提法、新表述；政治理论模块可能考查讲话出处与核心要义。"}, {"考点": "经济民生", "解读": "民生经济类政策是申论与行测双高频，重点把握政策的目标、举措与成效。", "申论角度": "民生保障、高质量发展主题的核心论据，可提炼「问题—举措—成效」论证链。", "行测角度": "常识判断可能考政策名称、出台背景与具体数字。"}]}]}, "essay": {"meta": {"title": "申论专项库（原文 + 详细解析）", "updated_at": "2026-10-02", "update_cycle": "weekly", "rule": "真题主题仅记录公开可查的题目要点与考情；素材提供权威评论全文（可公开获取），解析含结构分析/论点梳理/金句/可借鉴点"}, "exam_info": {"title": "2026 国考申论考情", "summary": "全国报名 354 万人。三类试卷均为 5 题（4 小题 + 1 大作文）。副省级重综合分析与解决问题，材料聚焦顶层设计与战略；地市级重贯彻执行，材料围绕基层治理民生；行政执法类重依法办事与公共服务，法律题占比高。", "detail": "申论平均分：副省级约 55-65 分，地市与执法类约 60-70 分。考试时长 180 分钟（14:00-17:00）。备考核心：多读权威评论积累素材 + 多写多练 + 规范格式。", "source_media": "中公教育/上岸鸭公考", "source_url": "https://gd.offcn.com/zg/gknr"}, "real_topics": [{"year": 2026, "paper": "副省级", "theme": "运用合适的章法处理好不同因素之间的关系，是促进事物长远发展的关键", "domain": "社会+生态+经济", "question_types": "概括+分析+贯彻+对策+大作文", "key_question": "评价分析题「对制造企业发展中该不该丢掉传统工艺问题谈看法」——国考继 2015 年后再考评价分析题", "analysis": "本卷主题落到「处理关系」上，属于典型的辩证思维题。答题关键在于：①先明确「章法」指的是统筹协调的方法论；②识别材料中呈现的多对关系（传统与现代、发展与保护、局部与全局等）；③用「既要…又要…更要…」的递进结构展开。评价分析题要遵循「亮明观点→辩证分析→给出建议」三步，观点务必先表态再论证，不能和稀泥。", "keywords": ["统筹", "辩证关系", "长远发展", "评价分析"], "source_media": "中公教育", "source_url": "https://gd.offcn.com/zg/gknr", "sample_essay": {"title": "善用章法，行稳致远（示范范文）", "domain": "辩证关系类·大作文", "full_text": "【示范范文 · 非官方答案，仅供学习参考】\n\n\n善用章法，行稳致远\n\n　　事物发展从来不是孤军突进，而是多重因素相互交织、彼此制约的复杂过程。经济发展与生态保护、传统工艺与现代制造、局部利益与全局谋划……这些看似对立的关系，实则需要用科学的章法去统筹协调。唯有善用章法，才能化对立为统一，实现长远发展。\n\n　　善用章法，首要在统筹兼顾、系统谋划。处理关系，不能顾此失彼、非此即彼。既要推动经济高质量发展，又要守住绿水青山；既要拥抱现代制造的效率，又要珍视传统工艺的温度。正如乡村振兴中产业兴旺与生态宜居并重，城市建设中旧城改造与文脉传承同行，唯有把各方面因素放在一盘棋中考量，才能实现整体最优。\n\n　　善用章法，关键在辩证施策、精准发力。关系处理没有放之四海而皆准的模板，必须具体问题具体分析。该扬弃的扬弃，该继承的继承，该创新的创新。对传统工艺，不是简单丢弃，而是创造性转化、创新性发展；对发展速度，不是一味求快，而是稳中求进、质量优先。\n\n　　善用章法，根本在久久为功、善作善成。关系是动态变化的，章法也需要与时俱进。唯有以钉钉子精神一锤接着一锤敲，以功成不必在我的境界和功成必定有我的担当，才能在不断调适中把握规律、行稳致远。\n\n　　明者因时而变，知者随事而制。新时代新征程上，只要我们善于运用科学的章法统筹协调各种关系，就一定能化危为机、转劣为优，书写事业发展的崭新篇章。", "structure": "开头（亮明中心论点：统筹协调是长远发展关键）→ 分论点一（统筹兼顾、系统谋划）→ 分论点二（辩证施策、精准发力）→ 分论点三（久久为功、善作善成）→ 结尾（升华呼应，引用古文）。采用经典「总分总 + 三个并列分论点」结构。", "points": ["分论点一：善用章法，首要在统筹兼顾、系统谋划", "分论点二：善用章法，关键在辩证施策、精准发力", "分论点三：善用章法，根本在久久为功、善作善成"], "golden_sentences": ["唯有善用章法，才能化对立为统一，实现长远发展。", "明者因时而变，知者随事而制。", "以钉钉子精神一锤接着一锤敲，以功成不必在我的境界和功成必定有我的担当。"], "usage": "学习重点：①「既要…又要…」的辩证句式贯穿全文；②三个分论点均以「首要在/关键在/根本在」递进，逻辑清晰；③结尾引用古文升华。可借鉴其「统筹关系类」大作文的通用框架，替换主题词即可复用。"}}, {"year": 2026, "paper": "地市级", "theme": "发展的路径不是单一的", "domain": "经济+生态", "question_types": "概括+概括+贯彻+分析+大作文", "key_question": "侧重贯彻执行能力，材料围绕基层具体工作展开", "analysis": "主题核心是「路径多元、因地制宜」。答题要把握：①反对「一刀切」的发展思路；②强调根据本地实际选择差异化路径；③贯彻执行题（公文写作）比重高，需熟练掌握简报、方案、意见等文种格式。大作文可从「适合的才是最好的」切入，用基层案例论证。", "keywords": ["因地制宜", "多元路径", "基层治理", "贯彻执行"], "source_media": "中公教育", "source_url": "https://gd.offcn.com/zg/gknr", "sample_essay": {"title": "因地制宜，走出适合自己的发展路（示范范文）", "domain": "发展理念类·大作文", "full_text": "【示范范文 · 非官方答案，仅供学习参考】\n\n\n因地制宜，走出适合自己的发展路\n\n　　橘生淮南则为橘，生于淮北则为枳。一方水土养一方人，一方条件育一方产业。发展的路径从来不是单一的，唯有立足本地实际、发挥比较优势，才能走出适合自己的康庄大道。\n\n　　发展路径的多元，源于禀赋的差异。有的地方山水秀美，宜发展生态旅游；有的地方工业基础雄厚，宜做强制造链条；有的地方人才集聚，宜培育数字经济。倘若不顾条件差异，一味追求统一模式，无异于削足适履。\n\n　　走出适合自己的路，关键在因地制宜、分类施策。要深入调研摸清家底，找准自身优势所在；要科学规划锚定方向，避免盲目跟风；要久久为功持续用力，防止朝令夕改。从浙江的千万工程到福建的三明医改，无不是立足本地实际的生动实践。\n\n　　走出适合自己的路，还要善于扬长补短、协同共进。没有哪个地方样样都强，关键在于把长板拉长、把短板补齐，在差异化竞争中形成错位发展格局。\n\n　　不谋全局者，不足谋一域。唯有尊重规律、因地制宜，让每一个地方都找到适合自己的发展路径，才能汇聚起高质量发展的磅礴力量。", "structure": "开头（古文引入 + 中心论点）→ 分论点一（路径多元源于禀赋差异）→ 分论点二（因地制宜、分类施策）→ 分论点三（扬长补短、协同共进）→ 结尾（升华）。", "points": ["分论点一：发展路径的多元，源于禀赋的差异", "分论点二：走出适合自己的路，关键在因地制宜、分类施策", "分论点三：走出适合自己的路，还要善于扬长补短、协同共进"], "golden_sentences": ["橘生淮南则为橘，生于淮北则为枳。", "把长板拉长、把短板补齐，在差异化竞争中形成错位发展格局。", "不谋全局者，不足谋一域。"], "usage": "学习重点：①古文开篇点题；②「因地制宜」类主题的标准框架；③用「千万工程」「三明医改」等案例增强说服力。"}}, {"year": 2026, "paper": "行政执法类", "theme": "坚持「目标导向」（明确目标向前跑）", "domain": "政治+社会", "question_types": "概括+分析+贯彻+贯彻+大作文", "key_question": "两道贯彻执行题，公文写作比重大", "analysis": "主题落在「目标导向」，契合执法工作的价值追求。答题要点：①目标是执法为民、维护公平正义；②两道公文题意味着格式分占比高，务必记牢通知、通报、公开信等格式；③大作文可围绕「心中有目标，脚下有力量」展开，结合执法案例论证目标对行动的牵引作用。", "keywords": ["目标导向", "执法为民", "公文写作", "公共服务"], "source_media": "中公教育", "source_url": "https://gd.offcn.com/zg/gknr", "sample_essay": {"title": "心中有目标，脚下有力量（示范范文）", "domain": "行政执法类·大作文", "full_text": "【示范范文 · 非官方答案，仅供学习参考】\n\n\n心中有目标，脚下有力量\n\n　　目标是前行的灯塔，是奋斗的方向。对于行政执法工作而言，坚持目标导向，就是要始终牢记执法为民的初心，把维护公平正义作为价值追求，朝着既定目标坚定前行。\n\n　　坚持目标导向，首先要校准方向。执法的根本目标是让人民群众在每一个执法决定中感受到公平正义。离开了这个根本目标，执法就会迷失方向，甚至沦为逐利的工具。唯有始终以人民满意为标尺，才能确保执法权始终运行在正确的轨道上。\n\n　　坚持目标导向，关键在把目标转化为行动。目标不是挂在墙上的口号，而是落到实处的担当。要细化目标为一项项具体任务，明确时间表、路线图，以抓铁有痕、踏石留印的劲头抓落实，让目标从蓝图变为现实。\n\n　　坚持目标导向，还要在实干中校准目标。执法实践中会遇到各种新情况新问题，这就要求我们在奔跑中不断调整步伐，既要有力度维护法律权威，又要有温度体现人文关怀，做到刚柔并济、法理情相融。\n\n　　征途漫漫，惟有奋斗。广大执法者只要心中有目标、脚下有力量，就一定能跑出为民服务的好成绩，赢得人民群众的信任与拥护。", "structure": "开头（目标的意义 + 执法场景切入）→ 分论点一（校准方向）→ 分论点二（转化为行动）→ 分论点三（实干中校准）→ 结尾（升华）。", "points": ["分论点一：坚持目标导向，首先要校准方向", "分论点二：坚持目标导向，关键在把目标转化为行动", "分论点三：坚持目标导向，还要在实干中校准目标"], "golden_sentences": ["目标是前行的灯塔，是奋斗的方向。", "让人民群众在每一个执法决定中感受到公平正义。", "既要有力度维护法律权威，又要有温度体现人文关怀，做到刚柔并济、法理情相融。"], "usage": "学习重点：①行政执法类大作文的固定抓手（执法为民、公平正义、刚柔并济）；②「目标导向」的递进式分论点；③结尾引用「征途漫漫惟有奋斗」官方表述。"}}, {"year": 2025, "paper": "副省级", "theme": "发挥人的主观能动性，变事物劣势为优势", "domain": "文化+经济", "question_types": "概括+分析+贯彻+对策+大作文", "key_question": "哲学思辨色彩浓", "analysis": "哲学层面命题，考查「主观能动性与客观规律」的辩证关系。答题核心：①劣势不是绝对的，可通过发挥主观能动性转化；②但转化必须以尊重客观规律为前提；③对策题要落到「怎么转」的具体举措。可引「化危为机」「转劣为优」的典型案例。", "keywords": ["主观能动性", "劣势转化", "哲学思辨", "化危为机"], "source_media": "中公教育", "source_url": "https://gd.offcn.com/zg/gknr", "sample_essay": {"title": "转劣为优，主动作为（示范范文）", "domain": "哲学思辨类·大作文", "full_text": "【示范范文 · 非官方答案，仅供学习参考】\n\n\n转劣为优，主动作为\n\n　　世间万物，劣势与优势并非一成不变，而是可以相互转化的。关键在于能否发挥人的主观能动性，在尊重客观规律的前提下主动作为、化危为机。\n\n　　劣势转化为优势，前提是正视劣势、尊重规律。劣势是客观存在的，不能回避、不能虚饰。唯有实事求是地认清自身不足，深入研究客观规律，才能找准转化的着力点。脱离规律的主观蛮干，只会适得其反。\n\n　　劣势转化为优势，核心是发挥主观能动性、主动求变。从塞罕坝三代人把荒漠变林海，到贵州大发渠在绝壁上凿出生命之渠，无不是靠着人的顽强意志和不懈奋斗，把看似不可能变成了可能。\n\n　　劣势转化为优势，落脚点是把转化成果落到实处。转化不是一劳永逸，需要持续巩固、久久为功，让优势真正成为发展的新动能。\n\n　　穷则变，变则通，通则久。面对劣势，与其怨天尤人，不如主动作为。只要我们善于发挥主观能动性，就一定能转劣为优、转危为机，在攻坚克难中开辟新天地。", "structure": "开头（辩证点题）→ 分论点一（正视劣势、尊重规律）→ 分论点二（发挥主观能动性、主动求变）→ 分论点三（落到实处）→ 结尾（古文升华）。", "points": ["分论点一：劣势转化为优势，前提是正视劣势、尊重规律", "分论点二：劣势转化为优势，核心是发挥主观能动性、主动求变", "分论点三：劣势转化为优势，落脚点是把转化成果落到实处"], "golden_sentences": ["劣势与优势并非一成不变，而是可以相互转化的。", "穷则变，变则通，通则久。", "与其怨天尤人，不如主动作为。"], "usage": "学习重点：①哲学思辨题的「规律 + 主观能动性」双线论证；②用塞罕坝、大发渠等经典案例；③「前提/核心/落脚点」递进式分论点模板。"}}, {"year": 2025, "paper": "地市级", "theme": "事物在互补中不断发展", "domain": "生态+经济+文化", "question_types": "概括+概括+对策+贯彻+大作文", "key_question": "侧重互补共赢的辩证关系", "analysis": "主题强调「互补」「共赢」，与城乡互补、区域协同、要素流动等热点呼应。答题要点：①识别材料中的互补主体（城与乡、产与销、线上与线下等）；②概括各自的优势与短板；③对策落到「优势互补、错位发展」。", "keywords": ["互补共赢", "协同发展", "区域协调"], "source_media": "中公教育", "source_url": "https://gd.offcn.com/zg/gknr", "sample_essay": {"title": "互补共赢，携手前行（示范范文）", "domain": "辩证关系类·大作文", "full_text": "【示范范文 · 非官方答案，仅供学习参考】\n\n\n互补共赢，携手前行\n\n　　城乡互补、产需对接、线上线下融合……世间万物，各有所长、各有所短。事物正是在取长补短、互补共赢中不断向前发展的。\n\n　　互补的前提是认清差异。城市有资金技术人才，乡村有生态资源空间；东部有产业基础，西部有资源禀赋。唯有正视差异、找准互补点，才能实现优势叠加、错位发展。\n\n　　互补的关键是搭建桥梁。差异不会自动转化为互补，需要靠制度机制、平台载体去连接。城乡融合要打通要素流动的堵点，区域协同要健全利益联结机制，让各自的优势在对接中充分释放。\n\n　　互补的归宿是共同发展。互补不是简单的此消彼长，而是共生共荣。要在互补中实现整体提升，让发展成果更多更公平惠及各方。\n\n　　和羹之美，在于合异。唯有坚持互补共赢的理念，推动各类主体在合作中取长补短、在融合中共同成长，才能汇聚起高质量发展的强大合力。", "structure": "开头（点题）→ 分论点一（认清差异）→ 分论点二（搭建桥梁）→ 分论点三（共同发展）→ 结尾（升华）。", "points": ["分论点一：互补的前提是认清差异", "分论点二：互补的关键是搭建桥梁", "分论点三：互补的归宿是共同发展"], "golden_sentences": ["事物正是在取长补短、互补共赢中不断向前发展的。", "和羹之美，在于合异。", "在合作中取长补短、在融合中共同成长。"], "usage": "学习重点：①「互补共赢」主题的「前提/关键/归宿」三段式；②城乡、区域、产需等互补主体的多角度论证。"}}, {"year": 2025, "paper": "行政执法类", "theme": "以人民为中心", "domain": "政治+社会", "question_types": "概括+概括+贯彻+贯彻+大作文", "key_question": "执法卷母题，反复考查", "analysis": "「以人民为中心」是执法类试卷的永恒母题。答题要点：①执法理念从「管理」转向「服务」；②材料多体现柔性执法、温度执法案例；③大作文必备分论点：执法有力度、更有温度；以人民满意为标尺。", "keywords": ["以人民为中心", "柔性执法", "执法为民"], "source_media": "中公教育", "source_url": "https://gd.offcn.com/zg/gknr", "sample_essay": {"title": "把人民放在心中最高位置（示范范文）", "domain": "行政执法类·大作文", "full_text": "【示范范文 · 非官方答案，仅供学习参考】\n\n\n把人民放在心中最高位置\n\n　　江山就是人民，人民就是江山。坚持以人民为中心，是执法工作的根本立场，也是衡量执法成效的根本标尺。\n\n　　以人民为中心，要在执法理念上实现从管理到服务的转变。执法不是冷冰冰的管控，而是暖人心的服务。要坚持柔性执法、温度执法，把群众的小事当作执法的大事来办。\n\n　　以人民为中心，要在执法实践中回应群众关切。群众最关心的就是执法最该解决的。要聚焦群众急难愁盼，从群众最不满意的地方改起，用实实在在的执法成效增强群众的获得感。\n\n　　以人民为中心，要在执法监督中接受群众评判。执法成效好不好，群众最有发言权。要畅通群众监督渠道，让执法权在阳光下运行，以人民满意为最高标准。\n\n　　民生无小事，枝叶总关情。唯有始终把人民放在心中最高位置，执法工作才能赢得民心、凝聚力量，为推进法治建设注入不竭动力。", "structure": "开头（官方金句点题）→ 分论点一（理念转变）→ 分论点二（回应关切）→ 分论点三（接受评判）→ 结尾（升华）。", "points": ["分论点一：以人民为中心，要在执法理念上实现从管理到服务的转变", "分论点二：以人民为中心，要在执法实践中回应群众关切", "分论点三：以人民为中心，要在执法监督中接受群众评判"], "golden_sentences": ["江山就是人民，人民就是江山。", "把群众的小事当作执法的大事来办。", "民生无小事，枝叶总关情。"], "usage": "学习重点：①「以人民为中心」万能母题的执法卷写法；②柔性执法、温度执法的关键词；③「理念/实践/监督」三层次。"}}, {"year": 2024, "paper": "副省级", "theme": "旧事物的新价值", "domain": "文化+经济", "question_types": "概括+分析+贯彻+对策+大作文", "key_question": "传统与现代的价值转化", "analysis": "主题考查「传统资源的现代转化」。答题核心：①旧事物不等于落后，蕴含着被忽视的价值；②关键是创造性转化、创新性发展；③可联系非遗活化、老字号复兴、城市更新等案例。", "keywords": ["创造性转化", "传统价值", "守正创新"], "source_media": "中公教育", "source_url": "https://gd.offcn.com/zg/gknr", "sample_essay": {"title": "激活旧事物的新价值（示范范文）", "domain": "文化传承类·大作文", "full_text": "【示范范文 · 非官方答案，仅供学习参考】\n\n\n激活旧事物的新价值\n\n　　旧事物并非落后的代名词，其中往往蕴含着被时代遮蔽的宝贵价值。关键在于以创造性转化、创新性发展，让旧事物在新时代焕发新光彩。\n\n　　激活旧价值，首先要转变观念、重新发现。老字号里藏着匠心，古建筑里承载着乡愁，传统技艺里凝结着智慧。唯有打破旧的偏见，用新的眼光重新审视，才能发现被忽视的价值。\n\n　　激活旧价值，核心是创造性转化、创新性发展。故宫文创让六百年故宫走进生活，非遗活化让古老技艺拥抱市场。传统不是拿来供奉的，而是拿来创新的，要在守正中创新、在创新中传承。\n\n　　激活旧价值，落脚点是让价值惠及当下。旧事物的新价值，最终要服务于人民的美好生活，成为经济社会发展的新动能。\n\n　　周虽旧邦，其命维新。唯有以创新激活传统、以传承滋养创新，才能让旧事物焕发新生，让中华优秀传统文化在新时代绽放更加璀璨的光芒。", "structure": "开头（点题）→ 分论点一（转变观念、重新发现）→ 分论点二（创造性转化、创新性发展）→ 分论点三（惠及当下）→ 结尾（古文升华）。", "points": ["分论点一：激活旧价值，首先要转变观念、重新发现", "分论点二：激活旧价值，核心是创造性转化、创新性发展", "分论点三：激活旧价值，落脚点是让价值惠及当下"], "golden_sentences": ["旧事物并非落后的代名词，其中往往蕴含着被时代遮蔽的宝贵价值。", "周虽旧邦，其命维新。", "以创新激活传统、以传承滋养创新。"], "usage": "学习重点：①「创造性转化、创新性发展」是文化类主题的核心表述；②故宫文创、非遗活化等经典案例；③「守正创新」的辩证表达。"}}, {"year": 2024, "paper": "地市级", "theme": "打磨修补", "domain": "文化+社会", "question_types": "概括+概括+贯彻+对策+大作文", "key_question": "以小见大的工匠主题", "analysis": "「打磨修补」是工匠精神的具象化表达。答题要点：①从小事着手，精益求精；②修补不仅是修复物件，更是修复关系、完善制度；③可引申到社会治理的「绣花功夫」。", "keywords": ["工匠精神", "绣花功夫", "精益求精"], "source_media": "中公教育", "source_url": "https://gd.offcn.com/zg/gknr", "sample_essay": {"title": "以打磨之功，成精益之效（示范范文）", "domain": "工匠精神类·大作文", "full_text": "【示范范文 · 非官方答案，仅供学习参考】\n\n\n以打磨之功，成精益之效\n\n　　打磨修补，看似微小，实则蕴含着精益求精的工匠精神。无论是对一件器物的修复，还是对一项制度的完善，都需要以打磨之功，成精益之效。\n\n　　打磨修补，是一种精益求精的态度。天下大事，必作于细。真正的工匠，往往在一刀一刻、一补一修中倾注心血，把平凡做到极致。这种态度，是成就事业的根本。\n\n　　打磨修补，是一种久久为功的韧劲。修复不是一蹴而就，需要耐心细致、反复打磨。正如绣花功夫，一针一线皆是匠心，唯有沉得下心、耐得住寂寞，才能把事情做到位。\n\n　　打磨修补，更是一种由小及大的智慧。修补的不仅是器物，更是关系、是制度、是社会治理的末梢。以小见大、由点及面，方能以绣花功夫织就善治之网。\n\n　　天下大事，必作于细。唯有弘扬工匠精神，以打磨之功追求精益之效，才能在平凡岗位上创造不平凡的业绩，为社会进步积蓄坚实力量。", "structure": "开头（点题）→ 分论点一（精益求精的态度）→ 分论点二（久久为功的韧劲）→ 分论点三（由小及大的智慧）→ 结尾（升华）。", "points": ["分论点一：打磨修补，是一种精益求精的态度", "分论点二：打磨修补，是一种久久为功的韧劲", "分论点三：打磨修补，更是一种由小及大的智慧"], "golden_sentences": ["天下大事，必作于细。", "一针一线皆是匠心，唯有沉得下心、耐得住寂寞。", "以绣花功夫织就善治之网。"], "usage": "学习重点：①工匠精神主题的「态度/韧劲/智慧」三层次；②「绣花功夫」向社会治理的引申；③以小见大的立意。"}}, {"year": 2024, "paper": "行政执法类", "theme": "执法的「力、理、利」", "domain": "政治+文化+社会", "question_types": "概括+概括+贯彻+贯彻+大作文", "key_question": "执法卷母题级主题", "analysis": "「力、理、利」是对执法工作的三重概括：力=执法的刚性与力度，理=执法的法理与情理，利=执法的惠民与利民。答题要点：①三者统一于执法为民；②既要有力度维护法律权威，又要有温度体现人文关怀；③大作文可用「刚柔并济」为纲。", "keywords": ["执法力度", "法理情理", "刚柔并济"], "source_media": "中公教育", "source_url": "https://gd.offcn.com/zg/gknr", "sample_essay": {"title": "刚柔并济，执法为民（示范范文）", "domain": "行政执法类·大作文", "full_text": "【示范范文 · 非官方答案，仅供学习参考】\n\n\n刚柔并济，执法为民\n\n　　执法的「力」，是维护法律权威的刚性与力度；执法的「理」，是蕴含其中的法理与情理；执法的「利」，是惠及人民的利民与便民。三者统一于执法为民的根本宗旨，构成新时代执法工作的完整逻辑。\n\n　　以「力」树权威。法律的生命力在于实施，法律的权威也在于实施。对扰乱市场秩序、侵害群众利益的违法行为，必须依法严厉打击，让违法者付出应有的代价，以刚性执法维护公平正义。\n\n　　以「理」显温度。执法既要有力度，更要有温度。要坚持处罚与教育相结合，讲清法理、讲透情理，让群众在每一个执法行为中既感受到法律的威严，又感受到执法的善意。\n\n　　以「利」惠民生。执法的最终目的是增进人民福祉。要坚持执法为民、服务为先，通过柔性执法、便民服务，让执法成果更多惠及人民群众。\n\n　　法安天下，德润人心。唯有坚持刚柔并济、法理情相融，把执法力度、温度、惠民度统一起来，才能让法治的暖阳照亮每一个角落。", "structure": "开头（拆解力理利三层含义）→ 分论点一（以力树权威）→ 分论点二（以理显温度）→ 分论点三（以利惠民生）→ 结尾（升华）。", "points": ["分论点一：以「力」树权威", "分论点二：以「理」显温度", "分论点三：以「利」惠民生"], "golden_sentences": ["法律的生命力在于实施，法律的权威也在于实施。", "执法既要有力度，更要有温度。", "法安天下，德润人心。"], "usage": "学习重点：①执法卷「力理利」母题的标准拆解；②「力度/温度/惠民度」三统一；③刚柔并济、法理情相融的核心表述。"}}], "materials": [{"title": "迈步新征程，我们自信而笃行", "date": "2026-10-01", "type": "权威评论", "gist": "围绕国庆 77 周年招待会讲话，以「自信」与「笃行」二元结构展开：自信源于两大奇迹与制度优势，笃行落在稳中求进、贯彻新发展理念。", "full_text": "（原文要点）文章以「自信」与「笃行」两个关键词统领全文。前半部分梳理发展成就，论证自信的底气来源——经济快速发展与社会长期稳定两大奇迹、集中力量办大事的制度优势；后半部分落到行动层面，强调要坚定信心、锚定目标、笃行实干，把制度优势转化为发展效能。", "structure": "成就盘点 → 制度归因 → 行动号召（三段式，是标准的大作文开头范式）", "points": ["自信源于两大奇迹与制度优势", "科学制定和接续实施五年规划是重要政治优势", "笃行落在稳中求进、贯彻新发展理念"], "golden_sentences": ["科学制定和接续实施五年规划，是我们党治国理政一条重要经验，也是中国特色社会主义一个重要政治优势。"], "usage": "大作文「制度自信」「规划引领发展」「中国之治」主题的顶级论据。「自信与笃行」的二元结构可直接借用为论证框架。", "source_media": "人民日报", "source_url": "https://data.people.com.cn/rmrb/pd.html"}, {"title": "加强普惠性、基础性、兜底性民生建设", "date": "2026-10-01", "type": "重要文章", "gist": "系统阐述   function uploadOne(file){

    return new Promise(function(res,rej){
      var r=new FileReader();
      r.onload=function(){ res(String(r.result).split(',')[1]||''); };
      r.onerror=function(){ res(null); };
      r.readAsDataURL(file);
    }).then(function(b64){

      return state.db.uploadImage({data:b64,contentType:file.type,fileName:file.name}).then(function(r){

  /* ==================== 花园成长计算（每花一朵，顺序推进） ==================== */
  /* 累计学习时长（小时）：打卡表时长 + 做题记录折算（每题约0.5分钟） */
  function totalHours(){
    /* 只累计「真实打卡时长」：
       - checkin 学习时长（真实打卡）
       - study 有实际用时分钟的记录（手填/打卡带入）
       - 历史基线（类型=历史基线）只有题量没有时长 → 不再按 0.5min/题 虚估 */
    var h=0;
    state.checkin.forEach(function(c){ h+=num(c['学习时长'])||0; });
    state.study.forEach(function(s){
      var mins=num(s['用时分钟'])||0;
      if(mins>0){ h+=mins/60; }
      // 基线记录（用时0、只有题量）不计入时长——题量只参与正确率统计
    });
    return h;
  }

  /* 核心：根据累计时长，计算每一朵花的成长状态。
     返回数组，每项：{key, variety, name, type, color, stage(0种子/1萌芽/2开花), stageProgress(0~1), hoursLeft(还差多少h到下一阶段/开花), bloom}
     只有「已开始成长」的花才出现在列表里（第0朵从0h就开始，第1朵从16h开始……）。 */
  function flowerProgress(h){
    h=(h==null)?totalHours():h;
    var arr=[];
    for(var i=0;i<VAR_ORDER.length;i++){
      var k=VAR_ORDER[i];
      var v=VARIETIES[k];
      var start=i*FLOWER_TOTAL_HOURS;   // 第 i 朵花从 start 小时开始成长
      if(h<=start) break;              // 还没轮到这朵
      var local=h-start;               // 这朵花自己的累计时长（0~16）
      var stage, stageProgress, hoursLeft, done=false;
      if(local>=FLOWER_TOTAL_HOURS){
        stage=STAGE_BLOOM; stageProgress=1; hoursLeft=0; done=true;  // 已开花
      }else if(local>=STAGE_HOURS[0]+STAGE_HOURS[1]){
        // 萌芽期已完成，正在开花期
        stage=STAGE_BLOOM;
        var remain=FLOWER_TOTAL_HOURS-local;
        hoursLeft=remain;
        stageProgress=Math.max(0,Math.min(1,(local-(STAGE_HOURS[0]+STAGE_HOURS[1]))/STAGE_HOURS[2]));
      }else if(local>=STAGE_HOURS[0]){
        // 种子期已完成，正在萌芽期
        stage=STAGE_SPROUT;
        hoursLeft=(STAGE_HOURS[0]+STAGE_HOURS[1])-local;
        stageProgress=Math.max(0,Math.min(1,(local-STAGE_HOURS[0])/STAGE_HOURS[1]));
      }else{
        // 种子期进行中
        stage=STAGE_SEED;
        hoursLeft=STAGE_HOURS[0]-local;
        stageProgress=Math.max(0,Math.min(1,local/STAGE_HOURS[0]));
      }
      arr.push({key:k, variety:k, name:v.name, type:v.type, color:v.color, petal:v.petal, inner:v.inner, center:v.center, stroke:v.stroke,
                stage:stage, stageProgress:stageProgress, hoursLeft:Math.round(hoursLeft*10)/10, done:done, bloom:v.bloom, idx:i});
    }
    return arr;
  }

  /* 已完全开花的花朵数 */
  function totalFlowers(){
    var fp=flowerProgress();
    var n=0;
    fp.forEach(function(f){ if(f.done) n++; });
    return n;
  }

  /* 已解锁（已开始成长）的品种列表 */
  function unlockedVarieties(h){
    return flowerProgress(h).map(function(f){ return f.key; });
  }

  /* 下一朵未开始的花（鼓励提示用）；全开完返回 null */
  function nextUnlock(h){
    h=(h==null)?totalHours():h;
    var n=Math.floor(h/FLOWER_TOTAL_HOURS);  // 已完整开出的花数
    if(n>=VAR_ORDER.length) return null;
    return VARIETIES[VAR_ORDER[n]];          // 正在成长中的这一朵
  }

  /* 当前正在成长的那朵花（未完成的一朵） */
  function currentGrowingFlower(h){
    h=(h==null)?totalHours():h;
    var fp=flowerProgress(h);
    for(var i=0;i<fp.length;i++){ if(!fp[i].done) return fp[i]; }
    return null;
  }
  /* 连续打卡天数 */
  function streakDays(){
    var days={};
    state.checkin.forEach(function(c){ var d=String(c['日期']||'').slice(0,10); if(d) days[d]=1; });
    var s=0, d=new Date();
    var first=true; // 今天还没打卡时，允许从昨天起算（不断签）
    while(true){
      var key=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
      if(days[key]){ s++; d.setDate(d.getDate()-1); first=false; }
      else if(first && key===todayStr()){ d.setDate(d.getDate()-1); first=false; }
      else break;
    }
    return s;
  }
  function checkedToday(){
    var t=todayStr();
    return state.checkin.some(function(c){ return String(c['日期']||'').slice(0,10)===t; });
  }

  /* ==================== 今日学习统计（来自打卡/学习记录） ==================== */
  function todayQuizStats(){
    var t=todayStr(), q=0, w=0;
    state.study.forEach(function(s){
      if(String(s['日期']||'').slice(0,10)===t){ q+=num(s['题量'])||0; w+=num(s['错题数'])||0; }
    });
    return {q:q,w:w,acc:q>0?Math.round((q-w)/q*100):null};
  }
  function todaySunValue(){
    // 阳光值 = 今日学习时长（小时）× 10（打卡是主要数据来源）
    var t=todayStr(), h=0;
    state.checkin.forEach(function(c){ if(String(c['日期']||'').slice(0,10)===t) h+=num(c['学习时长'])||0; });
    if(h===0){
      state.study.forEach(function(s){ if(String(s['日期']||'').slice(0,10)===t) h+=(num(s['用时分钟'])||0)/60; });
    }
    return Math.round(h*10);
  }
