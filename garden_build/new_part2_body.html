<body>
<!-- 顶部导航（非首页显示返回键） -->
<div class="topbar hidden" id="topbar">
  <div class="back" id="btn-back" data-ic="back"></div>
  <div class="tt" id="topbar-title">上岸花园</div><!--gardenName-->
  <div class="sp"></div>
  <div class="back" id="btn-settings" style="transform:rotate(0);font-size:18px" title="设置">⚙️</div>
</div>

<!-- ==================== 首页 ==================== -->
<div class="page on" id="page-home">
  <div style="text-align:center;padding:10px 0 6px;position:relative">
    <a href="javascript:void(0)" id="home-settings" title="设置" style="position:absolute;right:2px;top:4px;width:38px;height:38px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:17px;text-decoration:none">⚙️</a>
    <div style="font-size:15px;font-weight:700;letter-spacing:1px" id="brand-name">🌷 上岸花园</div>
    <div style="font-size:12px;color:var(--ink3);margin-top:3px"><span id="home-whisper">每一天，都在靠近上岸</span></div>
  </div>

  <!-- KPI 四卡 -->
  <div class="kpis">
    <div class="kpi c-rose"><div class="v" id="kpi-sk">—</div><div class="l">距省考</div></div>
    <div class="kpi c-gold"><div class="v" id="kpi-gk">—</div><div class="l">距国考</div></div>
    <div class="kpi c-green"><div class="v" id="kpi-sun">0</div><div class="l">累计打卡(h)</div></div>
    <div class="kpi c-red"><div class="v" id="kpi-streak">0</div><div class="l">连续打卡</div></div>
  </div>

  <!-- 花园总览（重点：分块花园） -->
  <div class="card" style="padding:0;overflow:hidden">
    <div class="garden-mini" id="garden-mini">
      <a class="g-link" data-nav="garden-help">说明 →</a>
      <div id="garden-mini-svg" data-sp-bindable="database" data-sp-database-id="vE0AMDTwjp6ZYrgDMrgpPK"></div>
      <div class="garden-stage-label" id="garden-mini-label"></div>
    </div>
    <div style="padding:12px 16px;display:flex;align-items:center;gap:10px">
      <button class="btn btn-pri btn-sm" data-nav="garden">进入花园</button>
      <div style="font-size:12px;color:var(--ink2)" id="garden-mini-hint"></div>
    </div>
  </div>

  <!-- 今日学习计划（闭环①） -->
  <div class="card">
    <h2><span class="dot"></span>今日计划</h2>
    <div id="home-plan" data-sp-bindable="database" data-sp-database-id="gMErhxHviSeVT9J7zBr3rd"></div>
  </div>

  <!-- 今日打卡状态 -->
  <div class="card">
    <h2><span class="dot"></span>今日学习</h2>
    <div id="home-checkin" data-sp-bindable="database" data-sp-database-id="vE0AMDTwjp6ZYrgDMrgpPK"></div>
    <button class="btn btn-rose btn-block" data-nav="checkin">去打卡 / 记录学习</button>
  </div>

  <!-- 学习统计总览 -->
  <div class="card">
    <h2><span class="dot"></span>学习统计</h2>
    <div id="home-stats" data-sp-bindable="database" data-sp-database-id="rdimOnl0QK1DLsS2mCxRws"></div>
    <button class="btn btn-ghost btn-block btn-sm" data-nav="data">查看数据详情</button>
  </div>
</div>

<!-- ==================== 计划页 ==================== -->
<div class="page" id="page-plan">
  <div id="plan-list"></div>
</div>

<!-- ==================== 时政页 ==================== -->
<div class="page" id="page-affairs">
  <div id="affairs-filter"></div>
  <div id="affairs-list"></div>
</div>

<!-- ==================== 申论页 ==================== -->
<div class="page" id="page-essay">
  <div id="essay-tabs" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"></div>
  <div id="essay-list"></div>
</div>

<!-- ==================== 花园页 ==================== -->
<div class="page" id="page-garden">
  <div class="card" style="padding:0;overflow:hidden">
    <div class="garden-full" id="garden-full">
      <div class="garden-stats">
        <div class="gstat"><div class="v" id="g-total-h">0</div><div class="l">累计时长(h)</div></div>
        <div class="gstat"><div class="v" id="g-flower">0</div><div class="l">已开花(株)</div></div>
        <div class="gstat"><div class="v" id="g-next">—</div><div class="l">下一解锁</div></div>
      </div>
      <div id="garden-grid"></div>
    </div>
  </div>
  <div class="card">
    <h2><span class="dot"></span>我的花园进度</h2>
    <div id="garden-progress" data-sp-bindable="database" data-sp-database-id="vE0AMDTwjp6ZYrgDMrgpPK"></div>
  </div>
  <a class="btn btn-ghost btn-block" data-nav="garden-help">查看花园成长说明</a>
</div>

<!-- ==================== 打卡页 ==================== -->
<div class="page" id="page-checkin">
  <div class="card">
    <h2><span class="dot"></span>今天学了什么（点选标签）</h2>
    <div id="ck-categories"></div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>学习数据（结构化填写）</h2>
    <div style="margin-bottom:12px">
      <button class="btn btn-ghost btn-sm" id="btn-ck-scan">📷 拍学习截图，AI 自动填数</button>
      <span id="ck-scan-state" style="font-size:12px;color:var(--ink2);margin-left:8px"></span>
      <input type="file" id="ck-scan-file" accept="image/*" class="hidden">
    </div>
    <div class="form-grid">
      <div class="field"><label>做题总量（道）</label>
        <input class="input" type="number" id="ck-total" min="0" step="1" placeholder="如 50" inputmode="numeric"></div>
      <div class="field"><label>错题数（道）</label>
        <input class="input" type="number" id="ck-wrong" min="0" step="1" placeholder="如 8" inputmode="numeric"></div>
    </div>
    <div class="field"><label>错题集中在哪（选标签，可填数量）</label>
      <div id="ck-wrong-tags"></div>
      <div id="ck-wrong-qty" style="margin-top:6px"></div>
    </div>
    <div class="form-grid">
      <div class="field"><label>学习时长（小时）</label>
        <input class="input" type="number" id="ck-hours" min="0.1" step="0.1" placeholder="2.0" inputmode="decimal"></div>
      <div class="field"><label>心情</label>
        <select class="select" id="ck-mood">
          <option>元气满满</option><option>平稳坚持</option><option>有点疲惫</option><option>电量不足</option>
        </select></div>
    </div>
    <div class="field"><label>今日收获 / 备注（一句话，可选）</label>
      <input class="input" id="ck-note" placeholder="如：逻辑判断的加强削弱终于通了"></div>
    <div class="field"><label>上传证据（截图/照片，可选）</label>
      <div class="photo-grid" id="ck-photos">
        <div class="photo add" id="ck-add-photo">＋</div>
      </div>
      <div class="upload-hint">可上传刷题截图、笔记照片等，作为学习证据（本地保存，最多9张）</div>
      <input type="file" id="ck-file" accept="image/*" multiple class="hidden">
    </div>
    <button class="btn btn-pri btn-block" id="btn-ck-submit">提交打卡 · 自动浇水</button>
  </div>

  <div class="card">
    <h2><span class="dot"></span>近期打卡</h2>
    <div id="ck-history" data-sp-bindable="database" data-sp-database-id="vE0AMDTwjp6ZYrgDMrgpPK"></div>
  </div>
</div>

<!-- ==================== 数据详情页 ==================== -->
<div class="page" id="page-data">
  <div class="card">
    <h2><span class="dot"></span>各模块学习量分布</h2>
    <div id="data-module-chart" data-sp-bindable="database" data-sp-database-id="rdimOnl0QK1DLsS2mCxRws"></div>
  </div>
  <div class="card">
    <h2><span class="dot"></span>各模块正确率</h2>
    <div id="data-acc-chart" data-sp-bindable="database" data-sp-database-id="rdimOnl0QK1DLsS2mCxRws"></div>
  </div>
  <div class="card">
    <h2><span class="dot"></span>薄弱模块诊断</h2>
    <div id="data-weak" data-sp-bindable="database" data-sp-database-id="rdimOnl0QK1DLsS2mCxRws"></div>
  </div>
  <div class="card">
    <h2><span class="dot"></span>学习时长分配</h2>
    <div id="data-donut" data-sp-bindable="database" data-sp-database-id="rdimOnl0QK1DLsS2mCxRws"></div>
  </div>
  <div class="card">
    <h2><span class="dot"></span>数据管理</h2>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-ghost btn-block btn-sm" id="btn-export">导出 JSON 备份</button>
      <button class="btn btn-ghost btn-block btn-sm" id="btn-import">导入恢复</button>
      <button class="btn btn-ghost btn-block btn-sm" id="btn-resync">同步到云端</button>
      <button class="btn btn-ghost btn-block btn-sm" id="btn-clear-demo" style="color:var(--red)">清空示例数据</button>
    </div>
    <input type="file" id="import-file" accept=".json" class="hidden">
    <div style="margin-top:10px;font-size:12px;color:var(--ink3);text-align:center" id="sync-state"></div>
  </div>
</div>

<!-- ==================== 花园说明页 ==================== -->
<div class="page" id="page-garden-help">
  <div class="card">
    <h2><span class="dot"></span>花园成长规则</h2>
    <div id="help-rules"></div>
  </div>
  <div class="card">
    <h2><span class="dot"></span>花卉品种图鉴</h2>
    <div id="help-flowers"></div>
  </div>
</div>

<!-- ==================== 底部导航 ==================== -->
<div class="tabbar">
  <div class="tab on" data-nav="home"><span class="tabdot" data-ic="home"></span>首页</div>
  <div class="tab" data-nav="plan"><span class="tabdot" data-ic="calendar"></span>计划</div>
  <div class="tab" data-nav="affairs"><span class="tabdot" data-ic="news"></span>时政</div>
  <div class="tab" data-nav="essay"><span class="tabdot" data-ic="essay"></span>申论</div>
  <div class="tab" data-nav="garden"><span class="tabdot" data-ic="flower"></span>花园</div>
  <div class="tab" data-nav="checkin"><span class="tabdot" data-ic="check"></span>打卡</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 模态 -->
<div class="mask" id="mask">
  <div class="sheet" id="sheet"></div>
</div>

<!--KB:DATA:START-->
<script>window.KB_DATA={affairs:{items:[]},essay:{real_topics:[],materials:[]},categories:{categories:[]}};</script>
<!--KB:DATA:END-->

</body>
</html>
