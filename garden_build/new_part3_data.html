  /* --- 本地离线数据（兜底） --- */
  function lsGet(k){ try{ return JSON.parse(localStorage.getItem(LS_KEY+k)||'null'); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(LS_KEY+k, JSON.stringify(v)); }catch(e){} }

  function gardenName(){
    var n=lsGet('garden_name');
    return (n&&String(n).trim()) ? String(n).trim().slice(0,12) : '上岸花园';
  }

  /* --- DSDK008: 表单输入本地缓存（debounce 300ms） --- */
  var _formTimer=null;
  function cacheFormInput(formId,name,value){
    if(_formTimer) clearTimeout(_formTimer);
    _formTimer=setTimeout(function(){
      try{
        var d=lsGet('form_'+formId)||{};
        if(value){ d[name]=value; } else { delete d[name]; }
        lsSet('form_'+formId,d);
      }catch(e){}
    },300);
  }
  function clearFormCache(formId){ lsDel('form_'+formId); }
  function restoreFormCache(formId,fn){ var d=lsGet('form_'+formId); if(d&&fn) fn(d); }

  /* --- DSDK008 §7.1: 待提交图片 IndexedDB 缓存 --- */
  function idbOpen(){
    return new Promise(function(res){
      try{
        var req=indexedDB.open('wb_garden_photos',1);
        req.onupgradeneeded=function(e){ e.target.result.createObjectStore('pending'); };
        req.onsuccess=function(e){ res(e.target.result); };
        req.onerror=function(){ res(null); };
      }catch(e){ res(null); }
    });
  }
  function idbPut(key,file){
    return idbOpen().then(function(idb){
      if(!idb||!file) return;
      try{ idb.transaction('pending','readwrite').objectStore('pending').put(file,key); }catch(e){}
    });
  }
  function idbDelete(key){
    return idbOpen().then(function(idb){
      if(!idb) return;
      try{ idb.transaction('pending','readwrite').objectStore('pending').delete(key); }catch(e){}
    });
  }
  function idbClearAll(){
    return idbOpen().then(function(idb){
      if(!idb) return;
      try{ idb.transaction('pending','readwrite').objectStore('pending').clear(); }catch(e){}
    });
  }

  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function daysBetween(a,b){ var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00'); return Math.round((y-x)/86400000); }
  function optId(which,text){
    var arr=OPT[which]; if(!arr) return '';
    for(var i=0;i<arr.length;i++){ if(arr[i].text===text) return arr[i].id; }
    return '';

    if(!keep){ _toastTimer=setTimeout(function(){ t.classList.remove('show'); },2400); }

  /* --- 分页拉取全量数据（三表各一，databaseId 字面量内联） --- */
  function queryStudy(startCursor,acc,guard){
    acc=acc||[]; guard=guard||0;
    if(!state.db) return Promise.resolve([]);
    if(guard>100) return Promise.resolve(acc);
    return state.db.query({databaseId:'rdimOnl0QK1DLsS2mCxRws',sorts:[{property:'日期',direction:'descending'}],pageSize:200,startCursor:startCursor})
      .then(function(r){
        acc=acc.concat(r.results||[]);
        var next=r.nextCursor;
        if(r.hasMore && next && next!==startCursor && (r.results||[]).length){ return queryStudy(next,acc,guard+1); }
        return acc;
      }).catch(function(){ return acc; });
  }

  function addRecordTo(databaseId,key,props,local){

                : addRecordCheckinDB(props);
        run.then(function(){ res(true); }).catch(function(){ res(false); });
      }else{ res(false); }
    }).then(function(ok){

      // 离线降级：写 localStorage

      local.record_id='local_'+(+new Date());

      return false;
    });

  /* --- 图片上传 --- */
  function uploadOne(file){
    if(!state.db || !state.db.uploadImage) return Promise.resolve(null);
    if(file.size>10*1024*1024) return Promise.resolve(null);
    return new Promise(function(res,rej){
      var r=new FileReader();
      r.onload=function(){ res(String(r.result).split(',')[1]||''); };
      r.onerror=function(){ res(null); };
      r.readAsDataURL(file);
    }).then(function(b64){
      if(!b64) return null;
      return state.db.uploadImage({data:b64,contentType:file.type,fileName:file.name}).then(function(r){
        return (r&&r.url)?{title:file.name,imageUrl:r.url}:null;
      }).catch(function(){ return null; });
    });
  }

  /* ==================== 花园成长计算（每花一朵，顺序推进） ==================== */
  /* 累计学习时长（小时）：打卡表时长 + 做题记录折算（每题约0.5分钟） */
  function totalHours(){
    /* 只累计「真实打卡时长」：
       - checkin 学习时长（真实打卡）
       - study 有实际用时分钟的记录（手填/打卡带入）
       - 历史基线（类型=历史基线）只有题量没有时长 → 不再按 0.5min/题 虚估 */
    var h=0;
    state.checkin.forEach(function(c){ h+=num(c['学习时长'])||0; });
    state.study.forEach(function(s){
      var mins=num(s['用时分钟'])||0;
      if(mins>0){ h+=mins/60; }
      // 基线记录（用时0、只有题量）不计入时长——题量只参与正确率统计
    });
    return h;
  }

  /* 核心：根据累计时长，计算每一朵花的成长状态。
     返回数组，每项：{key, variety, name, type, color, stage(0种子/1萌芽/2开花), stageProgress(0~1), hoursLeft(还差多少h到下一阶段/开花), bloom}
     只有「已开始成长」的花才出现在列表里（第0朵从0h就开始，第1朵从16h开始……）。 */
  function flowerProgress(h){
    h=(h==null)?totalHours():h;
    var arr=[];
    for(var i=0;i<VAR_ORDER.length;i++){
      var k=VAR_ORDER[i];
      var v=VARIETIES[k];
      var start=i*FLOWER_TOTAL_HOURS;   // 第 i 朵花从 start 小时开始成长
      if(h<=start) break;              // 还没轮到这朵
      var local=h-start;               // 这朵花自己的累计时长（0~16）
      var stage, stageProgress, hoursLeft, done=false;
      if(local>=FLOWER_TOTAL_HOURS){
        stage=STAGE_BLOOM; stageProgress=1; hoursLeft=0; done=true;  // 已开花
      }else if(local>=STAGE_HOURS[0]+STAGE_HOURS[1]){
        // 萌芽期已完成，正在开花期
        stage=STAGE_BLOOM;
        var remain=FLOWER_TOTAL_HOURS-local;
        hoursLeft=remain;
        stageProgress=Math.max(0,Math.min(1,(local-(STAGE_HOURS[0]+STAGE_HOURS[1]))/STAGE_HOURS[2]));
      }else if(local>=STAGE_HOURS[0]){
        // 种子期已完成，正在萌芽期
        stage=STAGE_SPROUT;
        hoursLeft=(STAGE_HOURS[0]+STAGE_HOURS[1])-local;
        stageProgress=Math.max(0,Math.min(1,(local-STAGE_HOURS[0])/STAGE_HOURS[1]));
      }else{
        // 种子期进行中
        stage=STAGE_SEED;
        hoursLeft=STAGE_HOURS[0]-local;
        stageProgress=Math.max(0,Math.min(1,local/STAGE_HOURS[0]));
      }
      arr.push({key:k, variety:k, name:v.name, type:v.type, color:v.color, petal:v.petal, inner:v.inner, center:v.center, stroke:v.stroke,
                stage:stage, stageProgress:stageProgress, hoursLeft:Math.round(hoursLeft*10)/10, done:done, bloom:v.bloom, idx:i});
    }
    return arr;
  }

  /* 已完全开花的花朵数 */
  function totalFlowers(){
    var fp=flowerProgress();
    var n=0;
    fp.forEach(function(f){ if(f.done) n++; });
    return n;
  }

  /* 已解锁（已开始成长）的品种列表 */
  function unlockedVarieties(h){
    return flowerProgress(h).map(function(f){ return f.key; });
  }

  /* 下一朵未开始的花（鼓励提示用）；全开完返回 null */
  function nextUnlock(h){
    h=(h==null)?totalHours():h;
    var n=Math.floor(h/FLOWER_TOTAL_HOURS);  // 已完整开出的花数
    if(n>=VAR_ORDER.length) return null;
    return VARIETIES[VAR_ORDER[n]];          // 正在成长中的这一朵
  }

  /* 当前正在成长的那朵花（未完成的一朵） */
  function currentGrowingFlower(h){
    h=(h==null)?totalHours():h;
    var fp=flowerProgress(h);
    for(var i=0;i<fp.length;i++){ if(!fp[i].done) return fp[i]; }
    return null;
  }
  /* 连续打卡天数 */
  function streakDays(){
    var days={};
    state.checkin.forEach(function(c){ var d=String(c['日期']||'').slice(0,10); if(d) days[d]=1; });
    var s=0, d=new Date();
    var first=true; // 今天还没打卡时，允许从昨天起算（不断签）
    while(true){
      var key=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
      if(days[key]){ s++; d.setDate(d.getDate()-1); first=false; }
      else if(first && key===todayStr()){ d.setDate(d.getDate()-1); first=false; }
      else break;
    }
    return s;
  }
  function checkedToday(){
    var t=todayStr();
    return state.checkin.some(function(c){ return String(c['日期']||'').slice(0,10)===t; });
  }

  /* ==================== 今日学习统计（来自打卡/学习记录） ==================== */
  function todayQuizStats(){
    var t=todayStr(), q=0, w=0;
    state.study.forEach(function(s){
      if(String(s['日期']||'').slice(0,10)===t){ q+=num(s['题量'])||0; w+=num(s['错题数'])||0; }
    });
    return {q:q,w:w,acc:q>0?Math.round((q-w)/q*100):null};
  }
  function todaySunValue(){
    // 阳光值 = 今日学习时长（小时）× 10（打卡是主要数据来源）
    var t=todayStr(), h=0;
    state.checkin.forEach(function(c){ if(String(c['日期']||'').slice(0,10)===t) h+=num(c['学习时长'])||0; });
    if(h===0){
      state.study.forEach(function(s){ if(String(s['日期']||'').slice(0,10)===t) h+=(num(s['用时分钟'])||0)/60; });
    }
    return Math.round(h*10);
  }

  /* 暴露到全局 */
  window.DB_STUDY=DB_STUDY; window.DB_TASK=DB_TASK; window.DB_CHECKIN=DB_CHECKIN;
  window.state=state;
  window.VARIETIES=VARIETIES; window.VAR_ORDER=VAR_ORDER; window.STAGES=STAGES;
  window.lsGet=lsGet; window.lsSet=lsSet; window.lsDel=lsDel; window.gardenName=gardenName;
  window.cacheFormInput=cacheFormInput; window.clearFormCache=clearFormCache; window.restoreFormCache=restoreFormCache;
  window.idbPut=idbPut; window.idbDelete=idbDelete; window.idbClearAll=idbClearAll;
  window.optId=optId; window.num=num; window.esc=esc;
  window.todayStr=todayStr; window.daysBetween=daysBetween; window.pad=pad; window.sanitizeHtml=sanitizeHtml;
  window.totalHours=totalHours; window.totalFlowers=totalFlowers; window.unlockedVarieties=unlockedVarieties;
  window.nextUnlock=nextUnlock; window.streakDays=streakDays; window.checkedToday=checkedToday;
  window.flowerProgress=flowerProgress; window.currentGrowingFlower=currentGrowingFlower;
  window.FLOWER_TOTAL_HOURS=FLOWER_TOTAL_HOURS; window.STAGE_HOURS=STAGE_HOURS;
  window.STAGE_SEED=STAGE_SEED; window.STAGE_SPROUT=STAGE_SPROUT; window.STAGE_BLOOM=STAGE_BLOOM;
  window.todayQuizStats=todayQuizStats; window.todaySunValue=todaySunValue;
  window.addStudyRecord=addStudyRecord; window.addTaskRecord=addTaskRecord; window.addCheckinRecord=addCheckinRecord;
  window.uploadOne=uploadOne;
  window.loadData=loadData; window.loadSchemas=loadSchemas;
  window.EXAM_SK=EXAM_SK; window.EXAM_GK=EXAM_GK;
})();
</script>
